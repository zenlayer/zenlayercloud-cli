name: DetachDisks
product: zec
use: detach-disks
short: 卸载云硬盘
long: |-
  将云硬盘从主机实例上卸载。
  **注意事项**

  * 单次最多可卸载10块云硬盘。
  * 若某块云硬盘已经处于未挂载状态，视为已达成目标状态，直接跳过。
  * 若某块云硬盘不满足卸载条件（云硬盘类型不为`DATA`、可插拔不为`true`、状态不为`IN_USE`、`instanceCheckFlag` 为 `true` 时挂载的实例未关机等），只会导致这一块云硬盘卸载失败，其 ID 会出现在响应的 `failedDiskIds` 中，不影响其余云硬盘正常卸载。
  * 请求中包含不存在的云硬盘 ID 会被静默忽略，不会导致请求失败，也不会出现在 `failedDiskIds` 中。
examples:
- cmd: zeno zec detach-disks --disk-ids your-disk-id
  desc: 从云主机实例上卸载单块或多块云硬盘。
sdk:
  service: zec
  version: '2025-09-01'
  action: DetachDisks
parameters:
- name: disk-ids
  type: string-array
  required: true
  sdk-field: diskIds
  description: 要卸载的云盘ID列表。
- name: instance-check-flag
  type: boolean
  required: false
  sdk-field: instanceCheckFlag
  description: |-
    是否检测实例的运行状态。
    默认为true，即实例关机才允许被卸载。
    否则必须实例关机才能调用本接口。
response:
- name: failedDiskIds
  type: string-array
  description: 解绑失败的云硬盘。
