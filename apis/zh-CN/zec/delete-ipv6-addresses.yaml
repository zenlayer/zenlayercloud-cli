name: DeleteIpv6Addresses
product: zec
use: delete-ipv6-addresses
short: 批量删除公网IPv6
long: |-
  批量删除公网 IPv6。逐个独立处理，部分失败不影响其余项，失败项通过 failedIpv6Addresses 返回其错误码与错误信息。
  **注意事项**

  * 网卡上的公网 IPv6 被删除后，网卡的堆栈类型会从 `IPv4_IPv6` 降级为 `IPv4`。仅有 IPv6 地址的网卡不允许删除其公网 IPv6。
  * 负载均衡上的公网 IPv6 可以单独删除；负载均衡本身被删除时，其上的公网 IPv6 会一并回收，无需单独调用本接口。
  * 传入的公网 IPv6 逐个独立处理，部分失败不影响其余项的删除。失败项通过 `failedIpv6Addresses` 返回各自的错误码与错误信息，接口本身仍返回成功。
examples:
- cmd: zeno zec delete-ipv6-addresses --ipv6-ids <ipv6Id1> --ipv6-ids <ipv6Id2>
  desc: 批量删除公网IPv6，全部成功。
sdk:
  service: zec
  version: '2025-09-01'
  action: DeleteIpv6Addresses
parameters:
- name: ipv6-ids
  type: string-array
  required: true
  sdk-field: ipv6Ids
  description: 要删除的公网 IPv6 的 ID 列表。
response:
- name: failedIpv6Addresses
  type: object-array
  description: |-
    删除失败的公网IPv6详情列表。
    若全量成功则为空。
  array-style: json
  item-schema:
  - name: ipv6Id
    type: string
    description: 删除失败的公网IPv6的ID。
  - name: errorCode
    type: string
    description: 错误码。
  - name: errorMsg
    type: string
    description: 错误消息。
