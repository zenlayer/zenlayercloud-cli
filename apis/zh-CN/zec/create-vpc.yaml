name: CreateVpc
product: zec
use: create-vpc
short: 创建全球VPC
long: 创建全球VPC。
examples:
- cmd: zeno zec create-vpc --name vpcXXX --cidr-block 10.0.0.0/9 --mtu 1300
  desc: 创建VPC。
- cmd: zeno zec create-vpc --name vpcXXX --cidr-block 21.0.0.0/9,22.0.0.0/9 --mtu 1300
  desc: 创建多网段的VPC。
sdk:
  service: zec
  version: '2025-09-01'
  action: CreateVpc
parameters:
- name: name
  type: string
  required: true
  sdk-field: name
  description: |-
    VPC的名称。
    范围2到63个字符。
    仅支持输入字母、数字、-和英文句点(.)。
    且必须以数字或字母开头和结尾。
- name: cidr-block
  type: string
  required: true
  sdk-field: cidrBlock
  description: |-
    VPC的CIDR地址段，该VPC下所有子网必须落在此网段内。
    掩码范围为9到29，且必须填写网段的起始地址，例如 10.0.0.0/16。
    支持配置多个网段，多个网段之间以英文逗号分隔，例如：21.0.0.0/9,22.0.0.0/9，各网段之间不能重叠。
    单个VPC的网段数量上限由配额 ZEC_CIDR_IPv4_Blocks_per_VPC 控制，默认为5个，可申请提升。
    不能与以下保留网段重叠：0.0.0.0/8、100.64.0.0/10、127.0.0.0/8、169.254.0.0/16、224.0.0.0/4。
- name: mtu
  type: integer
  required: true
  sdk-field: mtu
  description: VPC的MTU（最大传输单元）。支持：1300、1500、9000。
- name: enable-pri-ipv6
  type: boolean
  required: false
  sdk-field: enablePriIpv6
  description: |-
    是否开启内网IPv6。
    一旦开启，后续无法关闭。
    默认为关闭。
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    VPC所在的资源组ID。
    如果不指定资源组，则会放到默认的资源组中。
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: 创建VPC时关联的标签。同一资源中标签键不能重复。--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      标签键。
      长度限制：1～64个字符。
  - name: value
    type: string
    description: |-
      标签值。
      长度限制：1～64个字符。
response:
- name: vpcId
  type: string
  description: 创建的VPC ID。
