name: AssociateEipAddress
product: zec
use: associate-eip-address
short: 绑定弹性公网IP
long: |-
  批量将弹性公网IP（EIP）绑定到同地域的云产品实例上。
  **注意事项**

  * 你可以通过 DescribeLoadBalancers 接口来查看支持绑定负载均衡的实例。
  * 你可以通过 DescribeNetworkInterfaces 接口来查看支持绑定的虚拟网卡。
  * 你可以通过 DescribeNatGateways 接口来查看支持绑定的NAT网关。
  * 你可以通过 DescribeHaVips 接口来查看支持绑定的高可用虚拟IP。
  * 参数`loadBalancerId`、`nicId`、`natId`、`haVipId`必须传1个。如果多个字段同时传入，则按`loadBalancerId`、`nicId`、`natId`、`haVipId`顺序优先使用。
  * 通过`loadBalancerId`绑定负载均衡实例时，`bindType`不生效（负载均衡无需指定绑定方式），传入的值会被忽略。
  * 通过`loadBalancerId`绑定负载均衡实例时，支持单IP（掩码`/32`）与网段类型的EIP；绑定到虚拟网卡的网段类型EIP只支持`Passthrough`（可见模式），绑定NAT网关与高可用虚拟IP不支持网段类型的EIP。
  * 通过`haVipId`绑定高可用虚拟IP时，`bindType`只能为`FullNat`（普通NAT模式），传其他值本次请求的EIP将全部绑定失败。
  * 如果遇到绑定数量超过了限制，可以联系Support来提高配额。
  * 接口会返回绑定失败的eip id集合，如果是空的则说明全部成功。
examples:
- cmd: zeno zec associate-eip-address --nic-id <nicId> --lan-ip 10.0.0.2 --eip-ids <eipId1> --eip-ids <eipId2> --bind-type Passthrough
  desc: 将多个弹性公网IP（EIP）绑定到指定网卡上， 并指定方式为可见模式。
- cmd: zeno zec associate-eip-address --load-balancer-id <loadBalancerId> --eip-ids <eipId1> --eip-ids <eipId2>
  desc: 将多个弹性公网IP（EIP）绑定到指定负载均衡时实例上。
- cmd: zeno zec associate-eip-address --nat-id <natId> --eip-ids <eipId1> --eip-ids <eipId2>
  desc: 将多个弹性公网IP（EIP）绑定到指定NAT网关上。
- cmd: zeno zec associate-eip-address --ha-vip-id <haVipId> --eip-ids <eipId1>
  desc: 将一个弹性公网IP（EIP）绑定到高可用虚拟IP（HaVip）上。
- cmd: zeno zec associate-eip-address --ha-vip-id <haVipId> --eip-ids <eipId1> --eip-ids <eipId2>
  desc: 将多个弹性公网IP（EIP）同时绑定到高可用虚拟IP（HaVip）上。
sdk:
  service: zec
  version: '2025-09-01'
  action: AssociateEipAddress
parameters:
- name: load-balancer-id
  type: string
  required: false
  sdk-field: loadBalancerId
  description: |-
    负载均衡实例的ID。
    仅ipStackType为IPv4的负载均衡可绑定弹性IP——负载均衡只支持单栈，IPv6的公网地址通过AssignLoadBalancerIpv6接口分配。
- name: nic-id
  type: string
  required: false
  sdk-field: nicId
  description: 虚拟网卡的ID。
- name: lan-ip
  type: string
  required: false
  sdk-field: lanIp
  description: |-
    要绑定的网卡上的内网IP地址。
    当IP绑定的是网卡, 则该字段不能为空。
- name: nat-id
  type: string
  required: false
  sdk-field: natId
  description: NAT网关的ID。
- name: eip-ids
  type: string-array
  required: true
  sdk-field: eipIds
  description: |-
    要绑定的EIP的ID。
    EIP 必须是未绑定状态。
- name: ha-vip-id
  type: string
  required: false
  sdk-field: haVipId
  description: 高可用虚拟IP的ID。
- name: bind-type
  type: enum
  required: false
  sdk-field: bindType
  description: |-
    绑定类型。
    当绑定的是网卡时生效。
    默认为普通NAT模式。
  enum-values:
  - value: FullNat
    desc: 普通NAT模式。
  - value: Passthrough
    desc: 高速模式。
response:
- name: failedEipIds
  type: string-array
  description: 绑定失败的IP。
