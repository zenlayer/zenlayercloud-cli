name: ModifyInstancesAttribute
product: zec
use: modify-instances-attribute
short: 修改实例属性（名称）
long: |-
  修改实例属性（名称）。
  **注意事项**

  * 支持批量操作。每次请求批量实例的上限为100。
  * 如果其中有实例ID不存在，则本操作会立即失败。
examples:
- cmd: zeno zec modify-instances-attribute --instance-ids instanceId1 --instance-ids instanceId2 --instance-name Test-Instance
  desc: 批量修改实例的名称。
- cmd: zeno zec modify-instances-attribute --instance-ids instanceId1 --instance-ids instanceId2 --instance-ids instanceId3 --instance-name Test-Instance-[1,1]
  desc: ''
sdk:
  service: zec
  version: '2025-09-01'
  action: ModifyInstancesAttribute
parameters:
- name: instance-ids
  type: string-array
  required: true
  sdk-field: instanceIds
  description: 待修改属性的实例ID列表。
- name: instance-name
  type: string
  required: true
  sdk-field: instanceName
  description: |-
    实例名称。
    范围2到63个字符。
    仅支持输入字母、数字、英文句点(.)、下划线(_)、斜杠(/)和连字符(-)，且必须以字母或数字开头和结尾。
    批量修改多台实例时，可以指定模式串[begin_number,bits]，按instanceIds列表的顺序依次编号。
    begin_number：有序数值的起始值，取值支持[0,99999]。
    bits：有序数值所占的位数，取值支持[1,6]，位数不足时前面补0，数值超出该位数时不截断。
    注意模式串中不得有空格。
    例如修改2台实例时，指定server-[3,3]，实例名称分别为server-003、server-004。
    支持指定多个模式串，如server-[3,3]-[1,1]。
    不指定模式串时，所有实例修改为同一名称。
