name: CreateEips
product: zec
use: create-eips
short: 创建弹性公网IP
long: |-
  创建弹性公网IP。
  **注意事项**

  * 可以通过调用 ~~DescribeEipRegions~~ 来查询支持弹性IP的区域。
  * 可以通过调用 ~~DescribeEipInternetChargeTypes~~ 来查询公网IP支持的网络计费方式。
  * 如果需要创建`Remote EIP`，可以先调用 ~~DescribeEipRemoteRegions~~ 来查询支持的远端节点。
  * 如果需要通过`CIDR`进行分配，可以先调用 ~~DescribeCidrs~~ 来查询账号下的`CIDR`。
  * 如果同时绑定实例，需要保证所选实例的`主网卡`上的`主内网IP`还能再分配EIP。
examples:
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 1 --name Test-EIP --internet-charge-type ByTrafficPackage --network-line-type PremiumBGP --bandwidth 50 --flow-package 10 --rate-limit-mode LOOSE
  desc: 创建一个BGP线路的公网弹性IP, 使用流量包计费。流量包大小为10TB。带宽限速为50Mbps。
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 2 --name Test-EIP --internet-charge-type ByBandwidth --cidr-id <cidrId> --bandwidth 50
  desc: 从CIDR里分配2个公网弹性IP, 使用固定带宽计费。带宽限速为50Mbps。
- cmd: zeno zec create-eips --region-id na-east-1 --amount 1 --name Test-EIP --internet-charge-type BandwidthCluster --cluster-id <clusterId> --cidr-id <cidrId> --prefix-length 32 --instance-ids <instanceId> --bind-type FullNat
  desc: 从BYOIP的`CIDR`（如`128.0.0.0/24`）里分配单个`/32`的弹性IP并绑定实例。`prefixLength`默认为32，可以省略；NAT模式（默认）与`Passthrough`模式均支持。
- cmd: zeno zec create-eips --region-id na-east-1 --amount 1 --name Test-EIP --internet-charge-type BandwidthCluster --cluster-id <clusterId> --cidr-id <cidrId> --prefix-length 24 --instance-ids <instanceId> --bind-type Passthrough
  desc: 从掩码为`/24`的BYOIP `CIDR`里分配一个`/24`的弹性IP（EIP Block）并绑定实例。`/24`的BYOIP `CIDR`只能分配出一个`/24`的EIP，因此`amount`只能为1。EIP Block（`prefixLength`小于32）只支持`Passthrough`绑定模式，不支持NAT模式。
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 3 --name Test-EIP --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth 50 --instance-id <instanceId>
  desc: 创建3个公网弹性IP，全部绑定到同一台实例上（`instanceId`）。
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 2 --name Test-EIP --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth 50 --instance-ids <instanceId1> --instance-ids <instanceId2>
  desc: 创建2个公网弹性IP，每个各绑定一台不同的实例（`instanceIds`，数量需与`amount`一致）。
sdk:
  service: zec
  version: '2025-09-01'
  action: CreateEips
parameters:
- name: region-id
  type: string
  required: true
  sdk-field: regionId
  description: 创建EIP所在的节点ID。
- name: name
  type: string
  required: true
  sdk-field: name
  description: |-
    EIP的名称。
    范围2到63个字符。
    仅支持输入字母、数字、-/_和英文句点(.)。
    且必须以数字或字母开头和结尾。
- name: internet-charge-type
  type: enum
  required: true
  sdk-field: internetChargeType
  description: 公网弹性IP的网络计费方式。
  enum-values:
  - value: ByBandwidth
    desc: 固定带宽计费方式。
  - value: ByTrafficPackage
    desc: 流量包计费方式。
  - value: BandwidthCluster
    desc: 共享带宽包计费方式。
- name: amount
  type: integer
  required: false
  sdk-field: amount
  description: 需要创建EIP的数量。
- name: prefix-length
  type: integer
  required: false
  sdk-field: prefixLength
  description: |-
    掩码长度，取值范围20–32，默认32。
    指定小于32时，创建EIP Block资源，必须同时指定cidrId，且不能小于所选CIDR自身的掩码长度。
- name: eip-v4-type
  type: enum
  required: false
  sdk-field: eipV4Type
  description: |-
    公网弹性IP的线路类型。
    已废弃，请使用networkLineType。
  deprecated: true
  enum-values:
  - value: BGPLine
    desc: BGP 线路。
  - value: CN2Line
    desc: CN2 回国优化线路。
  - value: LocalLine
    desc: 本地IP。
  - value: ChinaMobile
    desc: 中国移动线路。
  - value: ChinaUnicom
    desc: 中国联通线路。
  - value: ChinaTelecom
    desc: 中国电信线路。
  - value: Cogent
    desc: Cogent。
  - value: PathBasedBandwidthIP
    desc: 多路径带宽 IP。
- name: network-line-type
  type: enum
  required: false
  sdk-field: networkLineType
  description: 公网弹性IP的线路类型。
  enum-values:
  - value: PremiumBGP
    desc: |-
      优质 BGP。
      高性能网络。
  - value: CN2
    desc: 回国优化线路。
  - value: PathBasedBandwidthIP
    desc: 多路径带宽 IP。
  - value: LocalLine
    desc: 本地IP。
  - value: StandardBGP
    desc: |-
      标准 BGP。
      通用网络，成本优化。
  - value: CMI
    desc: 中国移动。
  - value: CUG
    desc: 中国联通。
  - value: CTG
    desc: 中国电信。
- name: primary-isp
  type: enum
  required: false
  sdk-field: primaryIsp
  description: 主公网IP的运营商。
  deprecated: true
  enum-values:
  - value: BGP
    desc: 优质BGP。
  - value: CN2
    desc: 回国专线。
  - value: PathBasedBandwidth
    desc: 多路径带宽 IP。
  - value: LOCAL
    desc: 本地IP。
  - value: CHINA_MOBILE
    desc: 中国移动。
  - value: CHINA_UNICOM
    desc: 中国联通。
  - value: CHINA_TELECOM
    desc: 中国电信。
  - value: COGENT
    desc: 标准 BGP。
- name: bandwidth
  type: integer
  required: false
  sdk-field: bandwidth
  description: |-
    公网弹性IP的带宽限速。
    单位：Mbps。
- name: cidr-id
  type: string
  required: false
  sdk-field: cidrId
  description: |-
    指定CIDR ID，使用CIDR内分配弹性IP。
    该字段和eipV4Type不能同时指定。
- name: public-ip
  type: string
  required: false
  sdk-field: publicIp
  description: |-
    指定公网起始地址开始创建弹性IP。
    不指定cidrId时，从公网IP池按此地址开始顺序分配（仅支持prefixLength为32）；指定cidrId时，从该CIDR内按此地址开始分配。
    prefixLength为32时填纯IPv4地址；prefixLength小于32时必须同时指定cidrId，填带掩码的起始网段（掩码须与prefixLength一致，如88.0.5.64/26）。
    指定cidrId时，该起始地址/网段必须是所选CIDR当前可分配的候选之一。
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: 弹性公网IP所放的资源组ID，如不指定则放入默认资源组。
- name: flow-package
  type: float
  required: false
  sdk-field: flowPackage
  description: |-
    弹性公网IP的流量包大小。
    单位为TB。
    值要求为0或0.1的倍数。
    当网络计费方式为流量计费(ByTrafficPackage)时需要指定。
    仅当计费周期为月时支持设置，小时计费不支持。
- name: cluster-id
  type: string
  required: false
  sdk-field: clusterId
  description: |-
    共享带宽包ID。
    当网络计费方式为共享带宽包计费(BandwidthCluster)时需要指定。
- name: peer-region-id
  type: string
  required: false
  sdk-field: peerRegionId
  description: 远端的节点ID。
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: 市场营销的相关选项。
  object-schema:
  - name: discountCode
    type: string
    description: |-
      使用市场发放的折扣码。
      如果折扣码不存在，最终折扣将不会生效。
  - name: usePocVoucher
    type: boolean
    description: |-
      是否使用POC代金券。
      如果系统不存在POC代金券，相关创建流程会失败。
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    弹性公网IP绑定的标签。
    注意：实例关联标签键不能重复。--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      标签键。
      长度限制：1～64个字符。
  - name: value
    type: string
    description: |-
      标签值。
      长度限制：1～64个字符。
- name: instance-id
  type: string
  required: false
  sdk-field: instanceId
  description: |-
    要绑定的实例ID。
    本批次创建的EIP全部绑定到该实例。
- name: instance-ids
  type: string-array
  required: false
  sdk-field: instanceIds
  description: |-
    要绑定的实例ID集合。
    数量需要与amount字段一致，每个EIP各绑定一个不同实例；与instanceId同时传递时以instanceId为准。
- name: bind-type
  type: enum
  required: false
  sdk-field: bindType
  description: |-
    绑定类型。
    当指定instanceIds时生效。
    默认为普通NAT模式。
    prefixLength小于32（EIP Block）时只能为Passthrough。
  enum-values:
  - value: FullNat
    desc: 普通NAT模式。
  - value: Passthrough
    desc: 高速模式。
- name: rate-limit-mode
  type: enum
  required: false
  sdk-field: rateLimitMode
  description: |-
    限速模式。
    STRICT严格模式必须同时指定bandwidth。
  enum-values:
  - value: LOOSE
    desc: 宽松模式：允许短时间突发超出限制。
  - value: STRICT
    desc: 严格模式：严格限制，不允许任何突发。
response:
- name: eipIds
  type: string-array
  description: 创建的弹性公网IP ID列表。
- name: orderNumber
  type: string
  description: 本次创建的订单编号。
