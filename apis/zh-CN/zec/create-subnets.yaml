name: CreateSubnets
product: zec
use: create-subnets
short: 批量创建子网
long: |-
  在同一个VPC下批量创建多个子网。
  **注意事项**

  * 批量创建的子网必须属于同一个VPC，单次请求最多支持创建10个子网。
  * 该批次内的子网要么全部创建成功，要么全部不创建：只要其中任意一个子网的参数校验或创建失败，整个请求都不会创建任何子网。
  * 同一个VPC能创建的子网资源个数也是有限制的，每个子网的CIDR网段必须属于VPC的CIDR网段内。
  * 同一个VPC内，子网的CIDR地址段不可有重叠，本次请求内的多个子网之间的CIDR地址段也不可有重叠：与VPC下已有子网冲突返回`OPERATION_DENIED_SUBNET_CIDR_CONFLICT`，与本次请求内其他子网冲突返回`OPERATION_DENIED_SUBNET_CIDR_CONFLICT_WITH_BATCH`。
  * 调用 ~~DescribeSubnetRegion~~ 接口查询子网区域是否支持创建。
examples:
- cmd: zeno zec create-subnets --vpc-id <vpcId> --subnets "{regionId=asia-east-1, stackType=IPv4_IPv6, ipv6Type=Public, name=Subnet-asia-east-1-01, cidrBlock=10.0.0.0/24}" --subnets "{regionId=asia-east-1, stackType=IPv4, name=Subnet-asia-east-1-02, cidrBlock=10.0.1.0/24}"
  desc: 在同一个VPC下批量创建2个子网。
sdk:
  service: zec
  version: '2025-09-01'
  action: CreateSubnets
parameters:
- name: vpc-id
  type: string
  required: true
  sdk-field: vpcId
  description: |-
    需要添加子网的VPC ID。
    批量创建的子网均属于同一个VPC。
- name: subnets
  type: object-array
  required: true
  sdk-field: subnets
  description: |-
    待创建的子网列表。
    单次请求最多支持创建10个子网。
    该批次内的子网要么全部创建成功，要么全部不创建。
  array-style: json
  item-schema:
  - name: name
    type: string
    description: |-
      子网名称。
      范围2到63个字符。
      仅支持输入字母、数字、连字符(-)、下划线(_)、斜杠(/)、英文句点(.)和空格。
      且必须以数字或字母开头和结尾。
  - name: regionId
    type: string
    description: |-
      子网所在节点的ID。
      必须是VPC所在节点之一。
  - name: stackType
    type: enum
    description: |-
      子网的IP堆栈类型。
      可选值：IPv4（仅IPv4）、IPv4_IPv6（IPv4和IPv6双栈）、IPv6（仅IPv6）。
    enum-values:
    - value: IPv4
      desc: 仅IPv4。
    - value: IPv4_IPv6
      desc: IPv4和IPv6。
    - value: IPv6
      desc: 仅IPv6。
  - name: cidrBlock
    type: string
    description: |-
      子网的IPv4 CIDR地址段。
      如果指定堆栈类型`stackType` 包含 `IPv4`, 则该字段必填。
      指定的CIDR地址段必须属于VPC的CIDR范围内，且不能与VPC下已有子网或本次批量请求中的其他子网CIDR重叠。
  - name: ipv6Type
    type: enum
    description: |-
      IPv6的类型。
      如果指定堆栈类型`stackType` 包含 `IPv6`, 则该字段必填。
    enum-values:
    - value: Private
      desc: 内网类型。
    - value: Public
      desc: 公网类型。
  - name: dhcpOptionsSetId
    type: string
    description: 要绑定的DHCP 选项集ID。
  - name: ipv6CidrBlockId
    type: string
    description: |-
      公网IPv6 CIDR ID。
      该字段仅当`ipv6Type`是公网(`Public`)时允许指定。
      如果不指定，将从系统默认IP池里分配。
  - name: ipv6MaskLength
    type: integer
    description: |-
      分配给虚拟机（VM）的IPv6 CIDR前缀的大小。
      该参数必须与`ipv6CidrBlockId`参数配合使用。
      当未显式传递时，默认值为96。
      最小必须大于或等于指定`ipv6CidrBlockId`的前缀，最大不能超过96。
response:
- name: subnetIds
  type: string-array
  description: 创建的子网ID列表，顺序与请求中的子网列表一致。
