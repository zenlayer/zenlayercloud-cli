name: DescribeBillDetail
product: zbc
use: describe-bill-detail
short: 查询月账单明细
long: 获取月账单明细相关数据信息（包含月账单总费用等信息），支持按订单或资源ID筛选。
examples:
- cmd: zeno zbc describe-bill-detail --bill-monthly 202307 --resource-id 945345672712820433 --page-num 1 --page-size 2
  desc: 按资源 ID 查询指定月份的账单明细。
- cmd: zeno zbc describe-bill-detail --product Compute
  desc: 按产品筛选，使用默认分页与默认月份。
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeBillDetail
parameters:
- name: bill-monthly
  type: integer
  required: false
  sdk-field: billMonthly
  description: |-
    账单月份，默认当前月。
    格式yyyyMM。
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: 每页大小，不能超过5000，超过5000返回5000条。
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: 页码，默认1。
- name: resource-id
  type: string
  required: false
  sdk-field: resourceId
  description: 资源ID（实例ID）。
- name: order-sn
  type: string
  required: false
  sdk-field: orderSn
  description: 订单号。
- name: product
  type: string
  required: false
  sdk-field: product
  description: 产品名称。
response:
- name: totalCount
  type: integer
  description: 符合条件的数据总数。
- name: dataSet
  type: object-array
  description: 结果集。
  array-style: json
  item-schema:
  - name: billMonthly
    type: integer
    description: 交易月份。
  - name: label
    type: string
    description: 产品名称。
  - name: resourceId
    type: string
    description: 资源ID（实例ID）。
  - name: product
    type: string
    description: 产品线。
  - name: productSubitem
    type: string
    description: 产品子项。
  - name: billingMode
    type: string
    description: 计费模式。
  - name: orderSn
    type: string
    description: 订单编号。
  - name: deductionTime
    type: string
    description: |-
      扣费时间。
      时间格式：yyyy-MM-ddTHH:mm:ssZ。
  - name: amount
    type: float
    description: 账单金额。
  - name: voucher
    type: float
    description: 赠金支付金额。
  - name: cash
    type: float
    description: 现金支付金额。
  - name: location
    type: string
    description: 地域。
  - name: resourceGroupId
    type: string
    description: 资源组ID。
  - name: resourceGroupName
    type: string
    description: 资源组名称。
  - name: startTime
    type: string
    description: |-
      开始时间。
      时间格式：yyyy-MM-ddTHH:mm:ssZ。
  - name: endTime
    type: string
    description: |-
      结束时间。
      时间格式：yyyy-MM-ddTHH:mm:ssZ。
- name: totalSpend
  type: float
  description: 总支出。
- name: totalVoucher
  type: float
  description: 代金券总支付金额。
- name: totalCash
  type: float
  description: 现金总支付金额。
- name: totalRefund
  type: float
  description: 退款总金额。
