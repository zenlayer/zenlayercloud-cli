name: DescribeMonthlyBillSummary
product: zbc
use: describe-monthly-bill-summary
short: 查询月账单汇总
long: 获取产品或资源组维度月账单汇总金额信息以及账单总帐信息。
examples:
- cmd: zeno zbc describe-monthly-bill-summary --bill-monthly 202307 --summary-type RESOURCE_GROUP
  desc: 按资源组维度查询指定月份的账单汇总。
- cmd: zeno zbc describe-monthly-bill-summary
  desc: 使用默认维度与默认月份查询。
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeMonthlyBillSummary
parameters:
- name: bill-monthly
  type: integer
  required: false
  sdk-field: billMonthly
  description: 账单月份，默认当前月。
- name: summary-type
  type: enum
  required: false
  sdk-field: summaryType
  description: 账单分组维度，默认 PRODUCT。
  enum-values:
  - value: PRODUCT
    desc: 产品维度。
  - value: RESOURCE_GROUP
    desc: 资源组维度。
response:
- name: billMonthly
  type: integer
  description: 账单月份。
- name: totalSpend
  type: float
  description: 总支出。
- name: totalVoucher
  type: float
  description: 代金券总支付金额。
- name: totalCash
  type: float
  description: 现金总支付金额。
- name: totalRefund
  type: float
  description: 退款总金额。
- name: summaryInfoList
  type: object-array
  description: 账单分组列表。
  array-style: json
  item-schema:
  - name: product
    type: string
    description: 产品。
  - name: resourceGroupId
    type: string
    description: 资源组ID。
  - name: resourceGroupName
    type: string
    description: 资源组名称。
  - name: spend
    type: float
    description: 支出金额。
  - name: voucher
    type: float
    description: 代金券支付金额。
  - name: cash
    type: float
    description: 现金支付金额。
  - name: refund
    type: float
    description: 退款金额。
