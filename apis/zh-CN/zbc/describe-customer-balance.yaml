name: DescribeCustomerBalance
product: zbc
use: describe-customer-balance
short: 查询账户余额
long: 查询当前账户的余额信息，包括账户余额、信用额度、可用金、冻结金等数据信息。
examples:
- cmd: zeno zbc describe-customer-balance
  desc: 获取用户余额。
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeCustomerBalance
response:
- name: accountUid
  type: string
  description: 账户唯一标识。
- name: cashBalance
  type: float
  description: |-
    账户余额。
    可能为负值，表示账户欠费。
- name: creditValue
  type: float
  description: 信用额度。
- name: purchasingPower
  type: float
  description: |-
    可用金。
    由账户余额与信用额度之和实时计算得出。
- name: orderFrozenAmount
  type: float
  description: 订单冻结金。
