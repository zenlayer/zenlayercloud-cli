name: DescribeRechargeRefundHistory
product: zbc
use: describe-recharge-refund-history
short: 获取账户的充值和退款记录
long: 获取账户的充值和退款记录。
examples:
- cmd: zeno zbc describe-recharge-refund-history --start-time 2023-08-05T14:26:18Z --end-time 2023-09-05T14:26:18Z --state PAY_SUCCESS --page-num 1 --page-size 10
  desc: 查询支付成功的充值退款记录。
- cmd: zeno zbc describe-recharge-refund-history --page-num 1 --page-size 20
  desc: 不限定时间与状态，查询全部充值退款记录。
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeRechargeRefundHistory
parameters:
- name: end-time
  type: string
  required: false
  sdk-field: endTime
  description: |-
    查询结束时间。
    不传时不限定时间上界。
    时间格式：yyyy-MM-ddTHH:mm:ssZ。
- name: start-time
  type: string
  required: false
  sdk-field: startTime
  description: |-
    查询开始时间。
    不传时不限定时间下界。
    时间格式：yyyy-MM-ddTHH:mm:ssZ。
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    每页大小。
    默认 20，超过 5000 时按 5000 处理。
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: |-
    页码。
    默认 1。
- name: state
  type: string-array
  required: false
  sdk-field: state
  description: |-
    充值状态。
    不传时返回全部状态的记录。
    状态为 NO_NEED_PAY 的记录始终不会返回，即使显式传入该值。
response:
- name: totalCount
  type: integer
  description: 符合条件的数据总数。
- name: dataSet
  type: object-array
  description: 充值退款记录结果集。
  array-style: json
  item-schema:
  - name: accountUid
    type: string
    description: 账户唯一标识。
  - name: transactionTime
    type: string
    description: |-
      交易时间。
      时间格式：yyyy-MM-ddTHH:mm:ssZ。
  - name: transactionId
    type: string
    description: 交易流水号。
  - name: state
    type: string
    description: |-
      交易状态。
      包含 PAYING: 支付中、PAY_FAILED: 支付失败、PAY_SUCCESS: 支付成功。
  - name: transactionType
    type: string
    description: 交易类型。
  - name: paymentMethod
    type: string
    description: 充值方式。
  - name: amount
    type: float
    description: 交易金额。
