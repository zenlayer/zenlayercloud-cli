name: DescribeTransactionHistory
product: zbc
use: describe-transaction-history
short: 获取账户的交易记录。
long: 获取账户的交易记录。最大返回条数为10000。不能查询超过10000条的数据，查询时间区间不得超过 3 个月。
examples:
- cmd: zeno zbc describe-transaction-history --start-time 2023-08-05T14:26:18Z --end-time 2023-09-05T14:26:18Z --transaction-type DEDUCTION --page-num 1 --page-size 3
  desc: 查询账户的扣款交易记录。
- cmd: zeno zbc describe-transaction-history --page-num 1 --page-size 20
  desc: 使用默认时间范围查询全部交易记录。
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeTransactionHistory
parameters:
- name: end-time
  type: string
  required: false
  sdk-field: endTime
  description: |-
    查询结束时间。
    不传时取当前时间。
    时间格式：yyyy-MM-ddTHH:mm:ssZ。
- name: start-time
  type: string
  required: false
  sdk-field: startTime
  description: |-
    查询开始时间。
    不传时取结束时间往前 1 个月。
    与结束时间的间隔不得超过 3 个月。
    时间格式：yyyy-MM-ddTHH:mm:ssZ。
- name: transaction-type
  type: string-array
  required: false
  sdk-field: transactionType
  description: |-
    交易类型。
    不传时返回全部类型的交易记录。
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    每页大小。
    默认 20。
    与页码的乘积不得超过 10000。
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: |-
    页码。
    默认 1。
    与每页大小的乘积不得超过 10000。
response:
- name: incomeSum
  type: float
  description: |-
    总收入。
    为符合筛选条件的全部记录汇总值，不受分页影响。
- name: expenditureSum
  type: float
  description: |-
    总支出。
    为符合筛选条件的全部记录汇总值，不受分页影响。
- name: totalCount
  type: integer
  description: 符合条件的数据总数。
- name: dataSet
  type: object-array
  description: 交易记录结果集。
  array-style: json
  item-schema:
  - name: uid
    type: string
    description: 交易记录唯一标识。
  - name: accountUid
    type: string
    description: 账户唯一标识。
  - name: transactionTime
    type: string
    description: |-
      交易时间。
      时间格式：yyyy-MM-ddTHH:mm:ssZ。
  - name: amount
    type: float
    description: 交易金额。
  - name: cashBalance
    type: float
    description: 本次交易后的账户余额。
  - name: tradeType
    type: string
    description: |-
      收支方向。
      取值为 INCOME（收入）或 EXPENDITURE（支出）。
  - name: paymentMethod
    type: string
    description: 支付方式。
  - name: description
    type: string
    description: |-
      交易描述。
      内容为产品与规格信息，可能包含换行符。
  - name: transactionType
    type: string
    description: 交易类型。
  - name: tradeNo
    type: string
    description: 交易流水号。
  - name: orderSn
    type: string
    description: 订单号。
