name: ModifyListener
product: zlb
use: modify-listener
short: 修改负载均衡监听器属性
long: |-
  修改负载均衡监听器的属性，包括监听器的名称、健康检查参数、转发方式等。
  **注意事项**

  * 不支持修改监听器的监听协议。
  * `algoOpts`（无状态转发）与`persistent`（会话保持）之所以互斥，是因为无状态转发逐包哈希转发、不维护连接跟踪表，无法保证同一客户端命中同一后端。
  * `algoOpts`的关闭状态在查询侧不会表现为`None`： ~~DescribeListeners~~ 等查询接口不返回`None`，未开启一律表现为该字段为空。
examples:
- cmd: zeno zlb modify-listener --load-balancer-id <loadBalancerId> --listener-id <listenerId> --listener-name sampleName --persistent 60 --idle-timeout 60 --scheduler mh
  desc: 修改负载均衡监听器的名称、健康检查参数以及转发策略
sdk:
  service: zlb
  version: '2025-04-01'
  action: ModifyListener
parameters:
- name: load-balancer-id
  type: string
  required: true
  sdk-field: loadBalancerId
  description: 负载均衡器ID。
- name: listener-id
  type: string
  required: true
  sdk-field: listenerId
  description: 负载均衡器的监听器ID。
- name: listener-name
  type: string
  required: false
  sdk-field: listenerName
  description: |-
    负载均衡器的监听器名称。
    不传则不会进行修改。
- name: health-check
  type: object
  required: false
  sdk-field: healthCheck
  description: |-
    负载均衡器的监听器健康检查。
    不传则不会进行修改，如果开启或关闭，请设置HealthCheck.enabled字段。
  object-schema:
  - name: enabled
    type: boolean
    description: 是否开启健康检查。
  - name: checkType
    type: enum
    description: |-
      健康检查使用的协议。
      当开启健康检查时， 该字段必填。
    enum-values:
    - value: PING_CHECK
      desc: Ping 检查。
    - value: TCP
      desc: TCP 检查。
    - value: HTTP_GET
      desc: HTTP Get 请求检查。
  - name: checkPort
    type: integer
    description: |-
      健康检查端口。
      默认为后端服务的端口，除非您希望指定特定端口，否则建议留空。
      当监听器端口为全端口（0）或范围端口且健康检查类型为`TCP`或`HTTP_GET`时，必须指定该端口。
  - name: checkDelayLoop
    type: integer
    description: |-
      健康检查的检查间隔时间。
      单位:秒。
  - name: checkConnTimeout
    type: integer
    description: |-
      健康检查的连接超时时间。
      单位:秒。
  - name: checkRetry
    type: integer
    description: 检查重试次数。
  - name: checkDelayTry
    type: integer
    description: |-
      健康检查重试的间隔时间。
      单位:秒。
  - name: checkHttpGetUrl
    type: string
    description: |-
      健康检查路径。
      仅适用于HTTP_GET的协议。
      如果指定，必须以/开头。
  - name: checkHttpStatusCode
    type: integer
    description: |-
      健康检查状态码。
      仅适用于HTTP_GET的协议。
  - name: failOpen
    type: boolean
    description: 开启后，当所有后端健康检查均失败时，负载均衡器将暂视所有节点为健康，继续转发流量，以保障业务连续性。
- name: scheduler
  type: enum
  required: false
  sdk-field: scheduler
  description: |-
    监听器的调度算法。
    不传则不会进行修改。
  enum-values:
  - value: mh
    desc: 磁力哈希方式。
  - value: rr
    desc: 轮训方式。
  - value: wrr
    desc: 加权轮训方式。
  - value: lc
    desc: 最少连接方式。
  - value: wlc
    desc: 加权最少连接方式。
  - value: sh
    desc: 根据源地址哈希方式。
  - value: dh
    desc: 根据目标地址哈希方式。
- name: port
  type: string
  required: false
  sdk-field: port
  description: |-
    监听器端口。
    多个端口使用,分隔。
    当端口是范围时用-连接，例如：10000-10005。
    端口的取值范围为0～65535，0代表全范围端口。
    不指定将不会进行修改。
    范围端口与全端口在配额计算中均按1个端口计。
    连续的单端口会被自动合并为区间端口后再保存和返回，例如1,2,3,4,5会被保存为1-5。
- name: kind
  type: enum
  required: false
  sdk-field: kind
  description: |-
    工作模式。
    如果修改为DR模式，如果后端服务器指定了端口将失效，将跟随监听器的端口。
    修改后必须与该负载均衡器下其他监听器的工作模式保持一致。
    DR模式下监听器不支持设置为全端口（0）；监听器当前端口已是全端口（0）时，也不允许修改为DR。
    负载均衡实例的ipStackType为IPv6时只支持DR。
  enum-values:
  - value: FNAT
    desc: 全局网络地址转换(Full NAT)。
  - value: DR
    desc: 直接路由（Direct Routing)。
  - value: DNAT
    desc: 目标网络地址转换(Destination NAT)。
- name: persistent
  type: integer
  required: false
  sdk-field: persistent
  description: |-
    会话保持时间，单位秒。
    与algoOpts（调度算法高级选项）互斥：若该监听器已开启algoOpts，不可修改为非0值，需一并传algoOpts=None将其清空。
- name: idle-timeout
  type: integer
  required: false
  sdk-field: idleTimeout
  description: 空闲超时时间，单位秒。
- name: algo-opts
  type: enum
  required: false
  sdk-field: algoOpts
  description: |-
    调度算法高级选项。
    仅当工作模式（kind）为DR且调度算法（scheduler）为mh时可设置。
    不传表示不修改该字段；传None表示显式清空已开启的选项。
    校验按修改后生效的最终状态判定：若该监听器已开启此选项，把kind或scheduler改为其它组合时也需一并传None。
    开启后与会话保持（persistent）互斥：若该监听器已开启此选项，把persistent改为非0值同样会报错，需一并传None将其清空。
  enum-values:
  - value: StatelessForwarding
    desc: |-
      MH 无状态转发（One-Packet Scheduling）。
      开启后 LB 不维护连接跟踪表，基于 MH 哈希对每个数据包实时选择后端，可提升抗 DDoS 能力与转发性能；仅在转发模式为 DR 且调度算法为 MH 时可用，后端节点增减或健康状态变化时可能导致部分连接中断。
  - value: None
    desc: |-
      显式关闭调度算法高级选项。
      仅用于 Create/Modify 请求语义：传此值表示清空已开启的高级选项；不传该字段表示不改动。
      查询接口（Describe 等）不会返回此值，关闭状态一律表现为该字段为空。
