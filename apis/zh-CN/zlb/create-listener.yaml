name: CreateListener
product: zlb
use: create-listener
short: 创建负载均衡监听器
long: |-
  查询创建负载均衡监听器。
  **注意事项**

  * `algoOpts`（无状态转发）与`persistent`（会话保持）之所以互斥，是因为无状态转发逐包哈希转发、不维护连接跟踪表，无法保证同一客户端命中同一后端。
examples:
- cmd: zeno zlb create-listener --load-balancer-id <loadBalancerId> --listener-name sample --protocol TCP --scheduler mh --port 8080-9000,8000 --persistent 60 --idle-timeout 60
  desc: 创建一个TCP负载均衡监听器，监听8080-9000以及8000端口。不开启健康检查。
- cmd: zeno zlb create-listener --load-balancer-id <loadBalancerId> --listener-name sample --protocol TCP --scheduler mh --port 8080 --persistent 60 --idle-timeout 60
  desc: 创建一个TCP负载均衡监听器的同时设置健康检查信息。
sdk:
  service: zlb
  version: '2025-04-01'
  action: CreateListener
parameters:
- name: load-balancer-id
  type: string
  required: true
  sdk-field: loadBalancerId
  description: 负载均衡实例 ID。
- name: listener-name
  type: string
  required: true
  sdk-field: listenerName
  description: |-
    要创建的监听器名称。
    仅支持字母、数字、连字符 (-) 和句点 (.)，且开头和结尾必须是字母或数字。
- name: health-check
  type: object
  required: false
  sdk-field: healthCheck
  description: |-
    健康检查相关参数。
    如果不传该参数或者healthCheck.enable = false. 将会关闭健康检查。
  object-schema:
  - name: enabled
    type: boolean
    description: 是否开启健康检查。
  - name: checkType
    type: enum
    description: |-
      健康检查使用的协议。
      当开启健康检查时， 该字段必填。
    enum-values:
    - value: PING_CHECK
      desc: Ping 检查。
    - value: TCP
      desc: TCP 检查。
    - value: HTTP_GET
      desc: HTTP Get 请求检查。
  - name: checkPort
    type: integer
    description: |-
      健康检查端口。
      默认为后端服务的端口，除非您希望指定特定端口，否则建议留空。
      当监听器端口为全端口（0）或范围端口且健康检查类型为`TCP`或`HTTP_GET`时，必须指定该端口。
  - name: checkDelayLoop
    type: integer
    description: |-
      健康检查的检查间隔时间。
      单位:秒。
  - name: checkConnTimeout
    type: integer
    description: |-
      健康检查的连接超时时间。
      单位:秒。
  - name: checkRetry
    type: integer
    description: 检查重试次数。
  - name: checkDelayTry
    type: integer
    description: |-
      健康检查重试的间隔时间。
      单位:秒。
  - name: checkHttpGetUrl
    type: string
    description: |-
      健康检查路径。
      仅适用于HTTP_GET的协议。
      如果指定，必须以/开头。
  - name: checkHttpStatusCode
    type: integer
    description: |-
      健康检查状态码。
      仅适用于HTTP_GET的协议。
  - name: failOpen
    type: boolean
    description: 开启后，当所有后端健康检查均失败时，负载均衡器将暂视所有节点为健康，继续转发流量，以保障业务连续性。
- name: protocol
  type: enum
  required: true
  sdk-field: protocol
  description: 监听器协议。
  enum-values:
  - value: TCP
    desc: TCP 协议。
  - value: UDP
    desc: UDP 协议。
- name: scheduler
  type: enum
  required: true
  sdk-field: scheduler
  description: 监听器的调度算法。
  enum-values:
  - value: mh
    desc: 磁力哈希方式。
  - value: rr
    desc: 轮训方式。
  - value: wrr
    desc: 加权轮训方式。
  - value: lc
    desc: 最少连接方式。
  - value: wlc
    desc: 加权最少连接方式。
  - value: sh
    desc: 根据源地址哈希方式。
  - value: dh
    desc: 根据目标地址哈希方式。
- name: port
  type: string
  required: true
  sdk-field: port
  description: |-
    监听器端口。
    多个端口使用,分隔。
    当端口是范围时用-连接，例如：10000-10005。
    端口的取值范围为0～65535，0代表全范围端口。
    请注意端口不能和该监听器的其他端口有重叠。
    范围端口与全端口在配额计算中均按1个端口计。
    连续的单端口会被自动合并为区间端口后再保存和返回，例如1,2,3,4,5会被保存为1-5。
- name: kind
  type: enum
  required: false
  sdk-field: kind
  description: |-
    工作模式。
    若该负载均衡器已有监听器，默认沿用其工作模式；否则根据负载均衡实例所在的区域设定默认值（默认值可能为DNAT、FNAT）。
    同一负载均衡器下所有监听器工作模式必须一致，DR模式下监听器不支持设置为全端口（0）。
    负载均衡实例的ipStackType为IPv6时只支持DR，不指定时默认为DR。
  enum-values:
  - value: FNAT
    desc: 全局网络地址转换(Full NAT)。
  - value: DR
    desc: 直接路由（Direct Routing)。
  - value: DNAT
    desc: 目标网络地址转换(Destination NAT)。
- name: persistent
  type: integer
  required: false
  sdk-field: persistent
  description: |-
    会话保持时间，单位秒。
    与algoOpts（调度算法高级选项）互斥：该监听器设置了algoOpts时不可传非0值。
- name: idle-timeout
  type: integer
  required: false
  sdk-field: idleTimeout
  description: 空闲超时时间，单位秒。
- name: algo-opts
  type: enum
  required: false
  sdk-field: algoOpts
  description: |-
    调度算法高级选项。
    仅当工作模式（kind）为DR且调度算法（scheduler）为mh时可设置，其它组合传入将报错。
    创建时传None等价于不设置该字段。
    开启后与会话保持（persistent）互斥，不可同时设置非0值。
  enum-values:
  - value: StatelessForwarding
    desc: |-
      MH 无状态转发（One-Packet Scheduling）。
      开启后 LB 不维护连接跟踪表，基于 MH 哈希对每个数据包实时选择后端，可提升抗 DDoS 能力与转发性能；仅在转发模式为 DR 且调度算法为 MH 时可用，后端节点增减或健康状态变化时可能导致部分连接中断。
  - value: None
    desc: |-
      显式关闭调度算法高级选项。
      仅用于 Create/Modify 请求语义：传此值表示清空已开启的高级选项；不传该字段表示不改动。
      查询接口（Describe 等）不会返回此值，关闭状态一律表现为该字段为空。
response:
- name: listenerId
  type: string
  description: 创建的监听器ID。
