name: ModifyPortAttribute
product: sdn
use: modify-port-attribute
short: 修改端口属性
long: |-
  修改端口属性
  **注意事项**

  * businessEntityName仅在数据中心端口LOA未上传之前才可修改，若已上传，则不支持修改。
examples:
- cmd: zeno sdn modify-port-attribute --port-id your-port-id --port-name your-port-name --port-remarks your-port-remarks --business-entity-name your-business-entity-name
  desc: ''
sdk:
  service: sdn
  version: '2026-04-01'
  action: ModifyPortAttribute
parameters:
- name: port-id
  type: string
  required: true
  sdk-field: portId
  description: 数据中心端口 ID。
- name: port-name
  type: string
  required: false
  sdk-field: portName
  description: |-
    数据中心端口名称。
    最长 255 字符，建议使用数据中心四字码+数据中心端口规格。
- name: port-remarks
  type: string
  required: false
  sdk-field: portRemarks
  description: |-
    数据中心端口备注信息。
    最长 255 字符。
- name: business-entity-name
  type: string
  required: false
  sdk-field: businessEntityName
  description: |-
    商业实体名称。
    用于 LOA 抬头。
    仅在数据中心端口 LOA 上传前可修改，已上传则不支持修改。
