name: CreatePort
product: sdn
use: create-port
short: 创建端口
long: |-
  创建端口
  **注意事项**

  * 本接口为异步接口，当创建Port请求下发成功后会返回一个Port`ID`列表，此时创建Port操作并未立即完成。在此期间Port的状态将会处于 **`CREATING`**，Port创建结果可以通过调用 **[DescribePorts](describeports.md#describeports)** 接口查询，如果Port状态由**`CREATING`** (创建中)变为 **`RUNNING`**，则代表Port创建成功，否则代表还在创建中。创建过程中不可对Port进行任何操作。
sdk:
  service: sdn
  version: '2026-04-01'
  action: CreatePort
parameters:
- name: dc-id
  type: string
  required: true
  sdk-field: dcId
  description: |-
    数据中心ID。
    可通过 ~~DescribeDataCenters~~ 接口获取。
- name: port-name
  type: string
  required: true
  sdk-field: portName
  description: |-
    数据中心端口名称。
    不超过 255 字符，建议使用数据中心四字码+数据中心端口规格。
- name: port-remarks
  type: string
  required: false
  sdk-field: portRemarks
  description: |-
    数据中心端口备注信息。
    不超过 255 字符。
- name: port-type
  type: string
  required: true
  sdk-field: portType
  description: |-
    数据中心端口规格。
    可通过 ~~DescribeDataCenterPortPrice~~ 接口获取，取值：1G | 10G | 40G | 100G | 400G。
- name: business-entity-name
  type: string
  required: true
  sdk-field: businessEntityName
  description: |-
    商业实体名称。
    用于 LOA 抬头。
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: 市场营销活动相关信息。
  object-schema:
  - name: discountCode
    type: string
    description: |-
      使用市场发放的折扣码。
      如果折扣码不存在，最终折扣将不会生效。
  - name: usePocVoucher
    type: boolean
    description: |-
      是否使用POC代金券。
      如果系统不存在POC代金券，相关创建流程会失败。
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    创建数据中心端口时关联的标签。
    注意：关联标签键不能重复。--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      标签键。
      长度限制：1～64个字符。
  - name: value
    type: string
    description: |-
      标签值。
      长度限制：1～64个字符。
response:
- name: orderNumber
  type: string
  description: 创建数据中心端口产生的订单号。
- name: portId
  type: string
  description: 创建成功的数据中心端口 ID。
