name: QueryPrivateConnectPrice
product: sdn
use: query-private-connect-price
short: 二层网络专线询价
long: 二层网络专线询价
examples:
- cmd: zeno sdn query-private-connect-price --internet-type ByBandwidth --bandwidth-mbps 50
  desc: 对1个二层网络专线进行询价,带宽为10Mbps,A端为数据中心端口,Z端为公有云。
sdk:
  service: sdn
  version: '2026-04-01'
  action: QueryPrivateConnectPrice
parameters:
- name: internet-type
  type: enum
  required: true
  sdk-field: internetType
  description: |-
    网络计费类型。
    默认值为ByBandwidth。
  enum-values:
  - value: ByBandwidth
    desc: 固定带宽计费。
  - value: ByInstanceBandwidth95
    desc: 95带宽计费。
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: |-
    二层网络专线的最大带宽限制。
    默认值是10，单位：Mbps。
- name: endpoint-a
  type: object
  required: true
  sdk-field: endpointA
  description: 二层网络专线A端连接点信息。
  object-schema:
  - name: dcId
    type: string
    description: |-
      数据中心ID。
      具体取值可通过调用接口~~DescribeDataCenters~~来获得最新的数据中心列表。
  - name: cloudType
    type: enum
    description: 云连接类型。
    enum-values:
    - value: AWS
      desc: 亚马逊云。
    - value: TENCENT
      desc: 腾讯云。
    - value: GOOGLE
      desc: 谷歌云。
    - value: AZURE
      desc: 微软 Azure。
    - value: ALI_CLOUD
      desc: 阿里云。
    - value: HUAWEI_CLOUD
      desc: 华为云。
    - value: BYTE_PLUS
      desc: 火山引擎（BytePlus）。
    - value: ORACLE
      desc: 甲骨文云（Oracle）。
  - name: bandwidthMbps
    type: integer
    description: |-
      云连接的最大带宽限制。
      默认值是10，单位：Mbps。
  - name: vlanId
    type: integer
    description: VLAN ID。
  - name: cloudRegionId
    type: string
    description: |-
      公有云区域ID。
      Google云无需传参。
  - name: portType
    type: string
    description: |-
      数据中心端口规格。
      具体取值可通过调用接口~~DescribeDataCenterPortPrice~~来获得最新的数据中心端口规格表。
  - name: buildCrossConnectWithAssisted
    type: boolean
    description: |-
      是否需要Zenlayer协助建设交叉连接。
      如果选择true，则价格将包含交叉连接的跳线费用，以及一次性建设费。
      默认值为false，即用户需要自行建设交叉连接。
- name: endpoint-z
  type: object
  required: true
  sdk-field: endpointZ
  description: 二层网络专线Z端连接点信息。
  object-schema:
  - name: dcId
    type: string
    description: |-
      数据中心ID。
      具体取值可通过调用接口~~DescribeDataCenters~~来获得最新的数据中心列表。
  - name: cloudType
    type: enum
    description: 云连接类型。
    enum-values:
    - value: AWS
      desc: 亚马逊云。
    - value: TENCENT
      desc: 腾讯云。
    - value: GOOGLE
      desc: 谷歌云。
    - value: AZURE
      desc: 微软 Azure。
    - value: ALI_CLOUD
      desc: 阿里云。
    - value: HUAWEI_CLOUD
      desc: 华为云。
    - value: BYTE_PLUS
      desc: 火山引擎（BytePlus）。
    - value: ORACLE
      desc: 甲骨文云（Oracle）。
  - name: bandwidthMbps
    type: integer
    description: |-
      云连接的最大带宽限制。
      默认值是10，单位：Mbps。
  - name: vlanId
    type: integer
    description: VLAN ID。
  - name: cloudRegionId
    type: string
    description: |-
      公有云区域ID。
      Google云无需传参。
  - name: portType
    type: string
    description: |-
      数据中心端口规格。
      具体取值可通过调用接口~~DescribeDataCenterPortPrice~~来获得最新的数据中心端口规格表。
  - name: buildCrossConnectWithAssisted
    type: boolean
    description: |-
      是否需要Zenlayer协助建设交叉连接。
      如果选择true，则价格将包含交叉连接的跳线费用，以及一次性建设费。
      默认值为false，即用户需要自行建设交叉连接。
response:
- name: endpointAPrice
  type: object
  description: 二层网络专线A端连接点价格信息。
  object-schema:
  - name: crossConnectPrice
    type: object
    description: |-
      交叉连接价格。
      连接点类型为数据中心端口并且该数据中心支持Zenlayer协助建设交叉连接时有值。
    object-schema:
    - name: discount
      type: float
      description: |-
        折扣大小。
        如80.0代表8折。
    - name: discountPrice
      type: float
      description: |-
        后付费的单元折后价格。
        后付费模式使用，如果价格为阶梯价格，该项为null。
    - name: originalPrice
      type: float
      description: |-
        预付费的原价。
        预付费模式使用，后付费该值为 null。
    - name: unitPrice
      type: float
      description: |-
        后付费的单元原始价格。
        后付费模式使用，如果价格为阶梯价格，该项为null。
    - name: discountUnitPrice
      type: float
      description: |-
        后付费的单元折后价格。
        后付费模式使用，如果价格为阶梯价格，该项为null。
    - name: chargeUnit
      type: string
      description: |-
        后付费计价单元。
        后付费模式使用，可取值范围：<br/>HOUR: 表示计价单元是按每小时来计算。
        DAY: 表示计价单元是按天来计算。
        MONTH: 表示计价单元是按月来计算，95计费则是这种。
    - name: stepPrices
      type: object-array
      description: |-
        后付费阶梯价格。
        后付费模式使用，如果非阶梯价格，该项为null。
      array-style: json
      item-schema:
      - name: stepStart
        type: float
        description: 阶梯的起始值。
      - name: stepEnd
        type: float
        description: |-
          阶梯的到达值。
          为null代表最后一级阶梯。
      - name: unitPrice
        type: float
        description: 阶梯单价。
      - name: discountUnitPrice
        type: float
        description: 阶梯折后价。
    - name: amountUnit
      type: string
      description: |-
        用量单位。
        比如Mbps, LCU等。
        如果为null, 代表取不到值。
    - name: excessUnitPrice
      type: float
      description: 超量原始价格。
    - name: excessDiscountUnitPrice
      type: float
      description: 超量折扣后价格。
    - name: excessAmountUnit
      type: string
      description: |-
        超量用量单位。
        如果为null, 代表取不到值。
    - name: category
      type: enum
      description: 价格所属类别。
      enum-values:
      - value: STANDARD
        desc: 标准价格。
      - value: CUSTOMIZED
        desc: 一口价格。
  - name: crossConnectOneTimeConstructionPrice
    type: object
    description: |-
