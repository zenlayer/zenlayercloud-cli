name: AddCloudRouterEdgePoints
product: sdn
use: add-cloud-router-edge-points
short: 新增连接点
long: |-
  新增连接点
  **注意事项**

  * 目前只允许连通性状态为**ACTIVE**的数据中心端口加入到三层网络中。
  * 本接口为异步接口，当请求下发成功后，操作并未立即完成。在此期间三层网络的状态将会处于**UPDATING**，当加入成功后，三层网络的状态将变为**RUNNING**。
  * 在此期间三层网络将无法同时进行其他操作。
examples:
- cmd: zeno sdn add-cloud-router-edge-points --cloud-router-id your-cloud-router-id --edge-points "{vpcId=your vpc id, bandwidthMbps=1}"
  desc: 向指定的三层网络中新增1个连接点, 连接点为VPC, 接入带宽为1Mbps.
sdk:
  service: sdn
  version: '2026-04-01'
  action: AddCloudRouterEdgePoints
parameters:
- name: cloud-router-id
  type: string
  required: true
  sdk-field: cloudRouterId
  description: 三层网络的 ID。
- name: edge-points
  type: object-array
  required: true
  sdk-field: edgePoints
  description: 新增的边缘连接点信息。
  array-style: json
  item-schema:
  - name: edgePointName
    type: string
    description: |-
      连接点的名称。
      仅支持字母、数字和短横线，长度不超过 100 字符。
  - name: vpcId
    type: string
    description: VPC 连接点的 VPC ID。
  - name: zbgId
    type: string
    description: ZBG 连接点的 ZBG ID。
  - name: portId
    type: string
    description: 数据中心端口连接点的端口 ID。
  - name: cloudType
    type: enum
    description: 云连接点的云厂商类型。
    enum-values:
    - value: AWS
      desc: 亚马逊云。
    - value: TENCENT
      desc: 腾讯云。
    - value: GOOGLE
      desc: 谷歌云。
    - value: AZURE
      desc: 微软 Azure。
    - value: ALI_CLOUD
      desc: 阿里云。
    - value: HUAWEI_CLOUD
      desc: 华为云。
    - value: BYTE_PLUS
      desc: 火山引擎（BytePlus）。
    - value: ORACLE
      desc: 甲骨文云（Oracle）。
  - name: cloudAccountId
    type: string
    description: 云连接点的云账号 ID。
  - name: dcId
    type: string
    description: 连接点所在的数据中心 ID。
  - name: cloudRegionId
    type: string
    description: 云连接点的云地域 ID。
  - name: haType
    type: enum
    description: 云连接点的高可用类型。
    enum-values:
    - value: PRIMARY
      desc: 主用。
    - value: SECONDARY
      desc: 备用。
  - name: vlanId
    type: integer
    description: |-
      连接点的 VLAN ID。
      取值范围 2-4000。
  - name: bandwidthMbps
    type: integer
    description: |-
      连接点的骨干带宽限速。
      单位 Mbps。
  - name: cloudBandwidthMbps
    type: integer
    description: |-
      云连接点的云侧带宽限速。
      单位 Mbps。
  - name: ipAddress
    type: string
    description: 连接点的互联 IP 地址及掩码。
  - name: bgpConnection
    type: object
    description: |-
      连接点的 BGP 连接配置。
      与静态路由二选一。
    object-schema:
    - name: peerIpAddress
      type: string
      description: 对端互联 IP 地址及掩码。
    - name: peerAsn
      type: integer
      description: 对端 BGP ASN。
    - name: password
      type: string
      description: |-
        BGP 会话的 MD5 密码。
        长度不超过 32 字符。
    - name: localAsn
      type: integer
      description: 本端 BGP ASN。
  - name: staticRoutes
    type: object-array
    description: |-
      连接点的静态路由配置。
      与 BGP 连接二选一。
    array-style: json
    item-schema:
    - name: prefix
      type: string
      description: 静态路由的目的网段（CIDR）。
    - name: nextHop
      type: string
      description: 静态路由的下一跳 IP 地址。
  - name: ipSecTunnel
    type: string
    description: |-
      IPSec 隧道类型。
      取值 FQDN 或 RemoteIP。
  - name: customerPublicIP
    type: string
    description: IPSec 客户侧公网 IP 地址。
  - name: customerPrivateIP
    type: string
    description: IPSec 客户侧私网 IP 地址。
  - name: virtualEdgePrivateIP
    type: string
    description: IPSec Virtual Edge 侧私网 IP 地址。
  - name: psk
    type: string
    description: IPSec 预共享密钥（PSK）。
  - name: enableHealthCheck
    type: boolean
    description: |-
      是否开启健康检查。
      默认不开启。
  - name: backupIpSec
    type: object
    description: IPSec 备份隧道配置。
    object-schema:
    - name: dcId
      type: string
      description: 备份 IPSec 隧道所在数据中心的 ID。
    - name: password
      type: string
      description: |-
        备份 IPSec 隧道的认证密码。
        长度 8-64 个字符。
    - name: customerPrivateIP
      type: string
      description: 备份 IPSec 隧道客户侧私网 IP 地址。
    - name: virtualEdgePrivateIP
      type: string
      description: 备份 IPSec 隧道 Virtual Edge 侧私网 IP 地址。
    - name: psk
      type: string
      description: 备份 IPSec 隧道的预共享密钥（PSK）。
  - name: ipSecBgpConnection
    type: object
    description: |-
      IPSec 的 BGP 连接配置。
      与 IPSec 静态路由二选一。
    object-schema:
    - name: customerAsn
      type: integer
      description: 客户侧 BGP ASN。
    - name: virtualEdgeAsn
      type: integer
      description: Virtual Edge 侧 BGP ASN。
    - name: password
      type: string
      description: |-
        BGP 会话的认证密码。
        长度 8-64 个字符。
  - name: ipSecStaticRoutes
    type: object-array
    description: |-
      IPSec 的静态路由配置。
      与 IPSec BGP 连接二选一。
    array-style: json
    item-schema:
    - name: cidr
      type: string
      description: |-
        静态路由的目的网段。
        CIDR 格式。
response:
- name: edgePointIds
  type: string-array
  description: |-
    新增的连接点 ID 列表。
    顺序与请求中的连接点保持一致。
