name: DescribeCloudRouters
product: sdn
use: describe-cloud-routers
short: 查询三层网络列表
long: 查询三层网络列表
examples:
- cmd: zeno sdn describe-cloud-routers
  desc: 获取三层网络列表
sdk:
  service: sdn
  version: '2026-04-01'
  action: DescribeCloudRouters
parameters:
- name: cloud-router-ids
  type: string-array
  required: false
  sdk-field: cloudRouterIds
  description: |-
    三层网络的 ID 列表。
    长度不超过 100 个。
- name: cloud-router-name
  type: string
  required: false
  sdk-field: cloudRouterName
  description: |-
    三层网络名称。
    支持模糊匹配。
- name: cloud-router-status
  type: enum
  required: false
  sdk-field: cloudRouterStatus
  description: 三层网络的状态。
  enum-values:
  - value: CREATING
    desc: 创建中。
  - value: UPDATING
    desc: 变更中。
  - value: DELETING
    desc: 删除中。
  - value: DESTROYING
    desc: 销毁中。
  - value: RECOVERING
    desc: 恢复中。
  - value: RUNNING
    desc: 正常。
  - value: NOT_ACCEPT
    desc: 未接收。
  - value: RECYCLED
    desc: 已回收。
  - value: DESTROYED
    desc: 已销毁。
  - value: CREATING_FAILED
    desc: 创建失败。
  - value: UPDATING_FAILED
    desc: 变更失败。
  - value: DELETING_FAILED
    desc: 删除失败。
  - value: DESTROYING_FAILED
    desc: 销毁失败。
  - value: RECOVERING_FAILED
    desc: 恢复失败。
- name: edge-point-id
  type: string
  required: false
  sdk-field: edgePointId
  description: 边缘连接点的 ID。
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    资源组 ID。
    不传则返回所有可见资源组内的三层网络。
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    返回的分页大小。
    默认为 20，最大为 1000。
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: |-
    返回的分页页码。
    默认为 1。
- name: tag-keys
  type: string-array
  required: false
  sdk-field: tagKeys
  description: |-
    根据标签键进行搜索。
    最长不得超过20个标签键。
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  description: |-
    根据标签进行搜索。
    最长不得超过20个标签。
  array-style: json
  item-schema:
  - name: key
    type: string
    description: |-
      标签键。
      长度限制：1～64个字符。
  - name: value
    type: string
    description: |-
      标签值。
      长度限制：1～64个字符。
response:
- name: totalCount
  type: integer
  description: 符合条件的三层网络总数量。
- name: dataSet
  type: object-array
  description: 三层网络列表。
  array-style: json
  item-schema:
  - name: cloudRouterId
    type: string
    description: 三层网络的 ID。
  - name: cloudRouterName
    type: string
    description: 三层网络的名称。
  - name: cloudRouterDescription
    type: string
    description: 三层网络的描述信息。
  - name: createTime
    type: string
    description: 三层网络的创建时间。
  - name: expiredTime
    type: string
    description: 三层网络的过期时间。
  - name: recycledTime
    type: string
    description: 三层网络的回收时间。
  - name: edgePoints
    type: object-array
    description: 三层网络的边缘连接点列表。
    array-style: json
    item-schema:
    - name: edgePointId
      type: string
      description: 连接点的 ID。
    - name: edgePointName
      type: string
      description: 连接点的名称。
    - name: connectivityStatus
      type: enum
      description: 连接点的连通性状态。
      enum-values:
      - value: ACTIVE
        desc: 链路正常连通。
      - value: DOWN
        desc: 链路断开。
      - value: ABNORMAL
        desc: 链路部分异常。
    - name: dataCenter
      type: object
      description: 连接点所在的数据中心信息。
      object-schema:
      - name: dcId
        type: string
        description: 数据中心ID。
      - name: dcName
        type: string
        description: 数据中心名称。
      - name: dcAddress
        type: string
        description: 数据中心地址。
      - name: cityName
        type: string
        description: 数据中心所在城市名称。
      - name: countryName
        type: string
        description: 数据中心所在国家名称。
      - name: areaName
        type: string
        description: 数据中心所在区域名称。
      - name: latitude
        type: float
        description: 数据中心所在地纬度。
      - name: longitude
        type: float
        description: 数据中心所在地经度。
    - name: edgePointType
      type: enum
      description: 连接点的类型。
      enum-values:
      - value: VPC
        desc: VPC 接入点。
      - value: ZBG
        desc: 边界网关接入点。
      - value: IptZBG
        desc: 远程 IP 隧道边界网关接入点。
      - value: PORT
        desc: 数据中心端口接入点。
      - value: OTHER_PORT
        desc: 第三方数据中心端口接入点。
      - value: KEY_PORT
        desc: Key Port 接入点。
      - value: GOOGLE
        desc: 谷歌云接入点。
      - value: TENCENT
        desc: 腾讯云接入点。
      - value: ALICLOUD
        desc: 阿里云接入点。
      - value: AZURE
        desc: Azure 接入点。
      - value: AWS
        desc: AWS 接入点。
      - value: VIRTUAL_EDGE
        desc: 边缘网关接入点。
      - value: ORACLE
        desc: Oracle 接入点。
      - value: HUAWEI
        desc: 华为云接入点。
      - value: BYTEPLUS
        desc: 火山引擎接入点。
    - name: cloudType
      type: enum
      description: 云连接点的云厂商类型。
      enum-values:
      - value: AWS
        desc: 亚马逊云。
      - value: TENCENT
        desc: 腾讯云。
      - value: GOOGLE
        desc: 谷歌云。
      - value: AZURE
        desc: 微软 Azure。
      - value: ALI_CLOUD
        desc: 阿里云。
      - value: HUAWEI_CLOUD
        desc: 华为云。
      - value: BYTE_PLUS
        desc: 火山引擎（BytePlus）。
      - value: ORACLE
        desc: 甲骨文云（Oracle）。
    - name: cloudAccountId
      type: string
      description: 云连接点的云账号 ID。
    - name: cloudRegionId
      type: string
      description: 云连接点的云地域 ID。
    - name: vpcId
      type: string
      description: VPC 连接点的 VPC ID。
    - name: zbgId
      type: string
      description: ZBG 连接点的 ZBG ID。
    - name: zbgRegionId
      type: string
      description: ZBG 连接点所属的region。
    - name: portId
      type: string
      description: 数据中心端口连接点的端口 ID。
    - name: sharedChannelId
      type: string
      description: |-
        共享通道ID。
        公有云接入点对应的云侧连接标识，仅公有云类型接入点时有值。
    - name: vlanId
      type: integer
      description: |-
        连接点的 VLAN ID。
        取值范围 2-4000。
    - name: bandwidthMbps
      type: integer
      description: |-
        连接点的骨干带宽限速。
        单位 Mbps。
    - name: bgpConnection
      type: object
      description: 连接点的 BGP 连接配置。
      object-schema:
      - name: peerIpAddress
        type: string
        description: 对端互联 IP 地址及掩码。
      - name: peerAsn
        type: integer
        description: 对端 BGP ASN。
      - name: password
        type: string
        description: |-
          BGP 会话的 MD5 密码。
          长度不超过 32 字符。
      - name: localAsn
        type: integer
        description: 本端 BGP ASN。
    - name: staticRoutes
      type: object-array
      description: 连接点的静态路由配置。
      array-style: json
      item-schema:
      - name: prefix
        type: string
        description: 静态路由的目的网段（CIDR）。
      - name: nextHop
        type: string
        description: 静态路由的下一跳 IP 地址。
    - name: createTime
      type: string
      description: 连接点的创建时间。
    - name: ipAddress
      type: string
      description: 连接点的互联 IP 地址。
  - name: cloudRouterStatus
    type: enum
    description: 三层网络的业务状态。
    enum-values:
    - value: CREATING
      desc: 创建中。
    - value: UPDATING
      desc: 变更中。
    - value: DELETING
      desc: 删除中。
    - value: DESTROYING
      desc: 销毁中。
    - value: RECOVERING
      desc: 恢复中。
    - value: RUNNING
      desc: 正常。
    - value: NOT_ACCEPT
      desc: 未接收。
    - value: RECYCLED
      desc: 已回收。
    - value: DESTROYED
      desc: 已销毁。
    - value: CREATING_FAILED
      desc: 创建失败。
    - value: UPDATING_FAILED
      desc: 变更失败。
    - value: DELETING_FAILED
      desc: 删除失败。
    - value: DESTROYING_FAILED
      desc: 销毁失败。
    - value: RECOVERING_FAILED
      desc: 恢复失败。
  - name: connectivityStatus
    type: enum
    description: 三层网络的连通性状态。
    enum-values:
    - value: ACTIVE
      desc: 链路正常连通。
    - value: DOWN
      desc: 链路断开。
    - value: ABNORMAL
      desc: 链路部分异常。
  - name: resourceGroupId
    type: string
    description: 三层网络所属的资源组 ID。
  - name: resourceGroupName
    type: string
    description: 三层网络所属的资源组名称。
  - name: period
    type: integer
    description: 三层网络的购买时长（月）。
  - name: source
    type: enum
    description: 三层网络的业务来源。
    enum-values:
    - value: CONSOLE
      desc: Console 控制台创建。
    - value: OSS
      desc: 线下工单流程创建。
  - name: tags
    type: object
    description: 三层网络关联的标签。
    object-schema:
    - name: tags
      type: object-array
      description: 标签对列表。
      array-style: json
      item-schema:
      - name: key
        type: string
        description: |-
          标签键。
          长度限制：1～64个字符。
      - name: value
        type: string
        description: |-
          标签值。
          长度限制：1～64个字符。
