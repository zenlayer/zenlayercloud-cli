name: ModifyPrivateConnectBandwidth
product: sdn
use: modify-private-connect-bandwidth
short: 修改二层网络专线带宽
long: |-
  修改二层网络专线带宽
  **注意事项**

  * 仅当二层网络专线状态为**AVAILABLE**时，才能进行带宽限速的变更操作。
  * 本接口为异步接口，此时带宽修改操作并未立即完成。在此期间实例的状态将会处于**UPDATING**，结果可以通过调用[`DescribePrivateConnects`](describeprivateconnects.md) 接口查询，如果状态(privateConnectStatus)由 **UPDATING**(修改中)变为**AVAILABLE**(可用)，则代表带宽更新成功。
  * 在变更带宽期间，不得对该二层网络专线进行其他任何操作。
  * 如果二层网络专线的接入点包含云连接，并且云连接未自定义过带宽限速，该操作会自动将云连接的带宽限速设置为与二层网络专线骨干带宽限速最接近的带宽阶梯。可以通过调用[`ModifyCloudBandwidth`](../cloud/modifycloudbandwidth.md) 自定义修改云连接的带宽限速。
examples:
- cmd: zeno sdn modify-private-connect-bandwidth --private-connect-id your-private-connect-id --bandwidth-mbps 100
  desc: 修改专线带宽为100Mbps
sdk:
  service: sdn
  version: '2026-04-01'
  action: ModifyPrivateConnectBandwidth
parameters:
- name: private-connect-id
  type: string
  required: true
  sdk-field: privateConnectId
  description: 二层网络专线 ID。
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: |-
    需要修改的带宽限速。
    单位：Mbps。
