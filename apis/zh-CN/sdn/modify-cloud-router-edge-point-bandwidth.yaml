name: ModifyCloudRouterEdgePointBandwidth
product: sdn
use: modify-cloud-router-edge-point-bandwidth
short: 修改连接点带宽
long: |-
  修改连接点带宽
  **注意事项**

  * 仅当三层网络专线状态为**RUNNING**时，才能进行带宽限速的变更操作。
  * 本接口为异步接口，此时带宽修改操作并未立即完成。在此期间实例的状态将会处于**UPDATING**，结果可以通过调用DescribeCloudRouters接口查询，如果状态(cloudRouterStatus)由 **UPDATING**(修改中)变为**RUNNING**(可用)，则代表带宽更新成功。
  * 在变更带宽期间，不得对该三层网络专线进行其他任何操作。
  * 如果三层网络连接点为云连接，并且云连接未自定义过带宽限速，该操作会自动将云连接的带宽限速设置为与三层网络连接点骨干带宽限速最接近的带宽阶梯。可以通过调用[`ModifyCloudBandwidth`](../cloud/modifycloudbandwidth.md) 自定义修改云连接的带宽限速。
examples:
- cmd: zeno sdn modify-cloud-router-edge-point-bandwidth --cloud-router-id your-cloud-router-id --edge-point-id one-of-egdgePoint-id --bandwidth-mbps 100
  desc: 修改三层网络连接点的带宽为100Mbps.
sdk:
  service: sdn
  version: '2026-04-01'
  action: ModifyCloudRouterEdgePointBandwidth
parameters:
- name: cloud-router-id
  type: string
  required: true
  sdk-field: cloudRouterId
  description: 连接点关联的三层网络 ID。
- name: edge-point-id
  type: string
  required: true
  sdk-field: edgePointId
  description: 三层网络连接点的 ID。
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: |-
    需要修改的带宽限速。
    单位 Mbps，取值范围 1-500。
