name: QueryPrivateConnectBandwidthPrice
product: sdn
use: query-private-connect-bandwidth-price
short: 二层专线带宽询价
long: 二层专线带宽询价
examples:
- cmd: zeno sdn query-private-connect-bandwidth-price --source-dc-id SIN1 --destination-dc-id LAX1 --internet-type ByBandwidth --bandwidth-mbps 10 --service-level SINGLE_PROTECTED
  desc: 对1个二层网络专线骨干网带宽进行询价,带宽为10Mbps。
sdk:
  service: sdn
  version: '2026-04-01'
  action: QueryPrivateConnectBandwidthPrice
parameters:
- name: source-dc-id
  type: string
  required: true
  sdk-field: sourceDcId
  description: 二层网络其中一端接入点的数据中心ID。
- name: destination-dc-id
  type: string
  required: true
  sdk-field: destinationDcId
  description: 二层网络另外一端接入点的数据中心ID。
- name: internet-type
  type: enum
  required: true
  sdk-field: internetType
  description: |-
    网络计费类型。
    默认值为ByBandwidth。
  enum-values:
  - value: ByBandwidth
    desc: 固定带宽计费。
  - value: ByInstanceBandwidth95
    desc: 95带宽计费。
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: |-
    二层网络专线的最大带宽限制。
    默认值是10，单位：Mbps。
- name: service-level
  type: enum
  required: false
  sdk-field: serviceLevel
  description: |-
    二层网络专线服务等级。
    默认值为SINGLE_PROTECTED。
  enum-values:
  - value: SINGLE_PROTECTED
    desc: |-
      单路径保护型。
      提供线路保护/冗余能力。
  - value: SINGLE_UNPROTECTED
    desc: |-
      单路径非保护型。
      不提供线路保护。
response:
- name: price
  type: object
  description: 价格信息。
  object-schema:
  - name: discount
    type: float
    description: |-
      折扣大小。
      如80.0代表8折。
  - name: discountPrice
    type: float
    description: |-
      后付费的单元折后价格。
      后付费模式使用，如果价格为阶梯价格，该项为null。
  - name: originalPrice
    type: float
    description: |-
      预付费的原价。
      预付费模式使用，后付费该值为 null。
  - name: unitPrice
    type: float
    description: |-
      后付费的单元原始价格。
      后付费模式使用，如果价格为阶梯价格，该项为null。
  - name: discountUnitPrice
    type: float
    description: |-
      后付费的单元折后价格。
      后付费模式使用，如果价格为阶梯价格，该项为null。
  - name: chargeUnit
    type: string
    description: |-
      后付费计价单元。
      后付费模式使用，可取值范围：<br/>HOUR: 表示计价单元是按每小时来计算。
      DAY: 表示计价单元是按天来计算。
      MONTH: 表示计价单元是按月来计算，95计费则是这种。
  - name: stepPrices
    type: object-array
    description: |-
      后付费阶梯价格。
      后付费模式使用，如果非阶梯价格，该项为null。
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: 阶梯的起始值。
    - name: stepEnd
      type: float
      description: |-
        阶梯的到达值。
        为null代表最后一级阶梯。
    - name: unitPrice
      type: float
      description: 阶梯单价。
    - name: discountUnitPrice
      type: float
      description: 阶梯折后价。
  - name: amountUnit
    type: string
    description: |-
      用量单位。
      比如Mbps, LCU等。
      如果为null, 代表取不到值。
  - name: excessUnitPrice
    type: float
    description: 超量原始价格。
  - name: excessDiscountUnitPrice
    type: float
    description: 超量折扣后价格。
  - name: excessAmountUnit
    type: string
    description: |-
      超量用量单位。
      如果为null, 代表取不到值。
  - name: category
    type: enum
    description: 价格所属类别。
    enum-values:
    - value: STANDARD
      desc: 标准价格。
    - value: CUSTOMIZED
      desc: 一口价格。
- name: stock
  type: integer
  description: 可用库存数量。
