name: DescribeCloudRouterDCToDCTraffic
product: sdn
use: describe-cloud-router-dc-to-dc-traffic
short: 查询数据中心间流量
long: |-
  查询数据中心间流量
  **注意事项**

  * 可以通过[DescribeCloudRouters](describe-cloud-routers.md)接口来获取三层网络中接入点的数据中心信息。
  * 开始时间和结束时间的跨度不能超过一天。
  * 只能查询30天内的流量数据。
  * 该接口按数据中心聚合带宽，无法区分同一数据中心内多个接入点各自的流量。例如，查询数据中心A到Z的带宽，返回的是A中所有接入点到Z的总和，不能单独获取某个接入点到另一个接入点的带宽。
examples:
- cmd: zeno sdn describe-cloud-router-dc-to-dc-traffic --cloud-router-id your-cloudrouter-id --source-dc-id source-dc-id --destination-dc-id destination-dc-id --start-time 2026-01-01T00:00:00Z --end-time 2026-01-01T23:59:59Z
  desc: 查询三层网络中数据中心到数据中心一天内的流量数据。
sdk:
  service: sdn
  version: '2026-04-01'
  action: DescribeCloudRouterDCToDCTraffic
parameters:
- name: cloud-router-id
  type: string
  required: true
  sdk-field: cloudRouterId
  description: 三层网络的 ID。
- name: source-dc-id
  type: string
  required: true
  sdk-field: sourceDcId
  description: 源数据中心 ID。
- name: destination-dc-id
  type: string
  required: true
  sdk-field: destinationDcId
  description: 目的数据中心 ID。
- name: start-time
  type: string
  required: true
  sdk-field: startTime
  description: |-
    查询开始时间。
    ISO8601 格式，UTC 时区。
- name: end-time
  type: string
  required: false
  sdk-field: endTime
  description: |-
    查询结束时间。
    ISO8601 格式，UTC 时区，默认为当前时间。
response:
- name: dataList
  type: object-array
  description: 流量明细数据列表。
  array-style: json
  item-schema:
  - name: internetRX
    type: integer
    description: |-
      入方向带宽值。
      单位：bps。
  - name: internetTX
    type: integer
    description: |-
      出方向带宽值。
      单位：bps。
  - name: time
    type: string
    description: |-
      数据时间。
      按照ISO8601标准表示，并且使用UTC时间。
      格式为：YYYY-MM-ddTHH:mm:ssZ。
- name: in95
  type: integer
  description: 入方向 95 峰值流量。
- name: inAvg
  type: integer
  description: 入方向平均流量。
- name: inMax
  type: integer
  description: 入方向最大流量。
- name: inMin
  type: integer
  description: 入方向最小流量。
- name: out95
  type: integer
  description: 出方向 95 峰值流量。
- name: outAvg
  type: integer
  description: 出方向平均流量。
- name: outMax
  type: integer
  description: 出方向最大流量。
- name: outMin
  type: integer
  description: 出方向最小流量。
- name: unit
  type: string
  description: |-
    流量单位。
    如 bps。
