name: DescribeCloudAvailableBandwidthTiers
product: sdn
use: describe-cloud-available-bandwidth-tiers
short: 查询云连接可用带宽阶梯
long: |-
  查询云连接可用带宽阶梯
  **注意事项**

  * 修改云连接带宽限速时请使用cloudPortId参数查询目标云连接可用的带宽阶梯。
  * 若返回结果为空说明云连接当前暂无可用带宽。
examples:
- cmd: zeno sdn describe-cloud-available-bandwidth-tiers --cloud-type AWS --cloud-region-id us-east-1 --dc-id 0cd74ed4-e0cf-43c8-9c9b-567a1287227a --vlan-id 1024
  desc: 创建时查询可用的带宽阶梯
- cmd: zeno sdn describe-cloud-available-bandwidth-tiers --cloud-port-id your-cloud-port-id
  desc: 修改云连接限速时查询可用的带宽阶梯
sdk:
  service: sdn
  version: '2026-04-01'
  action: DescribeCloudAvailableBandwidthTiers
parameters:
- name: cloud-type
  type: enum
  required: false
  sdk-field: cloudType
  description: 云连接类型（AWS、TENCENT、GOOGLE、AZURE、ALI_CLOUD、HUAWEI_CLOUD、BYTE_PLUS、ORACLE）。
  enum-values:
  - value: AWS
    desc: 亚马逊云。
  - value: TENCENT
    desc: 腾讯云。
  - value: GOOGLE
    desc: 谷歌云。
  - value: AZURE
    desc: 微软 Azure。
  - value: ALI_CLOUD
    desc: 阿里云。
  - value: HUAWEI_CLOUD
    desc: 华为云。
  - value: BYTE_PLUS
    desc: 火山引擎（BytePlus）。
  - value: VOLCENGINE
    desc: 火山引擎。
  - value: ORACLE
    desc: 甲骨文云（Oracle）。
- name: cloud-region-id
  type: string
  required: false
  sdk-field: cloudRegionId
  description: 公有云区域 ID（Google 云无需传参）。
- name: dc-id
  type: string
  required: false
  sdk-field: dcId
  description: 连接云接入点的数据中心 ID。
- name: vlan-id
  type: integer
  required: false
  sdk-field: vlanId
  description: VLAN ID。
- name: cloud-port-id
  type: string
  required: false
  sdk-field: cloudPortId
  description: |-
    云连接 ID。
    修改云连接带宽限速时使用，传入后其他参数将被忽略。
- name: cloud-account-id
  type: string
  required: false
  sdk-field: cloudAccountId
  description: 云平台账号（Google 为 Pairing Key，Azure 为 Service Key）。
- name: zone-color
  type: enum
  required: false
  sdk-field: zoneColor
  description: 可用区标识。
  enum-values:
  - value: RED
    desc: |-
      红区。
      用于高可用部署时与蓝区互为对端分区。
  - value: BLUE
    desc: |-
      蓝区。
      用于高可用部署时与红区互为对端分区。
response:
- name: availableBandwidthTiers
  type: integer-array
  description: 云连接可用的带宽阶梯列表。
