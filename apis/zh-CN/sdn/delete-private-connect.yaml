name: DeletePrivateConnect
product: sdn
use: delete-private-connect
short: 删除二层网络专线
long: |-
  删除二层网络专线
  **注意事项**

  * 删除二层网络专线将会暂停相关业务（即网络无法连通），请谨慎操作。
  * 删除二层网络专线后，系统会对资源保留一段时间，保留时长详见[二层专线计费相关信息](https://docs.console.zenlayer.com/welcome/pricing/cloud-networking-pricing#deletion-2)。\
    保留的这段期间，资源的状态将变为**RECYCLED**。在此期间， 可以调用[RenewPrivateConnect](renewprivateconnect.md) 进行恢复。
  * 本接口为异步接口，当删除二层网络的请求下发成功后，删除二层网络专线操作并未立即完成。在此期间二层网络的状态将会处于**DELETEING**，当删除成功，二层网络专线的状态将变为**RECYCLED**。
  * 删除后不可再对二层网络专线进行变更操作。
  * 删除后,你可以通过 [RenewPrivateConnect](renewprivateconnect.md) 对已删除的二层网络专线进行恢复，也可以调用[DestroyPrivateConnect](destroyprivateconnect.md)对处于删除的二层网络专线进行彻底销毁。
examples:
- cmd: zeno sdn delete-private-connect --private-connect-id your-private-connect-id
  desc: 删除
sdk:
  service: sdn
  version: '2026-04-01'
  action: DeletePrivateConnect
parameters:
- name: private-connect-id
  type: string
  required: true
  sdk-field: privateConnectId
  description: 二层网络专线 ID。
