name: DescribeIPTransitDatacenters
product: ipt
use: describe-ip-transit-datacenters
short: 查询IP Transit可连接数据中心
long: 查询IP Transit可连接数据中心
sdk:
  service: ipt
  version: '2024-09-01'
  action: DescribeIPTransitDatacenters
parameters:
- name: peer-port-id
  type: string
  required: false
  sdk-field: peerPortId
  description: |-
    对端数据中心端口 ID。
    传入时查询以该数据中心端口为接入侧的可连接数据中心列表。
- name: peer-dc-id
  type: string
  required: false
  sdk-field: peerDcId
  description: 对端数据中心 ID。
- name: zbg-region-id
  type: string
  required: false
  sdk-field: zbgRegionId
  description: |-
    ZBG 接入节点 ID。
    非空时查询以该 ZBG 节点为接入侧的 Router RIPT 可连接 DC 列表。
response:
- name: supportSet
  type: object-array
  description: 可连接数据中心结果集。
  array-style: json
  item-schema:
  - name: dataCenter
    type: object
    description: 数据中心信息。
    object-schema:
    - name: dcId
      type: string
      description: 数据中心ID。
    - name: dcName
      type: string
      description: 数据中心名称。
    - name: dcAddress
      type: string
      description: 数据中心地址。
    - name: cityName
      type: string
      description: 数据中心所在城市名称。
    - name: countryName
      type: string
      description: 数据中心所在国家名称。
    - name: areaName
      type: string
      description: 数据中心所在区域名称。
    - name: latitude
      type: float
      description: 数据中心所在地纬度。
    - name: longitude
      type: float
      description: 数据中心所在地经度。
  - name: availableRoutingTypes
    type: object-array
    description: 该数据中心可用的路由模式列表。
    array-style: json
    item-schema:
    - name: routingType
      type: enum
      description: 路由模式。
      enum-values:
      - value: BGP
        desc: BGP 路由模式。
      - value: Static
        desc: 静态路由模式。
      - value: Gateway
        desc: 网关路由模式。
    - name: availableBgpRouteTypes
      type: string-array
      description: |-
        可选的 BGP 路由通告类型列表。
        仅 `routingType` 为 BGP 时有值。
    - name: deliveryType
      type: enum
      description: 开通方式。
      enum-values:
      - value: Auto
        desc: 自动开通。
      - value: Manual
        desc: 人工开通。
    - name: publicInterconnectNetmasks
      type: integer-array
      description: |-
        IPv4 公网互联可选掩码列表。
        目前仅 30 / 31。
