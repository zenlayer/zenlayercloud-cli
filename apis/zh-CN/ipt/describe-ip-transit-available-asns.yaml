name: DescribeIPTransitAvailableAsns
product: ipt
use: describe-ip-transit-available-asns
short: 查询IP Transit可用 ASN
long: 查询IP Transit可用 ASN
examples:
- cmd: zeno ipt describe-ip-transit-available-asns
  desc: 查询当前账号下可用的 ASN 列表。
sdk:
  service: ipt
  version: '2024-09-01'
  action: DescribeIPTransitAvailableAsns
response:
- name: dataSet
  type: object-array
  description: 可用 ASN 列表。
  array-style: json
  item-schema:
  - name: asn
    type: string
    description: ASN 值。
  - name: asnType
    type: enum
    description: ASN 类型。
    enum-values:
    - value: ASN
      desc: 单个 ASN。
    - value: AS_SET
      desc: AS_SET。
