name: CreateIPTransit
product: ipt
use: create-ip-transit
short: 创建IP Transit
long: |-
  创建IP Transit。
  **注意事项**

  * 因设备原因部分区域只支持手动交付，交付周期会在1～3d完成。可以通过 [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md) 的 **deliveryType**`字段来判断是否是极速交付。`
  * 本接口为异步接口，当创建请求下发成功后会返回一个IP Transit的`ID`，此时创建操作并未立即完成。在此期间实例的状态将会处于 **`DEPLOYING`**，创建结果可以通过调用DescribeIpTransit接口查询，如果状态(`iptStatus`)由 **`DEPLOYING`** (创建中)变为 **`AVAILABLE`** (可用)，则代表创建成功，如果状态变为 **`FAILED`** (失败)，则代表创建失败，创建过程中不可对二层网络专线进行任何操作。
  * `internetType=ByInstanceBandwidth95`（95 计费）时须传 `commitBandwidth`；若同时传了 `bandwidth`，必须大于等于 `commitBandwidth`，否则返回 `INVALID_RIPT_BANDWIDTH_LESS_THAN_COMMIT` 错误。
  * 传 `haConfig` 创建高可用 IP Transit 时必须同时传 `iptDcId` 和 `bfd`；缺少 `iptDcId` 返回 `MISSING_PARAMETER` 错误，缺少或不完整的 `bfd` 返回 `INVALID_RIPT_HA_BFD_REQUIRED` 错误；高可用 IP Transit 创建后不允许关闭 BFD。
  * `routingType=BGP` 时须传 `bgp`，且 `bgp.asn` 必传；`bgp.asnList`、`bgp.asSetList` 二选一（至少传一个）。缺少 `bgp`/`bgp.asn` 返回 `MISSING_PARAMETER` 错误，`asnList`/`asSetList` 都未传返回 `INVALID_RIPT_BGP_ASN_LIST_MISSING` 错误，ASN 不在您名下返回 `INVALID_RIPT_BGP_ASN` 错误。
  * `bgp.tier` 为 BGP 档位：`PREMIUM`（优质，缺省）/ `STANDARD`（普通）。普通档仅在部分数据中心开放（见 [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md) 的 `availableBgpTiers`），仅支持 `internetType=ByBandwidth`（固定带宽），且 `bandwidth` 只能取该数据中心的固定档位值（如 10000/50000/100000，单位 Mbps；传入非档位值时 `INVALID_RIPT_BANDWIDTH_NOT_IN_TIER_LEVELS` 错误信息中会返回完整的可选档位列表）；不满足分别返回 `INVALID_RIPT_BGP_TIER_NOT_SUPPORTED`、`INVALID_RIPT_INTERNET_TYPE_FOR_STANDARD_BGP`、`INVALID_RIPT_BANDWIDTH_NOT_IN_TIER_LEVELS` 错误。`zbgRegionId` 非空（基于 router 的 IP Transit）时不支持 `STANDARD`。
  * 两档对应的 Zenlayer 侧（对端）AS 号不同：普通 BGP 为 `29752`，优质 BGP 为 `21859`，请以 [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md) 返回的 `peerAsns` 为准配置您本地路由器的 BGP 邻居。
examples:
- cmd: zeno ipt create-ip-transit --ipt-name test_IPT --ipt-description test_ipt_desc --peer-port-id 1170556726903057557 --peer-port-vlan 1042 --internet-type ByBandwidth --bandwidth 50 --ipt-dc-id AMS1 --routing-type Static --public-ipv4-block-size 28
  desc: 创建一条IP Transit，路由设置成静态路由，公网地址使用/28的CIDR。并且配置BFD。
- cmd: zeno ipt create-ip-transit --ipt-name test_IPT_v4v6 --peer-port-id 1170556726903057557 --peer-port-vlan 1042 --internet-type ByBandwidth --bandwidth 100 --ipt-dc-id AMS1 --routing-type BGP --public-ip-list "{netmask=28, ipType=IPV4, ipNetworkType=BGP_IP, amount=2}" --public-ip-list "{netmask=64, ipType=IPV6, ipNetworkType=BGP_IP}"
  desc: 创建一条 IP Transit，使用 publicIpList 同时分配一个 /28 IPv4 块和一个 /64 IPv6 块。
- cmd: zeno ipt create-ip-transit --ipt-name test_IPT_standard_bgp --peer-port-id 1170556726903057557 --peer-port-vlan 1043 --internet-type ByBandwidth --bandwidth 10000 --ipt-dc-id SIN1 --routing-type BGP --public-ipv4-block-size 28
  desc: 创建一条普通 BGP（STANDARD）档位的 IP Transit，固定带宽 10G。
sdk:
  service: ipt
  version: '2024-09-01'
  action: CreateIPTransit
parameters:
- name: ipt-name
  type: string
  required: false
  sdk-field: iptName
  description: IP Transit名称。
- name: ipt-description
  type: string
  required: false
  sdk-field: iptDescription
  description: IP Transit描述。
- name: peer-port-id
  type: string
  required: true
  sdk-field: peerPortId
  description: 对端数据中心端口 ID。
- name: peer-port-vlan
  type: integer
  required: true
  sdk-field: peerPortVlan
  description: 对端数据中心端口 VLAN。
- name: ipt-dc-id
  type: string
  required: false
  sdk-field: iptDcId
  description: |-
    本端数据中心 ID。
    为空代表本地连接（Local IPT）。
    传 haConfig 创建高可用 IP Transit 时必传。
- name: internet-type
  type: enum
  required: false
  sdk-field: internetType
  description: 网络计费方式。
  enum-values:
  - value: ByBandwidth
    desc: 固定带宽计费。
  - value: ByInstanceBandwidth95
    desc: 95带宽计费。
- name: commit-bandwidth
  type: integer
  required: false
  sdk-field: commitBandwidth
  description: |-
    保底带宽（Mbps）。
    95 计费（internetType=ByInstanceBandwidth95）下必传。
- name: bandwidth
  type: integer
  required: false
  sdk-field: bandwidth
  description: |-
    带宽（Mbps）。
    95 计费（internetType=ByInstanceBandwidth95）下必须大于等于 commitBandwidth。
- name: routing-type
  type: enum
  required: true
  sdk-field: routingType
  description: 路由模式。
  enum-values:
  - value: BGP
    desc: BGP 路由模式。
  - value: Static
    desc: 静态路由模式。
  - value: Gateway
    desc: 网关路由模式。
- name: public-ipv4-block-size
  type: integer-array
  required: false
  sdk-field: publicIPv4BlockSize
  description: |-
    公网 IPv4 地址段大小列表。
    与 publicIpList 互斥，优先级更低。
- name: bfd
  type: object
  required: false
  sdk-field: bfd
  description: |-
    BFD 配置。
    传 haConfig 创建高可用 IP Transit 时必传，且后续不允许关闭。
  object-schema:
  - name: bfdTxInterval
    type: integer
    description: |-
      发送间隔。
      单位：ms。
      取值范围：100～60000。
  - name: bfdRxInterval
    type: integer
    description: |-
      接收间隔。
      单位：ms
      取值范围：100～60000。
  - name: bfdMultiplier
    type: integer
    description: |-
      本地检测倍数。
      取值范围：3～20。
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    资源组 ID。
    不传则放入默认资源组。
- name: bgp
  type: object
  required: false
  sdk-field: bgp
  description: BGP相关配置。
  object-schema:
  - name: routeType
    type: enum
    description: 入站路由类型。
    enum-values:
    - value: ALL_ROUTES
      desc: 全路由。
    - value: ALL_ROUTES_WITH_DEFAULT_ROUTES
      desc: 全路由+默认路由。
    - value: DEFAULT_ROUTES
      desc: 默认路由。
  - name: tier
    type: enum
    description: |-
      BGP 档位。
      STANDARD-普通 BGP，PREMIUM-优质 BGP。
      不传默认优质档（与拆分前行为一致）。
    enum-values:
    - value: STANDARD
      desc: |-
        普通 BGP。
        仅在部分数据中心开放，仅支持固定带宽计费，带宽只能取该数据中心的固定档位值。
    - value: PREMIUM
      desc: |-
        优质 BGP。
        骨干直连低时延线路，为档位缺省值；档位拆分前创建的存量实例统一返回该档位。
  - name: asn
    type: integer
    description: 宣告出站路由的ASN号。
  - name: password
    type: string
    description: 加密认证秘钥。
  - name: asnList
    type: integer-array
    description: 宣告出站路由的ASN号列表。
  - name: asSetList
    type: string-array
    description: 宣告出站路由的AS-SET列表。
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    创建CIDR时关联的标签。
    注意：关联标签键不能重复。--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      标签键。
      长度限制：1～64个字符。
  - name: value
    type: string
    description: |-
      标签值。
      长度限制：1～64个字符。
- name: public-ip-list
  type: object-array
  required: false
  sdk-field: publicIpList
  description: |-
    公网 IP 分配列表。
    与 publicIPv4BlockSize 互斥，优先级更高。
    传此字段时 publicIPv4BlockSize 被忽略。
  array-style: json
  item-schema:
  - name: netmask
    type: integer
    description: |-
      CIDR 掩码长度。
      IPv4 有效范围 24–30，IPv6 有效范围 48–64。
  - name: ipType
    type: enum
    description: IP 类型（IPV4 / IPV6）。
    enum-values:
    - value: IPV4
      desc: IPv4。
    - value: IPV6
      desc: IPv6。
  - name: ipNetworkType
    type: enum
    description: |-
      IP 类型。
      默认 BGP_IP（从 IP 池分配）。
      LOCAL_IP 表示原生 IP。
    enum-values:
    - value: BGP_IP
      desc: 普通 IP。
    - value: LOCAL_IP
      desc: 原生 IP。
  - name: amount
    type: integer
    description: |-
      购买数量。
      指定相同掩码长度的 IP 块数量，默认为 1。
- name: zbg-region-id
  type: string
  required: false
  sdk-field: zbgRegionId
  description: |-
    ZBG 接入节点 ID。
    非空时走 Router RIPT 流程，与 haConfig 互斥。
    调用 ~~zec:DescribeInterconnectBorderGatewayRegions~~ 以获取可用的节点信息。
- name: ha-config
  type: object
  required: false
  sdk-field: haConfig
  description: |-
    HA 高可用配置。
    非空时走 HA 创建流程，与 zbgRegionId 互斥，且此时 iptDcId 和 bfd 均必传。
  object-schema:
  - name: haMode
    type: enum
    description: HA 运行模式。
    enum-values:
    - value: ACTIVE_STANDBY
      desc: |-
        主备模式。
        仅主链路转发流量。
    - value: ACTIVE_ACTIVE
      desc: |-
        负载均衡模式。
        两条子链路同时转发流量。
  - name: secondaryPortId
    type: string
    description: |-
      备链路接入数据中心端口 ID。
      与顶层 peerPortId 必须同城不同 DC。
  - name: secondaryPortVlanId
    type: integer
    description: 备链路数据中心端口 VLAN ID。
- name: public-interconnect-netmask
  type: integer
  required: false
  sdk-field: publicInterconnectNetmask
  description: |-
    公网互联块掩码。
    非空启用公网地址互联，仅 BGP / Static 路由支持。
    合法值见 ~~DescribeIPTransitDatacenters~~ 响应中 availableRoutingTypes[].publicInterconnectNetmasks。
response:
- name: orderNumber
  type: string
  description: 订单号。
- name: iptId
  type: string
  description: IP Transit ID。
