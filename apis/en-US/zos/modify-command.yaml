name: ModifyCommand
product: zos
use: modify-command
short: Edits a command
long: |-
  Edit a command.
  **Note**

  If the command is running, you cannot edit it.
examples:
- cmd: zeno zos modify-command --command-id <commandId> --name Test --content ZWNobyAy
  desc: Edit the command name and script content. `content` must be passed in as the Base64-encoded value of the script content. The `content` in this example is the Base64 encoding of `echo 2`.
- cmd: zeno zos modify-command --command-id <commandId> --content IyEvYmluL2Jhc2gKZWNobyAiaGVsbG8gemVubGF5ZXIiID4gL3RtcC9pbml0LmxvZwo=
  desc: Edit the script content to a multi-line script. The `content` in this example is the Base64 encoding of the script `#!/bin/bash\necho "hello zenlayer" > /tmp/init.log`.
sdk:
  service: zos
  version: '2025-10-10'
  action: ModifyCommand
parameters:
- name: command-id
  type: string
  required: true
  sdk-field: commandId
  description: Command ID to be edited.
- name: name
  type: string
  required: false
  sdk-field: name
  description: |-
    Command name.
    The length should be no more than 64 characters.
- name: content
  type: string
  required: false
  sdk-field: content
  description: |-
    Script content. The value must be Base64-encoded.
    The decoded length should be no more than 16K(16384) characters.
- name: description
  type: string
  required: false
  sdk-field: description
  description: |-
    Command note.
    The length should be no more than 255 characters.
