name: DescribeLoadBalancers
product: zlb
use: describe-load-balancers
short: Queries the list of load balancer instances
long: Query the list of load balancer instances.
examples:
- cmd: zeno zlb describe-load-balancers
  desc: Query the list of load balancer instances.
sdk:
  service: zlb
  version: '2025-04-01'
  action: DescribeLoadBalancers
parameters:
- name: region-id
  type: string
  required: false
  sdk-field: regionId
  description: Region ID.
- name: vpc-id
  type: string
  required: false
  sdk-field: vpcId
  description: Filter by the VPC ID to which the load balance backend server belongs.
- name: ip-stack-type
  type: enum
  required: false
  sdk-field: ipStackType
  description: |-
    Filter by IP stack type.
    A load balancer instance supports only a single stack, that is, IPv4 or IPv6.
  enum-values:
  - value: IPv4
    desc: IPv4 only.
  - value: IPv6
    desc: IPv6 only.
- name: load-balancer-ids
  type: string-array
  required: false
  sdk-field: loadBalancerIds
  description: |-
    ID list of the load balance instance.
    The maximum number of instance IDs is 100.
- name: load-balancer-name
  type: string
  required: false
  sdk-field: loadBalancerName
  description: |-
    Load balance instance name.
    Add * at the end to support fuzzy matching.
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    Number of items in the current page result.
    Default value: 20;
    Maximum value: 1000.
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: Page number of the current page result.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: Resource Group ID.
- name: tag-keys
  type: string-array
  required: false
  sdk-field: tagKeys
  description: |-
    Query using tag keys.
    A maximum of 20 tag keys can be used.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  description: |-
    Query using tags.
    A maximum of 20 tags can be used.
  array-style: json
  item-schema:
  - name: key
    type: string
    description: 'Tag key. Length limit: 1 to 64 characters.'
  - name: value
    type: string
    description: 'Tag value. Length limit: 1 to 64 characters.'
- name: security-group-id
  type: string
  required: false
  sdk-field: securityGroupId
  description: |-
    Security group ID.
    You can call DescribeSecurityGroups to obtain details.
response:
- name: totalCount
  type: integer
  description: The total number of load balance instances that meet the filtering conditions.
- name: dataSet
  type: object-array
  description: The returned list of load balance instances.
  array-style: json
  item-schema:
  - name: regionId
    type: string
    description: Region ID.
  - name: loadBalancerId
    type: string
    description: Load balance instance ID.
  - name: loadBalancerName
    type: string
    description: Load balance instance name.
  - name: vpcId
    type: string
    description: VPC ID to which the load balance backend server belongs.
  - name: subnetId
    type: string
    description: |-
      ID of the subnet that the load balancer instance belongs to.
      The private IP for health check is assigned in this subnet. When `ipStackType` is `IPv6`, the public IPv6 block is also assigned in this subnet.
      This field is empty for the instances created without a specified subnet.
  - name: ipStackType
    type: enum
    description: |-
      IP stack type.
      A load balancer instance supports only a single stack, that is, `IPv4` or `IPv6`.
    enum-values:
    - value: IPv4
      desc: IPv4 only.
    - value: IPv6
      desc: IPv6 only.
  - name: status
    type: enum
    description: Load balance instance state.
    enum-values:
    - value: CREATING
      desc: Creating.
    - value: RUNNING
      desc: Running.
    - value: RECYCLED
      desc: Recycled.
    - value: CREATE_FAILED
      desc: Creating failed.
    - value: RELEASING
      desc: Releasing.
  - name: publicIpAddress
    type: string-array
    description: |-
      Public Virtual IP list of the load balancer instance.
      An `IPv4` load balancer returns a single address (such as `128.0.0.1`), while an `IPv6` load balancer returns a block with a mask (such as `2001:db8::/96`) instead of a single address within the block.
  - name: privateIpAddress
    type: string-array
    description: Private Virtual IP list of the load balancer instance.
  - name: healthCheckPrivateIps
    type: string-array
    description: Health probe source private IP list.
  - name: listenerCount
    type: integer
    description: Listener quantity.
  - name: backendServerCount
    type: integer
    description: |-
      Total number of backend servers added to all listeners of the load balancer.
      Counted by the private IP of the backend servers; multiple private IPs of the same server are counted separately.
  - name: createTime
    type: string
    description: |-
      Creation time.
      Format: YYYY-MM-ddTHH:mm:ssZ
  - name: resourceGroup
    type: object
    description: Resource group information.
    object-schema:
    - name: resourceGroupId
      type: string
      description: Resource group ID.
    - name: resourceGroupName
      type: string
      description: Resource group name.
  - name: tags
    type: object
    description: Tags bound to resources.
    object-schema:
    - name: tags
      type: object-array
      description: List of tags.
      array-style: json
      item-schema:
      - name: key
        type: string
        description: 'Tag key. Length limit: 1 to 64 characters.'
      - name: value
        type: string
        description: 'Tag value. Length limit: 1 to 64 characters.'
  - name: securityGroupId
    type: string
    description: Security group ID.
