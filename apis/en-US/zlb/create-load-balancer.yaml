name: CreateLoadBalancer
product: zlb
use: create-load-balancer
short: Creates a load balancer instance
long: |-
  Create a load balancer instance.
  **Notes**

  * You can call ~~DescribeLoadBalancerRegions~~ to check the regions that support purchasing load balancers.
  * This API is asynchronous. After the request returns successfully, you can call ~~DescribeLoadBalancers~~ to query the state of the load balancer instance. A state of `RUNNING` indicates that the instance was created successfully.
  * Currently, load balancer instances can only be created for ZEC servers.
  * Only postpaid load balancer instances can be created.
  * When creating a load balancer instance, make sure that the VPC has a subnet meeting the `ipStackType` requirement and that at least 2 addresses in the subnet are available for allocation.
  * When an existing EIP is specified through `eipIds`, the EIP is associated only after the load balancer instance is created (its state becomes `RUNNING`). You can call ~~zec:DescribeEips~~ to query the association result.
examples:
- cmd: zeno zlb create-load-balancer --region-id asia-east-1 --vpc-id <vpcId> --security-group-id <securityGroupId> --load-balancer-name sample --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth-mbps 2 --bandwidth-cluster-id --number 1
  desc: Create a public network load balancer instance. The IP billing method is flat rate bandwidth.
- cmd: zeno zlb create-load-balancer --region-id asia-east-1 --subnet-id <subnetId> --load-balancer-name sample --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth-mbps 2 --number 1
  desc: 'Without specifying `vpcId`, only specify `subnetId`: the load balancer instance belongs to the VPC to which the subnet belongs, and 2 private IPv4 addresses are randomly allocated from that subnet as the health probe source IPs.'
- cmd: zeno zlb create-load-balancer --region-id asia-east-1 --vpc-id <vpcId> --load-balancer-name sample --eip-ids <eipId1> --eip-ids <eipId2> --number 1
  desc: Create a load balancer instance with an existing elastic IP (EIP) instead of creating a new EIP.
sdk:
  service: zlb
  version: '2025-04-01'
  action: CreateLoadBalancer
parameters:
- name: region-id
  type: string
  required: true
  sdk-field: regionId
  description: Region ID.
- name: vpc-id
  type: string
  required: false
  sdk-field: vpcId
  description: |-
    ID of the VPC network to which the load balancer backend servers belong.
    At least one of vpcId and subnetId must be specified.
    If only subnetId is specified, the VPC to which the subnet belongs is used.
- name: subnet-id
  type: string
  required: false
  sdk-field: subnetId
  description: |-
    Subnet ID.
    You can call ~~DescribeSubnets~~ to obtain details.
    At least one of vpcId and subnetId must be specified.
    The subnet must be in the same region as regionId; if vpcId is also specified, the subnet must belong to that VPC.
    When ipStackType is IPv4, the subnet must support IPv4 and this parameter is optional (the system selects one within the VPC). When ipStackType is IPv6, the subnet must contain a public IPv6 block (a private IPv6 block does not qualify) and **this parameter is required** — both the public IPv6 VIP and the health probe block are allocated from this subnet, and MISSING_PARAMETER is returned if it is not specified.
- name: health-check-private-ips
  type: string-array
  required: false
  sdk-field: healthCheckPrivateIps
  description: |-
    Health probe source private IP addresses; the quantity must be 2.
    When subnetId is specified and this field is left empty, 2 available private IPv4 addresses are randomly allocated from that subnet as the health probe source IPs. Each load balancer instance occupies 2 addresses; if the subnet does not have enough available private IPv4 addresses remaining, INVALID_SUBNET_IPV4_INSUFFICIENT is returned. The allocation result can be queried by calling ~~DescribeLoadBalancers~~.
    When subnetId is not specified, this parameter is invalid.
    It can be specified only when ipStackType is IPv4. When ipStackType is IPv6, the health probe block is automatically allocated by the system from the public IPv6 block of the subnet, and specifying this parameter returns INVALID_PARAMETER_CONFLICT.
- name: load-balancer-name
  type: string
  required: true
  sdk-field: loadBalancerName
  description: |-
    Load balance instance name.
    Containing 1 to 64 characters.
    Available range: [1.0, +).
- name: ip-stack-type
  type: enum
  required: false
  sdk-field: ipStackType
  description: |-
    IP stack type.
    A load balancer instance supports only a single stack, that is, IPv4 or IPv6. Dual stack is not supported.
    When IPv6 is specified, the public network parameters (internetChargeType, networkLineType, bandwidthMbps, trafficPackageSize, bandwidthClusterId) cannot be configured, and eipIds cannot be specified either because all the EIPs are IPv4. The public addresses of an IPv6 load balancer are assigned separately through the AssignLoadBalancerIpv6 operation.
  enum-values:
  - value: IPv4
    desc: IPv4 only.
  - value: IPv6
    desc: IPv6 only.
- name: eip-ids
  type: string-array
  required: false
  sdk-field: eipIds
  description: |-
    List of IDs of existing elastic IPs to be associated with the new load balancer instance.
    Both single-IP EIPs (mask /32) and block-type EIPs are supported. You can call ~~zec:DescribeEips~~ to query them.
    All EIPs must be in the same region as regionId and in the unassociated state.
    When this parameter is specified, internetChargeType, networkLineType, bandwidthMbps, trafficPackageSize, and bandwidthClusterId do not take effect, no new EIP is created for the instance, and number can only be 1.
    It can be specified only when ipStackType is IPv4.
- name: internet-charge-type
  type: enum
  required: false
  sdk-field: internetChargeType
  description: |-
    IP network billing model.
    This parameter does not take effect when eipIds is specified.
  enum-values:
  - value: ByBandwidth
    desc: Flat rate billing method.
  - value: ByTrafficPackage
    desc: Data transfer package billing method.
  - value: BandwidthCluster
    desc: Bandwidth cluster billing method.
- name: ip-network-type
  type: enum
  required: false
  sdk-field: ipNetworkType
  description: |-
    IP network type.
    Deprecated. Please use networkLineType instead.
  deprecated: true
  enum-values:
  - value: BGPLine
    desc: BGP network.
  - value: CN2Line
    desc: China Telecom Next Carrier Network.
  - value: LocalLine
    desc: Local IP provided by a local ISP.
  - value: ChinaMobile
    desc: China Mobile network.
  - value: ChinaUnicom
    desc: China Unicom network.
  - value: ChinaTelecom
    desc: China Telecom network.
  - value: Cogent
    desc: Cogent IP network offered by Cogent Communications.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
- name: network-line-type
  type: enum
  required: false
  sdk-field: networkLineType
  description: IP network type.
  enum-values:
  - value: PremiumBGP
    desc: |-
      Premium BGP network.
      High-performance network.
  - value: CN2
    desc: China Telecom CN2 network.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
  - value: LocalLine
    desc: Provided by a local ISP.
  - value: StandardBGP
    desc: |-
      Standard BGP network.
      General-purpose network with cost optimization.
  - value: CMI
    desc: 1-Line IP China Mobile.
  - value: CUG
    desc: 1-Line IP China Unicom.
  - value: CTG
    desc: 1-Line IP China Telecom.
- name: bandwidth-mbps
  type: integer
  required: false
  sdk-field: bandwidthMbps
  description: 'Maximum outbound bandwidth of the elastic IP. Unit: Mbps. The maximum limit is usually 10000 Mbps. If you have additional requirements, please contact Support. This parameter is required when internetChargeType is ByBandwidth.'
- name: traffic-package-size
  type: float
  required: false
  sdk-field: trafficPackageSize
  description: |-
    Traffic package size.
    When this parameter is specified, the IP network billing model (internetChargeType) must be ByTrafficPackage; otherwise this parameter does not take effect.
    It can only be set when the billing period is monthly; hourly billing is not supported.
- name: bandwidth-cluster-id
  type: string
  required: false
  sdk-field: bandwidthClusterId
  description: |-
    ID of bandwidth cluster.
    The parameter is only required when internetChargeType is BandwidthCluster.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    Resource Group ID
    If not specified, the load balance instance will belong to the default resource group.
- name: number
  type: integer
  required: false
  sdk-field: number
  description: The number of created load balancers.
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: Information on marketing campaigns.
  object-schema:
  - name: discountCode
    type: string
    description: |-
      Promo Code.
      If no Promo Code exists, the final discount will not apply.
  - name: usePocVoucher
    type: boolean
    description: |-
      Whether to use POC voucher.
      If no POC voucher exists, the related creation will fail.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Bound tags when creating the load balancer.
    Tag keys must be unique.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: 'Tag key. Length limit: 1 to 64 characters.'
  - name: value
    type: string
    description: 'Tag value. Length limit: 1 to 64 characters.'
- name: security-group-id
  type: string
  required: false
  sdk-field: securityGroupId
  description: |-
    Security group ID associated with the load balancer instance.
    You can call ~~DescribeSecurityGroups~~ to obtain details.
response:
- name: orderNumber
  type: string
  description: Order number.
- name: loadBalancerIds
  type: string-array
  description: A collection of unique IDs of the load balancers.
