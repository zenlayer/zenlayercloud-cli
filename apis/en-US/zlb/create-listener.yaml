name: CreateListener
product: zlb
use: create-listener
short: Creates a load balance listener
long: |-
  Creates a TCP, UDP, or TCPSSL listener in the specified load balancer instance. You can configure the listening port, scheduling algorithm, forwarding mode, and health check policy during creation.
  **Notes**

  * `algoOpts` (stateless forwarding) and `persistent` (session persistence) are mutually exclusive because stateless forwarding hashes packets individually and does not maintain a connection-tracking table, so it cannot guarantee that the same client always hits the same backend.
examples:
- cmd: zeno zlb create-listener --load-balancer-id <loadBalancerId> --listener-name sample --protocol TCP --scheduler mh --port 8080-9000,8000 --persistent 60 --idle-timeout 60
  desc: Create a TCP load balance listener to listen to ports `8080-9000` and `8000` without enabling health check.
- cmd: zeno zlb create-listener --load-balancer-id <loadBalancerId> --listener-name sample --protocol TCP --scheduler mh --port 8080 --persistent 60 --idle-timeout 60
  desc: Create a TCP load balance listener and enable health check at the same time.
sdk:
  service: zlb
  version: '2025-04-01'
  action: CreateListener
parameters:
- name: load-balancer-id
  type: string
  required: true
  sdk-field: loadBalancerId
  description: Load balance instance ID.
- name: listener-name
  type: string
  required: true
  sdk-field: listenerName
  description: |-
    Name of the listener to be created.
    Only letters, numbers, hyphens (-), and periods (.) are supported, and the beginning and end must be letters or numbers.
- name: health-check
  type: object
  required: false
  sdk-field: healthCheck
  description: |-
    Parameters related to health check.
    If this parameter is not passed or healthCheck.enable = false, the health check will be disabled.
  object-schema:
  - name: enabled
    type: boolean
    description: Whether to enable health check.
  - name: checkType
    type: enum
    description: |-
      Health check protocols.
      When health check is enabled, the value is required.
    enum-values:
    - value: PING_CHECK
      desc: PING check.
    - value: TCP
      desc: TCP check.
    - value: HTTP_GET
      desc: HTTP check.
  - name: checkPort
    type: integer
    description: |-
      Health check port.
      Defaults to the backend server port. Unless you need a specific port, it is recommended to leave this field empty.
      When the listener port is all ports (0) or a port range and the health check type is `TCP` or `HTTP_GET`, this port must be specified.
  - name: checkDelayLoop
    type: integer
    description: |-
      Health check interval.
      Unit: seconds.
      Optional range: [3, 30].
      Default: 3.
  - name: checkConnTimeout
    type: integer
    description: |-
      Health check timeout period.
      Unit: seconds.
      Optional range: [1, 15].
      Default: 2.
  - name: checkRetry
    type: integer
    description: |-
      Health check retry count.
      Optional range: [1, 5].
      Default: 2.
  - name: checkDelayTry
    type: integer
    description: |-
      Interval between health check retries.
      Unit: seconds.
      Optional range: [1, 15].
      Default: 2.
  - name: checkHttpGetUrl
    type: string
    description: |-
      Health check path.
      Applicable only for the HTTP_GET protocol.
      If specified, it must start with a forward slash (/).
  - name: checkHttpStatusCode
    type: integer
    description: |-
      Health check status code.
      Applicable only for the HTTP_GET protocol.
      Optional range: [100, 599].
  - name: failOpen
    type: boolean
    description: If all backends fail health checks, the load balancer will fail open and continue forwarding traffic to all servers to maintain service continuity.
- name: protocol
  type: enum
  required: true
  sdk-field: protocol
  description: Listening protocols.
  enum-values:
  - value: TCP
    desc: TCP protocol.
  - value: UDP
    desc: UDP protocol.
- name: scheduler
  type: enum
  required: true
  sdk-field: scheduler
  description: Scheduling algorithm of the listener.
  enum-values:
  - value: mh
    desc: Maglev Hashing (mh).
  - value: rr
    desc: Round Robin (rr).
  - value: wrr
    desc: Weighted Round Robin (wrr).
  - value: lc
    desc: Least Connections (lc).
  - value: wlc
    desc: Weighted Least Connections (wlc).
  - value: sh
    desc: Source Hashing (sh).
  - value: dh
    desc: Destination Hashing (dh).
- name: port
  type: string
  required: true
  sdk-field: port
  description: |-
    Listening port.
    Multiple ports are separated by commas (,).
    Port ranges can be defined using a hyphen (-), for example: 10000-10005.
    Valid port values range from 0 to 65535, where 0 indicates all ports.
    Ports must not overlap with other ports configured for the same listener.
    Both a port range and all ports (0) are counted as 1 port for quota calculation.
    Consecutive individual ports will be automatically merged into a port range before being saved and returned. For example, 1,2,3,4,5 will be saved as 1-5.
- name: kind
  type: enum
  required: false
  sdk-field: kind
  description: |-
    Forwarding mode.
    If this load balancer already has listeners, the default value follows their forwarding mode; otherwise, the default value is set based on the region of the load balancer instance (the default value may be DNAT or FNAT).
    All listeners under the same load balancer must use the same forwarding mode. In DR mode, the listener does not support being set to all ports (0).
    When the ipStackType of the load balancer instance is IPv6, only DR is supported, and DR is used by default if it is not specified.
  enum-values:
  - value: FNAT
    desc: Full NAT.
  - value: DR
    desc: Direct Routing.
  - value: DNAT
    desc: Destination NAT.
- name: persistent
  type: integer
  required: false
  sdk-field: persistent
  description: |-
    Session persistence duration, in seconds.
    Mutually exclusive with algoOpts (advanced scheduling-algorithm option): a non-zero value cannot be passed when this listener has algoOpts set.
- name: idle-timeout
  type: integer
  required: false
  sdk-field: idleTimeout
  description: 'Idle timeout period. Unit: seconds.'
- name: algo-opts
  type: enum
  required: false
  sdk-field: algoOpts
  description: |-
    Advanced scheduling-algorithm option.
    Can only be set when the forwarding mode (kind) is DR and the scheduling algorithm (scheduler) is mh; any other combination will cause the request to be rejected.
    Passing None at creation time is equivalent to not setting this field.
    Once enabled, it is mutually exclusive with session persistence (persistent) — both cannot be set to non-zero values at the same time.
  enum-values:
  - value: StatelessForwarding
    desc: MH stateless forwarding (One-Packet Scheduling). When enabled, the load balancer no longer maintains a connection-tracking table and instead selects a backend for each packet in real time based on MH hashing, improving anti-DDoS capability and forwarding performance. Only available when the forwarding mode is `DR` and the scheduling algorithm is `MH`; adding or removing backend nodes, or health-status changes, may interrupt some connections.
  - value: None
    desc: 'Explicitly disables the advanced scheduling-algorithm option. Only meaningful in Create/Modify request semantics: passing this value clears an already-enabled option, while omitting the field leaves it unchanged. Query interfaces (e.g. Describe) never return this value — a disabled state is always represented by an empty field.'
response:
- name: listenerId
  type: string
  description: The created listener ID.
