name: DeregisterBackend
product: zlb
use: deregister-backend
short: Removes one or more backend servers from a load balance listener
long: Remove one or more backend servers from a load balance listener.
examples:
- cmd: zeno zlb deregister-backend --load-balancer-id <loadBalancerId> --listener-id <listenerId> --backend-servers "{instanceId=<backendServerId>, privateIpAddress=10.0.0.1}"
  desc: Remove a backend server from a listener.
sdk:
  service: zlb
  version: '2025-04-01'
  action: DeregisterBackend
parameters:
- name: load-balancer-id
  type: string
  required: true
  sdk-field: loadBalancerId
  description: Load balance instance ID.
- name: listener-id
  type: string
  required: true
  sdk-field: listenerId
  description: The listener ID of the load balancer.
- name: backend-servers
  type: object-array
  required: true
  sdk-field: backendServers
  description: List of backend servers to be removed.
  array-style: json
  item-schema:
  - name: instanceId
    type: string
    description: |-
      Instance ID.
      If a ZEC instance is used as the backend server, you can call ~~DescribeInstances~~ and obtain the value from the instanceId field in the response.
      When unbinding, this field is required for backend servers that have an instance ID.
  - name: privateIpAddress
    type: string
    description: |-
      Private IP address of the network interface attached to the instance.
      When the `ipStackType` of the load balancer instance is `IPv6`, fill in the IPv6 address (either public or private) on the network interface of the instance. In this case, `instanceId` must be specified as well; specifying the IP address alone is not supported.
  - name: weight
    type: integer
    description: |-
      Forwarding weight of the backend server.
      The default value is 100 when adding a server. If not specified during modification, the value will remain unchanged.
      This parameter is not required when deleting a server.
      Optional range: [0, 65535].
  - name: port
    type: integer
    description: |-
      Target port for request forwarding and health checks.
      If left empty, it will follow the listener port configuration.
      This parameter is not required when deleting a server.
      When the listener forwarding mode is `DR`, or the listener uses all ports (0) or multiple ports, specifying a target port is not supported; the target port must match the listener port.
