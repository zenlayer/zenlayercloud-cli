name: InquiryPriceCreateLoadBalancer
product: zlb
use: inquiry-price-create-load-balancer
short: Queries the price for creating a load balancer
long: Query the price for creating a load balancer.
examples:
- cmd: zeno zlb inquiry-price-create-load-balancer --region-id asia-east-1 --vpc-id <vpcId> --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth-mbps 2 --number 1
  desc: Inquire the price of creating a public network load balancer instance (PremiumBGP line, bandwidth billing).
- cmd: zeno zlb inquiry-price-create-load-balancer --region-id asia-east-1 --vpc-id <vpcId> --internet-charge-type ByBandwidth --network-line-type PathBasedBandwidthIP --bandwidth-mbps 2 --number 1
  desc: Inquire the price of creating a public network load balancer instance (PathBasedBandwidthIP line, bandwidth billing). eipNetworkPrice is null; the bandwidth details are in eipNetworkPrices.
- cmd: zeno zlb inquiry-price-create-load-balancer --region-id asia-east-1 --vpc-id <vpcId> --number 1
  desc: Inquire the price of creating a load balancer instance with an existing elastic IP (EIP). Omitting the IP network parameters means no new EIP is created, so `eipPrice`, `eipNetworkPrice`, and `eipNetworkPrices` are all empty.
sdk:
  service: zlb
  version: '2025-04-01'
  action: InquiryPriceCreateLoadBalancer
parameters:
- name: region-id
  type: string
  required: true
  sdk-field: regionId
  description: Region ID.
- name: ip-stack-type
  type: enum
  required: false
  sdk-field: ipStackType
  description: |-
    IP stack type.
    A load balancer instance supports only a single stack, that is, IPv4 or IPv6. Dual stack is not supported.
    When IPv6 is specified, the public network parameters (internetChargeType, networkLineType, bandwidthMbps, trafficPackageSize, bandwidthClusterId) cannot be configured. The public addresses of an IPv6 load balancer are assigned separately through the AssignLoadBalancerIpv6 operation.
  enum-values:
  - value: IPv4
    desc: IPv4 only.
  - value: IPv6
    desc: IPv6 only.
- name: internet-charge-type
  type: enum
  required: false
  sdk-field: internetChargeType
  description: |-
    IP network billing model.
    **Do not pass this parameter when creating a load balancer with an existing EIP** — omitting it means no new EIP is created and the inquiry result contains no EIP-related fees; passing it prices the request as if a new EIP were created, which adds an extra EIP fee.
  enum-values:
  - value: ByBandwidth
    desc: Flat rate billing method.
  - value: ByTrafficPackage
    desc: Data transfer package billing method.
  - value: BandwidthCluster
    desc: Bandwidth cluster billing method.
- name: ip-network-type
  type: enum
  required: false
  sdk-field: ipNetworkType
  description: |-
    IP network type.
    Deprecated. Please use networkLineType instead.
  deprecated: true
  enum-values:
  - value: BGPLine
    desc: BGP network.
  - value: CN2Line
    desc: China Telecom Next Carrier Network.
  - value: LocalLine
    desc: Local IP provided by a local ISP.
  - value: ChinaMobile
    desc: China Mobile network.
  - value: ChinaUnicom
    desc: China Unicom network.
  - value: ChinaTelecom
    desc: China Telecom network.
  - value: Cogent
    desc: Cogent IP network offered by Cogent Communications.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
- name: network-line-type
  type: enum
  required: false
  sdk-field: networkLineType
  description: IP network type.
  enum-values:
  - value: PremiumBGP
    desc: |-
      Premium BGP network.
      High-performance network.
  - value: CN2
    desc: China Telecom CN2 network.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
  - value: LocalLine
    desc: Provided by a local ISP.
  - value: StandardBGP
    desc: |-
      Standard BGP network.
      General-purpose network with cost optimization.
  - value: CMI
    desc: 1-Line IP China Mobile.
  - value: CUG
    desc: 1-Line IP China Unicom.
  - value: CTG
    desc: 1-Line IP China Telecom.
- name: bandwidth-mbps
  type: integer
  required: false
  sdk-field: bandwidthMbps
  description: 'Maximum outbound bandwidth of the elastic IP. Unit: Mbps. The maximum limit is usually 10000 Mbps. If you have additional requirements, please contact Support. This parameter is required when internetChargeType is ByBandwidth.'
- name: traffic-package-size
  type: float
  required: false
  sdk-field: trafficPackageSize
  description: |-
    Traffic package size.
    When this parameter is specified, the IP network billing model (internetChargeType) must be ByTrafficPackage; otherwise this parameter does not take effect.
    It can only be set when the billing period is monthly; hourly billing is not supported.
- name: bandwidth-cluster-id
  type: string
  required: false
  sdk-field: bandwidthClusterId
  description: |-
    ID of bandwidth cluster.
    The parameter is only required when internetChargeType is BandwidthCluster.
response:
- name: loadBalancerInstancePrice
  type: object
  description: The price of the load balancer instance.
  object-schema:
  - name: discount
    type: float
    description: |-
      Discount.
      For example, 80.0 means 20% off.
  - name: discountPrice
    type: float
    description: |-
      Discount price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: originalPrice
    type: float
    description: |-
      Original price of prepaid resources.
      Only used in subscription model. For pay-as-you-go model, the value is empty.
  - name: unitPrice
    type: float
    description: |-
      Original unit price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: discountUnitPrice
    type: float
    description: |-
      Discount unit price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: chargeUnit
    type: string
    description: |-
      Unit of postpaid billing.
      Only used in pay-as-you-go model.
      Value range:
      HOUR: you will be billed by hour.
      DAY: you will be billed by day.
      MONTH: you will be billed by month. For example, the burstable 95th pricing model.
  - name: stepPrices
    type: object-array
    description: |-
      Tiered price of postpaid billing.
      Only used in pay-as-you-go model. If it is not tiered price, the value is empty.
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: First price range of a tiered price.
    - name: stepEnd
      type: float
      description: |-
        Last price range of a tiered price.
        If the value is empty, it means the last tier.
    - name: unitPrice
      type: float
      description: Original unit price of current price range.
    - name: discountUnitPrice
      type: float
      description: Discount unit price of current price range.
  - name: amountUnit
    type: string
    description: |-
      Unit of usage, such as Mbps, LCU, and etc.
      If the value is empty, it means there is no unit.
  - name: excessUnitPrice
    type: float
    description: Original unit price of overages.
  - name: excessDiscountUnitPrice
    type: float
    description: Discount unit price of overages.
  - name: excessAmountUnit
    type: string
    description: |-
      Unit of overage usage.
      If the value is empty, it means there is no unit.
  - name: category
    type: enum
    description: The category to which the price belongs.
    enum-values:
    - value: STANDARD
      desc: Standard price.
    - value: CUSTOMIZED
      desc: Fixed price.
