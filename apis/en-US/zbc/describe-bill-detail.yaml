name: DescribeBillDetail
product: zbc
use: describe-bill-detail
short: Query monthly bill details
long: Queries the monthly bill details, including the total monthly bill amount, and supports filtering by order or resource ID.
examples:
- cmd: zeno zbc describe-bill-detail --bill-monthly 202307 --resource-id 945345672712820433 --page-num 1 --page-size 2
  desc: Query the bill details of a specified month by resource ID.
- cmd: zeno zbc describe-bill-detail --product Compute
  desc: Filter by product, using the default pagination and the default month.
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeBillDetail
parameters:
- name: bill-monthly
  type: integer
  required: false
  sdk-field: billMonthly
  description: |-
    Bill month. Defaults to the current month.
    Format: yyyyMM.
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: Number of records per page. It cannot exceed 5000. Values greater than 5000 are handled as 5000.
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: Page number. Defaults to 1.
- name: resource-id
  type: string
  required: false
  sdk-field: resourceId
  description: Resource ID (instance ID).
- name: order-sn
  type: string
  required: false
  sdk-field: orderSn
  description: Order number.
- name: product
  type: string
  required: false
  sdk-field: product
  description: Product name.
response:
- name: totalCount
  type: integer
  description: Total number of records that match the query conditions.
- name: dataSet
  type: object-array
  description: Result set.
  array-style: json
  item-schema:
  - name: billMonthly
    type: integer
    description: Transaction month.
  - name: label
    type: string
    description: Product name.
  - name: resourceId
    type: string
    description: Resource ID (instance ID).
  - name: product
    type: string
    description: Product line.
  - name: productSubitem
    type: string
    description: Product subitem.
  - name: billingMode
    type: string
    description: Billing mode.
  - name: orderSn
    type: string
    description: Order number.
  - name: deductionTime
    type: string
    description: |-
      Deduction time.
      Time format: yyyy-MM-ddTHH:mm:ssZ.
  - name: amount
    type: float
    description: Bill amount.
  - name: voucher
    type: float
    description: Amount paid with vouchers.
  - name: cash
    type: float
    description: Amount paid in cash.
  - name: location
    type: string
    description: Region.
  - name: resourceGroupId
    type: string
    description: Resource group ID.
  - name: resourceGroupName
    type: string
    description: Resource group name.
  - name: startTime
    type: string
    description: |-
      Start time.
      Time format: yyyy-MM-ddTHH:mm:ssZ.
  - name: endTime
    type: string
    description: |-
      End time.
      Time format: yyyy-MM-ddTHH:mm:ssZ.
- name: totalSpend
  type: float
  description: Total spend.
- name: totalVoucher
  type: float
  description: Total amount paid with vouchers.
- name: totalCash
  type: float
  description: Total amount paid in cash.
- name: totalRefund
  type: float
  description: Total refund amount.
