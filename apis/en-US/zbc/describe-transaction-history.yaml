name: DescribeTransactionHistory
product: zbc
use: describe-transaction-history
short: Query account transaction records
long: Queries the transaction records of the account. Up to 10000 records can be returned. Data beyond 10000 records cannot be queried, and the query time range must not exceed 3 months.
examples:
- cmd: zeno zbc describe-transaction-history --start-time 2023-08-05T14:26:18Z --end-time 2023-09-05T14:26:18Z --transaction-type DEDUCTION --page-num 1 --page-size 3
  desc: Query the deduction transaction records of the account.
- cmd: zeno zbc describe-transaction-history --page-num 1 --page-size 20
  desc: Query all transaction records using the default time range.
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeTransactionHistory
parameters:
- name: end-time
  type: string
  required: false
  sdk-field: endTime
  description: |-
    End time of the query.
    Defaults to the current time if not specified.
    Time format: yyyy-MM-ddTHH:mm:ssZ.
- name: start-time
  type: string
  required: false
  sdk-field: startTime
  description: |-
    Start time of the query.
    Defaults to one month before the end time if not specified.
    The interval between the start time and the end time must not exceed 3 months.
    Time format: yyyy-MM-ddTHH:mm:ssZ.
- name: transaction-type
  type: string-array
  required: false
  sdk-field: transactionType
  description: |-
    Transaction type.
    If not specified, transaction records of all types are returned.
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    Number of records per page.
    Defaults to 20.
    Its product with the page number must not exceed 10000.
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: |-
    Page number.
    Defaults to 1.
    Its product with the number of records per page must not exceed 10000.
response:
- name: incomeSum
  type: float
  description: |-
    Total income.
    Aggregated over all records that match the filter conditions and not affected by pagination.
- name: expenditureSum
  type: float
  description: |-
    Total expenditure.
    Aggregated over all records that match the filter conditions and not affected by pagination.
- name: totalCount
  type: integer
  description: Total number of records that match the query conditions.
- name: dataSet
  type: object-array
  description: Result set of transaction records.
  array-style: json
  item-schema:
  - name: uid
    type: string
    description: Unique identifier of the transaction record.
  - name: accountUid
    type: string
    description: Unique identifier of the account.
  - name: transactionTime
    type: string
    description: |-
      Transaction time.
      Time format: yyyy-MM-ddTHH:mm:ssZ.
  - name: amount
    type: float
    description: Transaction amount.
  - name: cashBalance
    type: float
    description: Account balance after this transaction.
  - name: tradeType
    type: string
    description: |-
      Direction of the transaction.
      Valid values: INCOME (income) and EXPENDITURE (expenditure).
  - name: paymentMethod
    type: string
    description: Payment method.
  - name: description
    type: string
    description: |-
      Transaction description.
      The content consists of product and specification information, and may contain line breaks.
  - name: transactionType
    type: string
    description: Transaction type.
  - name: tradeNo
    type: string
    description: Transaction serial number.
  - name: orderSn
    type: string
    description: Order number.
