name: DescribeRechargeRefundHistory
product: zbc
use: describe-recharge-refund-history
short: Query account recharge and refund records
long: Queries the recharge and refund records of the account.
examples:
- cmd: zeno zbc describe-recharge-refund-history --start-time 2023-08-05T14:26:18Z --end-time 2023-09-05T14:26:18Z --state PAY_SUCCESS --page-num 1 --page-size 10
  desc: Query the recharge and refund records with successful payments.
- cmd: zeno zbc describe-recharge-refund-history --page-num 1 --page-size 20
  desc: Query all recharge and refund records without restricting the time or the state.
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeRechargeRefundHistory
parameters:
- name: end-time
  type: string
  required: false
  sdk-field: endTime
  description: |-
    End time of the query.
    If not specified, no upper time bound is applied.
    Time format: yyyy-MM-ddTHH:mm:ssZ.
- name: start-time
  type: string
  required: false
  sdk-field: startTime
  description: |-
    Start time of the query.
    If not specified, no lower time bound is applied.
    Time format: yyyy-MM-ddTHH:mm:ssZ.
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    Number of records per page.
    Defaults to 20. Values greater than 5000 are handled as 5000.
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: |-
    Page number.
    Defaults to 1.
- name: state
  type: string-array
  required: false
  sdk-field: state
  description: |-
    Recharge state.
    If not specified, records in all states are returned.
    Records in the NO_NEED_PAY state are never returned, even if this value is explicitly specified.
response:
- name: totalCount
  type: integer
  description: Total number of records that match the query conditions.
- name: dataSet
  type: object-array
  description: Result set of recharge and refund records.
  array-style: json
  item-schema:
  - name: accountUid
    type: string
    description: Unique identifier of the account.
  - name: transactionTime
    type: string
    description: |-
      Transaction time.
      Time format: yyyy-MM-ddTHH:mm:ssZ.
  - name: transactionId
    type: string
    description: Transaction serial number.
  - name: state
    type: string
    description: |-
      Transaction state.
      Valid values: PAYING (paying), PAY_FAILED (payment failed), and PAY_SUCCESS (payment succeeded).
  - name: transactionType
    type: string
    description: Transaction type.
  - name: paymentMethod
    type: string
    description: Recharge method.
  - name: amount
    type: float
    description: Transaction amount.
