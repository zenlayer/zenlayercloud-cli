name: DescribeMonthlyBillSummary
product: zbc
use: describe-monthly-bill-summary
short: Query monthly bill summary
long: Queries the monthly bill summary amounts by product or resource group, together with the overall bill totals.
examples:
- cmd: zeno zbc describe-monthly-bill-summary --bill-monthly 202307 --summary-type RESOURCE_GROUP
  desc: Query the bill summary of a specified month by resource group.
- cmd: zeno zbc describe-monthly-bill-summary
  desc: Query using the default dimension and the default month.
sdk:
  service: zbc
  version: '2024-08-09'
  action: DescribeMonthlyBillSummary
parameters:
- name: bill-monthly
  type: integer
  required: false
  sdk-field: billMonthly
  description: Bill month. Defaults to the current month.
- name: summary-type
  type: enum
  required: false
  sdk-field: summaryType
  description: bill summary dimension. Defaults to PRODUCT.
  enum-values:
  - value: PRODUCT
    desc: By product.
  - value: RESOURCE_GROUP
    desc: By resource group.
response:
- name: billMonthly
  type: integer
  description: Bill month.
- name: totalSpend
  type: float
  description: Total spend.
- name: totalVoucher
  type: float
  description: Total amount paid with vouchers.
- name: totalCash
  type: float
  description: Total amount paid in cash.
- name: totalRefund
  type: float
  description: Total refund amount.
- name: summaryInfoList
  type: object-array
  description: bill summary group list.
  array-style: json
  item-schema:
  - name: product
    type: string
    description: Product.
  - name: resourceGroupId
    type: string
    description: Resource group ID.
  - name: resourceGroupName
    type: string
    description: Resource group name.
  - name: spend
    type: float
    description: Spend amount.
  - name: voucher
    type: float
    description: Amount paid with vouchers.
  - name: cash
    type: float
    description: Amount paid in cash.
  - name: refund
    type: float
    description: Refund amount.
