name: DescribeIPTransitDatacenters
product: ipt
use: describe-ip-transit-datacenters
short: Query data centers supported by the IP Transit service
long: |-
  Queries data centers supported by the IP Transit service.
  **BGP tier**

  * For entries with `routingType=BGP`, the response returns `availableBgpTiers` (the BGP tiers available in this data center: `STANDARD` or `PREMIUM`) and `peerAsns` (the Zenlayer-side peer AS number of each tier: `29752` for Standard and `21859` for Premium). Configure the BGP neighbor on your local router based on `peerAsns`.
  * Standard BGP is available only in some data centers. It supports fixed bandwidth billing only, and the bandwidth must be one of the fixed tier levels (for example, 10000/50000/100000 Mbps; if a value outside the tier levels is passed, the error message returns the full list of available tier levels).
  * When `zbgRegionId` is specified (router-based IP Transit), the Standard tier is not supported: `availableBgpTiers` contains only `PREMIUM` and `peerAsns` contains only `21859`. Data centers without the underlying Premium tier capability are not returned.
sdk:
  service: ipt
  version: '2024-09-01'
  action: DescribeIPTransitDatacenters
parameters:
- name: peer-port-id
  type: string
  required: false
  sdk-field: peerPortId
  description: Specified port ID.
- name: peer-dc-id
  type: string
  required: false
  sdk-field: peerDcId
  description: Specified data center ID.
- name: zbg-region-id
  type: string
  required: false
  sdk-field: zbgRegionId
  description: |-
    ZBG access node ID.
    If specified, queries the list of data centers connectable via Router RIPT with this ZBG node as the access side.
response:
- name: supportSet
  type: object-array
  description: Result set.
  array-style: json
  item-schema:
  - name: dataCenter
    type: object
    description: Data center information.
    object-schema:
    - name: dcId
      type: string
      description: Data center ID.
    - name: dcName
      type: string
      description: Data center name.
    - name: dcAddress
      type: string
      description: Data center location.
    - name: cityName
      type: string
      description: City name.
    - name: countryName
      type: string
      description: Country name.
    - name: areaName
      type: string
      description: Region name.
    - name: latitude
      type: float
      description: Latitude of the data center.
    - name: longitude
      type: float
      description: Longitude of the data center.
  - name: availableRoutingTypes
    type: object-array
    description: Supported routing type configurations.
    array-style: json
    item-schema:
    - name: routingType
      type: enum
      description: Routing type.
      enum-values:
      - value: BGP
        desc: BGP. (Currently not supported via API)
      - value: Static
        desc: Static routing.
      - value: Gateway
        desc: Gateway mode.
    - name: availableBgpRouteTypes
      type: string-array
      description: |-
        List of available BGP route types.
        Returned only when `routingType` is BGP.
    - name: availableBgpTiers
      type: string-array
      description: |-
        Available BGP tiers.
        Only available when `routingType` is BGP.
    - name: peerAsns
      type: object-array
      description: |-
        Zenlayer-side (peer) AS numbers for each BGP tier, used to configure the BGP neighbor on your local router.
        Only available when `routingType` is BGP.
      array-style: json
      item-schema:
      - name: tier
        type: enum
        description: BGP tier.
        enum-values:
        - value: STANDARD
          desc: |-
            Standard BGP.
            Available only in some data centers. It supports fixed bandwidth billing only, and the bandwidth must be one of the fixed tier levels of that data center.
        - value: PREMIUM
          desc: |-
            Premium BGP.
            A low-latency line directly connected to the backbone. This is the default tier. Existing instances created before the tier split uniformly return this tier.
      - name: asn
        type: integer
        description: The Zenlayer-side (peer) AS number of this tier.
    - name: deliveryType
      type: enum
      description: Delivery type.
      enum-values:
      - value: Auto
        desc: Automated delivery (Usually completed within minutes).
      - value: Manual
        desc: Manual delivery. (Usually completed within 3 days).
    - name: publicInterconnectNetmasks
      type: integer-array
      description: List of available IPv4 public interconnect netmasks. Currently only 30 / 31 are supported.
