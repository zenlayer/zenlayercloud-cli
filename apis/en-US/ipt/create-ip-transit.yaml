name: CreateIPTransit
product: ipt
use: create-ip-transit
short: Create an IP Transit
long: |-
  Creates an IP Transit.
  #### Preparation

  * **Physical port**: You need to prepare at least one physical port in advance.
  * **Query regions supporting IP Transit:**
    * You can call [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md) to query data centers supporting IP Transit.


  **Notes**

  * Due to equipment reasons, some regions only support manual delivery, with a delivery cycle of 1-3 days. You can check the **deliveryType** field of [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md) to determine whether it is automated delivery.
  * This is an asynchronous API. After the creation request is successfully submitted, an IP Transit `ID` will be returned. The creation is not immediately completed. During this period, the instance state will be **`DEPLOYING`**. You can call DescribeIpTransit to query the result. If the state (`iptStatus`) changes from **`DEPLOYING`** to **`AVAILABLE`**, the creation is successful. If the state changes to **`FAILED`**, the creation has failed. No operations are allowed on the IP Transit during the creation process.
  * When `internetType=ByInstanceBandwidth95` (95th percentile billing), `commitBandwidth` is required. If `bandwidth` is also specified, it must be greater than or equal to `commitBandwidth`; otherwise the `INVALID_RIPT_BANDWIDTH_LESS_THAN_COMMIT` error is returned.
  * When creating a high-availability IP Transit with `haConfig`, both `iptDcId` and `bfd` are required. A missing `iptDcId` returns the `MISSING_PARAMETER` error, and a missing or incomplete `bfd` returns the `INVALID_RIPT_HA_BFD_REQUIRED` error. BFD cannot be disabled after a high-availability IP Transit is created.
  * When `routingType=BGP`, `bgp` is required and `bgp.asn` must be specified. You must also provide either `bgp.asnList` or `bgp.asSetList` (at least one of them). A missing `bgp` or `bgp.asn` returns the `MISSING_PARAMETER` error; if neither `asnList` nor `asSetList` is provided, the `INVALID_RIPT_BGP_ASN_LIST_MISSING` error is returned; if the ASN does not belong to you, the `INVALID_RIPT_BGP_ASN` error is returned.
  * `bgp.tier` specifies the BGP tier: `PREMIUM` (Premium, the default) or `STANDARD` (Standard). The Standard tier is available only in some data centers (see `availableBgpTiers` in [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md)), supports only `internetType=ByBandwidth` (fixed bandwidth), and `bandwidth` must be one of the fixed tier levels of that data center (for example, 10000/50000/100000 Mbps; if a value outside the tier levels is passed, the `INVALID_RIPT_BANDWIDTH_NOT_IN_TIER_LEVELS` error message returns the full list of available tier levels). If these conditions are not met, the `INVALID_RIPT_BGP_TIER_NOT_SUPPORTED`, `INVALID_RIPT_INTERNET_TYPE_FOR_STANDARD_BGP`, or `INVALID_RIPT_BANDWIDTH_NOT_IN_TIER_LEVELS` error is returned respectively. `STANDARD` is not supported when `zbgRegionId` is specified (router-based IP Transit).
  * The Zenlayer-side (peer) AS numbers differ between the two tiers: `29752` for Standard BGP and `21859` for Premium BGP. Configure the BGP neighbor on your local router based on the `peerAsns` returned by [DescribeIPTransitDatacenters](describe-iptransit-datacenters.md).
examples:
- cmd: zeno ipt create-ip-transit --ipt-name test_IPT --ipt-description test_ipt_desc --peer-port-id 1170556726903057557 --peer-port-vlan 1042 --internet-type ByBandwidth --bandwidth 50 --ipt-dc-id AMS1 --routing-type Static --public-ipv4-block-size 28
  desc: Create an IP Transit with static routing, a /28 public CIDR, and BFD configured.
- cmd: zeno ipt create-ip-transit --ipt-name test_IPT_v4v6 --peer-port-id 1170556726903057557 --peer-port-vlan 1042 --internet-type ByBandwidth --bandwidth 100 --ipt-dc-id AMS1 --routing-type BGP --public-ip-list "{netmask=28, ipType=IPV4, ipNetworkType=BGP_IP, amount=2}" --public-ip-list "{netmask=64, ipType=IPV6, ipNetworkType=BGP_IP}"
  desc: Create an IP Transit and use `publicIpList` to allocate a /28 IPv4 block and a /64 IPv6 block at the same time.
- cmd: zeno ipt create-ip-transit --ipt-name test_IPT_standard_bgp --peer-port-id 1170556726903057557 --peer-port-vlan 1043 --internet-type ByBandwidth --bandwidth 10000 --ipt-dc-id SIN1 --routing-type BGP --public-ipv4-block-size 28
  desc: Create an IP Transit with the Standard BGP tier (`STANDARD`) and a fixed bandwidth of 10 Gbps.
sdk:
  service: ipt
  version: '2024-09-01'
  action: CreateIPTransit
parameters:
- name: ipt-name
  type: string
  required: false
  sdk-field: iptName
  description: |-
    IP Transit name.
    Maximum: 255 characters.
- name: ipt-description
  type: string
  required: false
  sdk-field: iptDescription
  description: |-
    IP Transit description.
    Maximum: 255 characters.
- name: peer-port-id
  type: string
  required: true
  sdk-field: peerPortId
  description: |-
    Port ID.
    The port connectivity status must be ACTIVE.
- name: peer-port-vlan
  type: integer
  required: true
  sdk-field: peerPortVlan
  description: |-
    VLAN ID.
    Value range: 1000-4000.
    Must be an unallocated VLAN. You can call DescribePortUsableVlan to query available VLANs.
- name: ipt-dc-id
  type: string
  required: false
  sdk-field: iptDcId
  description: |-
    IP Transit destination data center ID.
    If not specified, it means the IP Transit is in the same data center as the port.
- name: internet-type
  type: enum
  required: false
  sdk-field: internetType
  description: Bandwidth billing method of the IP Transit.
  enum-values:
  - value: ByBandwidth
    desc: Billed by fixed bandwidth.
  - value: ByInstanceBandwidth95
    desc: Billed by 95th percentile bandwidth.
- name: commit-bandwidth
  type: integer
  required: false
  sdk-field: commitBandwidth
  description: |-
    Committed bandwidth.
    Unit: Mbps.
    This field is required if and only if internetType is ByInstanceBandwidth95.
- name: bandwidth
  type: integer
  required: false
  sdk-field: bandwidth
  description: |-
    Bandwidth cap.
    Unit: Mbps.
    Minimum value: 5 Mbps.
    Default value: 5 Mbps.
- name: routing-type
  type: enum
  required: true
  sdk-field: routingType
  description: Routing type.
  enum-values:
  - value: BGP
    desc: BGP. (Currently not supported via API)
  - value: Static
    desc: Static routing.
  - value: Gateway
    desc: Gateway mode.
- name: public-ipv4-block-size
  type: integer-array
  required: false
  sdk-field: publicIPv4BlockSize
  description: |-
    Public IPv4 address block.
    Netmask range: 24-30.
    This field is required if and only if routing type is Static or Gateway.
    Currently, only one public CIDR is allowed.
- name: bfd
  type: object
  required: false
  sdk-field: bfd
  description: |-
    Enable BFD configuration.
    If this field is not specified, BFD is disabled by default.
    Gateway mode does not support BFD configuration.
  object-schema:
  - name: bfdTxInterval
    type: integer
    description: |-
      Transmit interval.
      Unit: ms.
      Value range: 100-60000.
  - name: bfdRxInterval
    type: integer
    description: |-
      Receive interval.
      Unit: ms.
      Value range: 100-60000.
  - name: bfdMultiplier
    type: integer
    description: |-
      Detection multiplier.
      Value range: 3-20.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    Resource group ID.
    If not specified, it will be placed in the default resource group.
- name: bgp
  type: object
  required: false
  sdk-field: bgp
  description: BGP configurations.
  object-schema:
  - name: routeType
    type: enum
    description: Inbound route type.
    enum-values:
    - value: ALL_ROUTES
      desc: Full routes.
    - value: ALL_ROUTES_WITH_DEFAULT_ROUTES
      desc: All routes with default routes.
    - value: DEFAULT_ROUTES
      desc: Default routes.
  - name: tier
    type: enum
    description: |-
      BGP tier.
      STANDARD: Standard BGP. PREMIUM: Premium BGP.
      Defaults to PREMIUM if not specified (consistent with the behavior before the tier split).
    enum-values:
    - value: STANDARD
      desc: |-
        Standard BGP.
        Available only in some data centers. It supports fixed bandwidth billing only, and the bandwidth must be one of the fixed tier levels of that data center.
    - value: PREMIUM
      desc: |-
        Premium BGP.
        A low-latency line directly connected to the backbone. This is the default tier. Existing instances created before the tier split uniformly return this tier.
  - name: asn
    type: integer
    description: ASN for announcing outbound routes.
  - name: password
    type: string
    description: Authentication key.
  - name: asnList
    type: integer-array
    description: ASN list for announcing outbound routes.
  - name: asSetList
    type: string-array
    description: AS-SET list for announcing outbound routes.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Tags to associate when creating the IP Transit.
    Note: Tag keys must be unique.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      Tag key.
      Length limit: 1-128 characters.
  - name: value
    type: string
    description: |-
      Tag value.
      Length limit: 1-128 characters.
- name: public-ip-list
  type: object-array
  required: false
  sdk-field: publicIpList
  description: |-
    List of public IP allocations.
    Mutually exclusive with publicIPv4BlockSize and takes precedence.
    If this field is specified, publicIPv4BlockSize is ignored.
  array-style: json
  item-schema:
  - name: netmask
    type: integer
    description: |-
      CIDR netmask length.
      Valid IPv4 range: 24-30. Valid IPv6 range: 48-64.
  - name: ipType
    type: enum
    description: IP type (IPV4 / IPV6).
    enum-values:
    - value: IPV4
      desc: IPv4.
    - value: IPV6
      desc: IPv6.
  - name: ipNetworkType
    type: enum
    description: |-
      IP network type.
      Default: BGP_IP (allocated from the IP pool).
      LOCAL_IP indicates a native IP.
    enum-values:
    - value: BGP_IP
      desc: Regular IP.
    - value: LOCAL_IP
      desc: Native IP.
  - name: amount
    type: integer
    description: |-
      Purchase quantity.
      Specifies the number of IP blocks with the same netmask length. Default: 1.
- name: zbg-region-id
  type: string
  required: false
  sdk-field: zbgRegionId
  description: |-
    ZBG access node ID.
    If specified, the Router RIPT process is used. Mutually exclusive with haConfig.
- name: ha-config
  type: object
  required: false
  sdk-field: haConfig
  description: |-
    HA configuration.
    If specified, the HA creation process is used. Mutually exclusive with zbgRegionId.
  object-schema:
  - name: haMode
    type: enum
    description: HA operating mode.
    enum-values:
    - value: ACTIVE_STANDBY
      desc: |-
        Active/standby mode.
        Only the primary link forwards traffic.
    - value: ACTIVE_ACTIVE
      desc: |-
        Active/active mode.
        Both sub-links forward traffic simultaneously.
  - name: secondaryPortId
    type: string
    description: |-
      Access port ID of the secondary link.
      Must be in the same city as but a different data center from the top-level peerPortId.
  - name: secondaryPortVlanId
    type: integer
    description: VLAN ID of the secondary link port.
- name: public-interconnect-netmask
  type: integer
  required: false
  sdk-field: publicInterconnectNetmask
  description: |-
    Public interconnect block netmask.
    If specified, public address interconnect is enabled. Only supported for BGP / Static routing.
    For valid values, see availableRoutingTypes[].publicInterconnectNetmasks in the DescribeIPTransitDatacenters response.
response:
- name: orderNumber
  type: string
  description: Order number generated during creation.
- name: iptId
  type: string
  description: IP Transit ID.
