name: DescribeIPTransits
product: ipt
use: describe-ip-transits
short: Query IP Transit resource list
long: Queries IP Transit resource list.
sdk:
  service: ipt
  version: '2024-09-01'
  action: DescribeIPTransits
parameters:
- name: ipt-ids
  type: string-array
  required: false
  sdk-field: iptIds
  description: |-
    List of IP Transit IDs.
    Maximum: 100.
- name: ipt-name
  type: string
  required: false
  sdk-field: iptName
  description: |-
    IP Transit name.
    Fuzzy search is supported.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: Resource group ID.
- name: peer-port-id
  type: string
  required: false
  sdk-field: peerPortId
  description: |-
    Port ID.
    Use this field to filter IP Transits associated with the specified port.
- name: ipt-dc-id
  type: string
  required: false
  sdk-field: iptDcId
  description: |-
    Data center ID.
    You can call DescribeDataCenters to get the latest data center list.
- name: page-size
  type: integer
  required: false
  sdk-field: pageSize
  description: |-
    Number of results per page.
    Default: 20. Maximum: 1000.
- name: page-num
  type: integer
  required: false
  sdk-field: pageNum
  description: |-
    Page number of the returned pages.
    Default: 1.
- name: tag-keys
  type: string-array
  required: false
  sdk-field: tagKeys
  description: |-
    Filter by tag keys.
    Maximum: 20 tags.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  description: |-
    Filter by tags.
    Maximum: 20 tags.
  array-style: json
  item-schema:
  - name: key
    type: string
    description: |-
      Tag key.
      Length limit: 1-128 characters.
  - name: value
    type: string
    description: |-
      Tag value.
      Length limit: 1-128 characters.
response:
- name: totalCount
  type: integer
  description: Total number of data meeting the conditions.
- name: dataSet
  type: object-array
  description: IP Transit result set.
  array-style: json
  item-schema:
  - name: iptId
    type: string
    description: IP Transit ID.
  - name: iptName
    type: string
    description: IP Transit name.
  - name: iptDescription
    type: string
    description: IP Transit description.
  - name: dataCenter
    type: object
    description: Data center of the IP Transit.
    object-schema:
    - name: dcId
      type: string
      description: Data center ID.
    - name: dcName
      type: string
      description: Data center name.
    - name: dcAddress
      type: string
      description: Data center location.
    - name: cityName
      type: string
      description: City name.
    - name: countryName
      type: string
      description: Country name.
    - name: areaName
      type: string
      description: Region name.
    - name: latitude
      type: float
      description: Latitude of the data center.
    - name: longitude
      type: float
      description: Longitude of the data center.
  - name: peerPortId
    type: string
    description: Connected port ID.
  - name: peerPortName
    type: string
    description: Connected port name.
  - name: peerDataCenter
    type: object
    description: Data center of the port side.
    object-schema:
    - name: dcId
      type: string
      description: Data center ID.
    - name: dcName
      type: string
      description: Data center name.
    - name: dcAddress
      type: string
      description: Data center location.
    - name: cityName
      type: string
      description: City name.
    - name: countryName
      type: string
      description: Country name.
    - name: areaName
      type: string
      description: Region name.
    - name: latitude
      type: float
      description: Latitude of the data center.
    - name: longitude
      type: float
      description: Longitude of the data center.
  - name: deliveryType
    type: enum
    description: Delivery type.
    enum-values:
    - value: Auto
      desc: Automated delivery (Usually completed within minutes).
    - value: Manual
      desc: Manual delivery. (Usually completed within 3 days).
  - name: resourceGroupId
    type: string
    description: Resource group ID of the IP Transit.
  - name: resourceGroupName
    type: string
    description: Resource group name of the IP Transit.
  - name: createTime
    type: string
    description: |-
      Creation time.
      Format: YYYY-MM-ddTHH:mm:ssZ.
  - name: routingType
    type: enum
    description: Routing type.
    enum-values:
    - value: BGP
      desc: BGP. (Currently not supported via API)
    - value: Static
      desc: Static routing.
    - value: Gateway
      desc: Gateway mode.
  - name: internetType
    type: enum
    description: Bandwidth billing method.
    enum-values:
    - value: ByBandwidth
      desc: Billed by fixed bandwidth.
    - value: ByInstanceBandwidth95
      desc: Billed by 95th percentile bandwidth.
  - name: bandwidth
    type: integer
    description: |-
      Bandwidth cap.
      Unit: Mbps.
  - name: commitBandwidth
    type: integer
    description: |-
      Committed bandwidth.
      Only available when bandwidth billing method is ByInstanceBandwidth95.
  - name: bfd
    type: object
    description: BFD configuration.
    object-schema:
    - name: bfdTxInterval
      type: integer
      description: |-
        Transmit interval.
        Unit: ms.
        Value range: 100-60000.
    - name: bfdRxInterval
      type: integer
      description: |-
        Receive interval.
        Unit: ms.
        Value range: 100-60000.
    - name: bfdMultiplier
      type: integer
      description: |-
        Detection multiplier.
        Value range: 3-20.
  - name: bgp
    type: object
    description: BGP configurations.
    object-schema:
    - name: routeType
      type: enum
      description: Inbound route type.
      enum-values:
      - value: ALL_ROUTES
        desc: Full routes.
      - value: ALL_ROUTES_WITH_DEFAULT_ROUTES
        desc: All routes with default routes.
      - value: DEFAULT_ROUTES
        desc: Default routes.
    - name: asn
      type: integer
      description: ASN for announcing outbound routes.
    - name: password
      type: string
      description: Authentication key.
    - name: asnList
      type: integer-array
      description: ASN list for announcing outbound routes.
    - name: asSetList
      type: string-array
      description: AS-SET list for announcing outbound routes.
  - name: interconnect
    type: object
    description: Interconnect IP address information.
    object-schema:
    - name: vendorIpv4Address
      type: string
      description: Vendor-side IPv4 address.
    - name: customerIpv4Address
      type: string
      description: Customer-side IPv4 address.
    - name: vendorIpv6Address
      type: string
      description: Zenlayer-side IPv6 interconnect address.
    - name: customerIpv6Address
      type: string
      description: Customer-side IPv6 interconnect address.
  - name: privateConnectId
    type: string
    description: Private connect ID associated with the IP Transit.
  - name: privateConnectName
    type: string
    description: Name of the private connect associated with the IP Transit.
  - name: publicIpv4Addresses
    type: object-array
    description: Public IP information.
    array-style: json
    item-schema:
    - name: ipAddress
      type: string
      description: IP address.
    - name: netmask
      type: integer
      description: Netmask.
    - name: gatewayIpAddress
      type: string
      description: Gateway IP address.
  - name: iptStatus
    type: enum
    description: IP Transit state.
    enum-values:
    - value: CREATING
      desc: Creating.
    - value: UPDATING
      desc: Updating.
    - value: DELETING
      desc: Deleting.
    - value: DESTROYING
      desc: Releasing.
    - value: RECOVERING
      desc: Restoring.
    - value: RUNNING
      desc: Running.
    - value: RECYCLED
      desc: Recycled.
    - value: DESTROYED
      desc: Released.
    - value: CREATING_FAILED
      desc: Creating failed.
    - value: UPDATING_FAILED
      desc: Updating failed.
    - value: DELETING_FAILED
      desc: Deleting failed.
    - value: DESTROYING_FAILED
      desc: Releasing failed.
    - value: RECOVERING_FAILED
      desc: Restoring failed.
  - name: connectivityStatus
    type: enum
    description: Link connectivity status.
    enum-values:
    - value: ACTIVE
      desc: The link is connected normally.
    - value: DOWN
      desc: The link is down.
    - value: ABNORMAL
      desc: The link is partially abnormal.
  - name: tags
    type: object
    description: Tags bound to the IP Transit.
    object-schema:
    - name: tags
      type: object-array
      description: List of tags.
      array-style: json
      item-schema:
      - name: key
        type: string
        description: |-
          Tag key.
          Length limit: 1-128 characters.
      - name: value
        type: string
        description: |-
          Tag value.
          Length limit: 1-128 characters.
  - name: publicIpAddresses
    type: object-array
    description: List of public IP addresses.
    array-style: json
    item-schema:
    - name: ipUuid
      type: string
      description: |-
        IP block UUID.
        Passed as ipUuid when modifying (expanding/shrinking/deleting).
    - name: ipAddress
      type: string
      description: IP address (in CIDR notation, e.g., 192.0.2.0/30).
    - name: netmask
      type: integer
      description: Netmask length.
    - name: gatewayIpAddress
      type: string
      description: Gateway IP.
    - name: ipType
      type: enum
      description: IP type (IPV4 / IPV6).
      enum-values:
      - value: IPV4
        desc: IPv4.
      - value: IPV6
        desc: IPv6.
    - name: ipNetworkType
      type: enum
      description: IP network type (BGP_IP / LOCAL_IP).
      enum-values:
      - value: BGP_IP
        desc: Regular IP.
      - value: LOCAL_IP
        desc: Native IP.
  - name: haMode
    type: enum
    description: HA mode.
    enum-values:
    - value: ACTIVE_STANDBY
      desc: |-
        Active/standby mode.
        Only the primary link forwards traffic.
    - value: ACTIVE_ACTIVE
      desc: |-
        Active/active mode.
        Both sub-links forward traffic simultaneously.
  - name: zbgRegionId
    type: string
    description: |-
      ZBG region ID.
      Returned for IP Transits in ZBG scenarios.
  - name: peerPortType
    type: enum
    description: Peer port type.
    enum-values:
    - value: PORT
      desc: Data center physical port.
    - value: KEY_PORT
      desc: Key Port.
    - value: ZBG
      desc: Border gateway (ZBG).
  - name: haLinks
    type: object-array
    description: |-
      List of HA sub-links.
      Null for non-HA mode. Contains two sub-link objects for HA mode.
    array-style: json
    item-schema:
    - name: isPrimary
      type: boolean
      description: |-
        Whether this is currently the primary link.
        In ACTIVE_STANDBY mode, this dynamically reflects the primary/secondary switchover state. In ACTIVE_ACTIVE mode, the value is null.
    - name: iptStatus
      type: enum
      description: State of the sub-link.
      enum-values:
      - value: CREATING
        desc: Creating.
      - value: UPDATING
        desc: Updating.
      - value: DELETING
        desc: Deleting.
      - value: DESTROYING
        desc: Releasing.
      - value: RECOVERING
        desc: Restoring.
      - value: RUNNING
        desc: Running.
      - value: RECYCLED
        desc: Recycled.
      - value: DESTROYED
        desc: Released.
      - value: CREATING_FAILED
        desc: Creating failed.
      - value: UPDATING_FAILED
        desc: Updating failed.
      - value: DELETING_FAILED
        desc: Deleting failed.
      - value: DESTROYING_FAILED
        desc: Releasing failed.
      - value: RECOVERING_FAILED
        desc: Restoring failed.
    - name: connectivityStatus
      type: enum
      description: Connectivity status of the sub-link.
      enum-values:
      - value: ACTIVE
        desc: The link is connected normally.
      - value: DOWN
        desc: The link is down.
      - value: ABNORMAL
        desc: The link is partially abnormal.
    - name: privateConnectId
      type: string
      description: ID of the associated VLL.
    - name: privateConnectName
      type: string
      description: Name of the associated VLL.
    - name: peerPortId
      type: string
      description: Peer port ID.
    - name: peerPortName
      type: string
      description: Peer port name.
    - name: peerDataCenter
      type: object
      description: Data center of the port.
      object-schema:
      - name: dcId
        type: string
        description: Data center ID.
      - name: dcName
        type: string
        description: Data center name.
      - name: dcAddress
        type: string
        description: Data center location.
      - name: cityName
        type: string
        description: City name.
      - name: countryName
        type: string
        description: Country name.
      - name: areaName
        type: string
        description: Region name.
      - name: latitude
        type: float
        description: Latitude of the data center.
      - name: longitude
        type: float
        description: Longitude of the data center.
    - name: peerPortVlan
      type: integer
      description: VLAN ID.
    - name: interconnect
      type: object
      description: Interconnect IP configuration.
      object-schema:
      - name: vendorIpv4Address
        type: string
        description: Vendor-side IPv4 address.
      - name: customerIpv4Address
        type: string
        description: Customer-side IPv4 address.
      - name: vendorIpv6Address
        type: string
        description: Zenlayer-side IPv6 interconnect address.
      - name: customerIpv6Address
        type: string
        description: Customer-side IPv6 interconnect address.
