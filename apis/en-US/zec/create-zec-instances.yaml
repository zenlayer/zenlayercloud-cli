name: CreateZecInstances
product: zec
use: create-zec-instances
short: Creates one or more instances with specified configurations
long: |-
  Create one or more elastic compute instances with specified configurations.
  #### Prerequisites
  * Query standard instance types: call ~~DescribeZoneInstanceConfigInfos~~ to query instance type information.
  * Query GPU instance types: call ~~DescribeZoneGpuInstanceConfigInfos~~ to query GPU instance type information.
  * Query accelerator instance types: call ~~DescribeZoneAcceleratorConfigInfos~~ to query accelerator instance type information.
  * Query images: call ~~DescribeImages~~ to query image information.
  * Query key pairs: call ~~ccs:DescribeKeyPairs~~ to query key pair ID information.


  **Notes**

  * Once an instance is created successfully, it will automatically power on and its status will change to `RUNNING`. If creation fails, the status will change to `CREATE_FAILED`.
  * Ensure your account is in normal status before purchasing.
  * Creating instances via this API supports automatic voucher deduction — for details, refer to the voucher selection rules.
  * This is an async API. Once the create-instance request is successfully submitted, a list of instance `ID`s is returned, but the creation is not yet complete at that point. During this period the instance status will be `DEPLOYING`. You can query the creation result by calling ~~DescribeInstances~~. If the instance status changes from `DEPLOYING` to `RUNNING`, the creation succeeded; if it changes to `CREATE_FAILED`, the creation failed. No operations can be performed on the instance while creation is in progress.
  * A maximum of **100** instances can be created in a single request.
  * The guaranteed traffic package size is only valid for monthly billing periods.
  * When `eipIds` is bound to a block-type (CIDR) EIP, `eipBindType` can only use `Passthrough` and must be explicitly specified (it cannot be omitted — omitting it is equivalent to `FullNat` and will be rejected).
examples:
- cmd: zeno zec create-zec-instances --zone-id asia-east-1a --instance-type z2a.cpu.1 --image-id ubuntu2404_20240712 --instance-name Test-InstanceName --key-id key-rcfljdP5 --subnet-id 1272168087751233112 --nic-network-type Auto --eip-ids <eipId1>
  desc: Create an instance with the simplest parameters. No public IP address is assigned.
- cmd: zeno zec create-zec-instances --zone-id asia-east-1a --instance-type z2a.cpu.1 --image-id ubuntu2404_20240712 --instance-name Test-InstanceName --key-id key-rcfljdP5 --subnet-id 1272168087751233112 --internet-charge-type BandwidthCluster --bandwidth 10 --cluster-id <clusterId> --network-line-type PremiumBGP
  desc: Create 1 instance and assign a public IP. The line type is BGP, and network billing uses a shared bandwidth package. The bandwidth limit is 10Mbps.
- cmd: zeno zec create-zec-instances --zone-id asia-east-1a --instance-type z2a.cpu.1 --image-id ubuntu2404_20240712 --instance-name Test-InstanceName --key-id key-rcfljdP5 --subnet-id 1272168087751233112 --internet-charge-type BandwidthCluster --bandwidth 10 --ip-stack-type IPv4_IPv6 --cluster-id <clusterId> --ipv6-cluster-id <ipv6ClusterId> --network-line-type PremiumBGP
  desc: Create 1 instance and assign both a public IPv4 and public IPv6 address. The IPv4 line type is BGP, and network billing uses a shared bandwidth package. The bandwidth limit is 10Mbps.
- cmd: zeno zec create-zec-instances --zone-id asia-east-1a --instance-type z2a.cpu.1 --image-id ubuntu2404_20240712 --instance-name Test-InstanceName --key-id key-rcfljdP5 --subnet-id 1272168087751233112 --nic-network-type Auto --data-disks "{diskSize=100, diskCategory=Standard NVMe SSD}" --data-disks "{diskSize=200, diskCategory=Standard NVMe SSD}"
  desc: Create 1 instance configured with multiple data disks.
- cmd: zeno zec create-zec-instances --zone-id asia-east-1a --instance-type z2a.cpu.1 --image-id ubuntu2404_20240712 --instance-name Test-InstanceName --key-id key-rcfljdP5 --subnet-id 1272168087751233112 --nic-network-type Auto --user-data IyEvYmluL2Jhc2gKZWNobyAiaGVsbG8gemVubGF5ZXIiID4gL3RtcC9pbml0LmxvZwo=
  desc: Create 1 instance and specify an initialization script through `userData`. The `userData` in this example is the Base64-encoded value of the script `#!/bin/bash\necho "hello zenlayer" > /tmp/init.log`.
sdk:
  service: zec
  version: '2025-09-01'
  action: CreateZecInstances
parameters:
- name: zone-id
  type: string
  required: true
  sdk-field: zoneId
  description: Availability zone ID.
- name: image-id
  type: string
  required: true
  sdk-field: imageId
  description: |-
    Valid image ID.
    To obtain valid image ID, you can call DescribeImages , and find imageId in the response.
- name: time-zone
  type: string
  required: false
  sdk-field: timeZone
  description: |-
    Time zone of instance.
    Default value: America/Los_Angeles .
- name: instance-type
  type: string
  required: true
  sdk-field: instanceType
  description: Instance type. For VM instances, the value can be obtained through [DescribeZoneInstanceConfigInfos](describezoneinstanceconfiginfos.md). For GPU instances, the value can be obtained through [DescribeZoneGpuInstanceConfigInfos](describezonegpuinstanceconfiginfos.md).
- name: instance-name
  type: string
  required: false
  sdk-field: instanceName
  description: |-
    Instance name to be displayed.
    2 to 63 characters in length.
    Only letters, digits, periods (.), underscores (_), slashes (/) and hyphens (-) are supported.
    It must start and end with a digit or a letter.
    When you purchase multiple instances, you can specify a pattern string [begin_number,bits].
    begin_number: the starting value of the ordered number, value range: [0,99999], default value: 0.
    bits: the number of digits occupied by the ordered number, value range: [1,6], default value: 6.
    Note that spaces are not allowed in the pattern string.
    For example, if you purchase 1 instance with server-[3,3], the instance is displayed as server-003; if you purchase 2 instances, they are displayed as server-003 and server-004.
    Multiple pattern strings are supported, such as server-[3,3]-[1,1].
    Default value: instance.
- name: password
  type: string
  required: false
  sdk-field: password
  description: |-
    Instance password.
    The parameter must be 8-16 characters, including:
    lowercase letters: [a-z] uppercase letters: [A-Z] digits: 0-9 special characters: ~!@$^*-_=+|;:,.?
    You can set either a password or a keyId , but not both; Windows and Generic images support neither option.
- name: key-id
  type: string
  required: false
  sdk-field: keyId
  description: |-
    SSH key pair ID. For example: key-YWD2QFOl .
    Your SSH key pair contains several public keys that can be placed on your server. You can access your instance with the private key. Call DescribeKeyPairs to obtain key pair information.
    You can set either a password or a keyId , but not both; Windows and Generic images support neither option.
- name: nic-network-type
  type: enum
  required: false
  sdk-field: nicNetworkType
  description: |-
    Network interface mode.
    Default value: Auto .
  enum-values:
  - value: Auto
    desc: Default mode auto-adapted to image.
  - value: FailOver
    desc: Failover mode.
  - value: VirtioOnly
    desc: Virtio-net mode.
  - value: VfOnly
    desc: VFIO mode.
- name: instance-count
  type: integer
  required: true
  sdk-field: instanceCount
  description: |-
    The number of instances to be purchased.
    Value range: [1,100].
    Default value: 1.
- name: system-disk
  type: object
  required: false
  sdk-field: systemDisk
  description: |-
    Boot disk configuration.
    If the value is empty, the boot disk size is the minimum default value to store the operating system.
  object-schema:
  - name: diskId
    type: string
    description: |-
      Boot disk ID.
      This parameter is currently only used as a response parameter in query operations such as `DescribeInstances`, and cannot be used as an input parameter in write operations like `CreateInstances`.
  - name: diskSize
    type: integer
    description: |-
      Boot disk size.
      Unit: GiB.
  - name: diskCategory
    type: string
    description: |-
      Disk type.
      Basic NVMe SSD: Economical NVMe SSD.
      Standard NVMe SSD: Standard NVMe SSD.
      Default is Standard NVMe SSD.
  - name: burstingEnabled
    type: boolean
    description: Whether to enable burstable performance.
- name: data-disks
  type: object-array
  required: false
  sdk-field: dataDisks
  description: Data disk configuration for the instance. If not specified, no data disk is purchased by default. Each item in the list corresponds to one independent data disk. The total number of data disks is subject to the team quota.
  array-style: json
  item-schema:
  - name: diskId
    type: string
    description: |-
      Disk ID.
      This parameter is currently only used as a response parameter in query operations such as `DescribeInstances`, and cannot be used as an input parameter for write operations such as `CreateInstances`.
  - name: diskName
    type: string
    description: |-
      Disk name.
      This parameter is currently only used as a response parameter for query operations such as DescribeInstances.
  - name: diskSize
    type: integer
    description: |-
      Disk size.
      Unit: GiB.
  - name: diskAmount
    type: integer
    description: |-
      Number of disks.
      This parameter is only used as an input parameter for APIs such as `CreateInstances` and `InquiryPriceCreateInstance`.
  - name: portable
    type: boolean
    description: |-
      Whether the disk is detachable.
      This parameter is used  as a response parameter in query operations, not as an input parameter.
      true means the disk will not be deleted when the instance is deleted.
      false means the disk will be deleted when the instance is deleted.
  - name: burstingEnabled
    type: boolean
    description: Whether to enable burstable performance.
  - name: diskCategory
    type: string
    description: |-
      Disk type.
      Basic NVMe SSD: the Basic NVMe SSD.
      Standard NVMe SSD: the Standard NVMe SSD.
      Default value: Standard NVMe SSD.
- name: security-group-id
  type: string
  required: false
  sdk-field: securityGroupId
  description: |-
    ID of the security group deployed on the primary vNIC.
    Currently only one security group can be deployed.
    If not specified, the security group associated with global VPC will be used by default.
- name: subnet-id
  type: string
  required: true
  sdk-field: subnetId
  description: |-
    Subnet ID.
    If you need to configure public IP, please ensure your subnet is public network accessible. Subnets only with IPv6 private network access type are not supported.
- name: lan-ip
  type: string
  required: false
  sdk-field: lanIp
  description: Private IP. If the specified IP is occupied, a default private IP will be allocated.
- name: enable-agent
  type: boolean
  required: false
  sdk-field: enableAgent
  description: Whether to enable QEMU Guest Agent (QGA). QGA is enabled by default.
- name: enable-ip-forward
  type: boolean
  required: false
  sdk-field: enableIpForward
  description: Whether to enable IP forwarding. IP forwarding is disabled by default.
- name: internet-charge-type
  type: enum
  required: false
  sdk-field: internetChargeType
  description: Public network pricing model.
  enum-values:
  - value: ByBandwidth
    desc: Billed by the flat rate bandwidth.
  - value: ByTrafficPackage
    desc: Billed by the traffic package size purchased.
  - value: BandwidthCluster
    desc: Billed by the burstable 95th bandwidth of all compute resources in a city-based or regional bandwidth cluster with a shared commitment.
- name: traffic-package-size
  type: float
  required: false
  sdk-field: trafficPackageSize
  description: |-
    The size of the data transfer package to order.
    Unit: TB.
    This value only takes effect when internetChargeType = ByTrafficPackage.
    When IpStackType = IPv4_IPv6, the data transfer package size applies to IPv4.
- name: bandwidth
  type: integer
  required: false
  sdk-field: bandwidth
  description: |-
    Public outbound bandwidth cap.
    Unit: Mbps .
    Bandwidth cap varies by instance size.
- name: eip-bind-type
  type: enum
  required: false
  sdk-field: eipBindType
  description: |-
    Binding mode of the public IP.
    Must be specified when a public IP is assigned.
    When binding a block-type (CIDR) EIP, only Passthrough can be used, and it must be explicitly specified (it cannot be omitted — omitting it is equivalent to FullNat and will be rejected).
  enum-values:
  - value: FullNat
    desc: NAT mode.
  - value: Passthrough
    desc: Bypass mode.
- name: eip-ids
  type: string-array
  required: false
  sdk-field: eipIds
  description: |-
    Assigns existing EIPs to the instances.
    The number of IPs must match the number of instances being created.
    If this field is specified, no new EIPs are created and the related fields become invalid (networkLineType).
    Ensure that the created network interface's ipStackType includes IPv4.
- name: eip-v4-type
  type: enum
  required: false
  sdk-field: eipV4Type
  description: |-
    Network type of public IPv4.
    If you need to specify the value, please ensure that your subnet supports IPv4 stack type.
    If the subnet IP stack type is IPv4, the value is required.
    ThreeLine are not supported for now.
    Deprecated. Please use networkLineType instead.
  deprecated: true
  enum-values:
  - value: BGPLine
    desc: BGP network type.
  - value: CN2Line
    desc: CN2 GIA (CN2 Global Internet Access) network type.
  - value: LocalLine
    desc: Local IP network type.
  - value: ChinaMobile
    desc: China Mobile network type.
  - value: ChinaUnicom
    desc: China Unicom network type.
  - value: ChinaTelecom
    desc: China Telecom network type.
  - value: Cogent
    desc: Cogent Communications network type.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
- name: ip-stack-type
  type: enum
  required: false
  sdk-field: ipStackType
  description: |-
    Set the IP stack type.
    If not specified, IPv4 is used by default when the subnet stack type is IPv4 or IPv4_IPv6.
  enum-values:
  - value: IPv4
    desc: IPv4 stack type only.
  - value: IPv4_IPv6
    desc: IPv4 and IPv6 stack type.
  - value: IPv6
    desc: IPv6 stack type only.
- name: network-line-type
  type: enum
  required: false
  sdk-field: networkLineType
  description: |-
    Network type of public IPv4.
    If you need to specify the value, please ensure that your subnet supports IPv4 stack type.
    If the subnet IP stack type is IPv4, the value is required.
    ThreeLine are not supported for now.
  enum-values:
  - value: PremiumBGP
    desc: |-
      Premium BGP network.
      High-performance network.
  - value: CN2
    desc: China Telecom CN2 network.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
  - value: LocalLine
    desc: Provided by a local ISP.
  - value: StandardBGP
    desc: |-
      Standard BGP network.
      General-purpose network with cost optimization.
  - value: CMI
    desc: 1-Line IP China Mobile.
  - value: CUG
    desc: 1-Line IP China Unicom.
  - value: CTG
    desc: 1-Line IP China Telecom.
- name: cluster-id
  type: string
  required: false
  sdk-field: clusterId
  description: |-
    Bandwidth cluster ID.
    This parameter is required when the network billing model is BandwidthCluster.
- name: ipv6-cluster-id
  type: string
  required: false
  sdk-field: ipv6ClusterId
  description: |-
    Bandwidth cluster ID of the public IPv6 address.
    Required when the network billing model is BandwidthCluster and ipStackType is IPv4_IPv6.
    If not specified, clusterId is used by default.
    This field is typically used when IPv4 and IPv6 belong to different bandwidth clusters.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    Resource group ID where the instances reside.
    If the value is empty, the instance will be added into the default resource group.
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: Information on marketing campaigns.
  object-schema:
  - name: discountCode
    type: string
    description: |-
      Promo Code.
      If no Promo Code exists, the final discount will not apply.
  - name: usePocVoucher
    type: boolean
    description: |-
      Whether to use POC voucher.
      If no POC voucher exists, the related creation will fail.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Bound tags when creating resources.
    Tag keys must be unique.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: 'Tag key. Length limit: 1 to 64 characters.'
  - name: value
    type: string
    description: 'Tag value. Length limit: 1 to 64 characters.'
- name: user-data
  type: string
  required: false
  sdk-field: userData
  description: |-
    Custom initialization script for the instance.
    The value must be Base64-encoded, and the decoded size must be less than 64 KiB.
- name: instance-options
  type: object
  required: false
  sdk-field: instanceOptions
  description: Instance options configuration.
  object-schema:
  - name: nestedVirtualization
    type: boolean
    description: |-
      Whether to the instance for nested virtualization.
      To enable nested virtualization, you must contact Support to activate it; otherwise, the setting will be ineffective.
response:
- name: orderNumber
  type: string
  description: Number of order.
- name: instanceIdSet
  type: string-array
  description: |-
    List of instance IDs.
    The returned instance ID list does not mean the creation has been completed.uery the status of the instance according to dataSet . If the status changes from DEPLOYING to RUNNING , it means that the instance has been created successfully; CREATE_FAILED or no instance found means the instance has been created failed.
- name: instances
  type: object-array
  description: Set of disk IDs created along with the instances. If no disk is specified, the value is empty.
  array-style: json
  item-schema:
  - name: instanceId
    type: string
    description: Instance ID.
  - name: diskIdSet
    type: string-array
    description: Data disk ID created along with the instance.
