name: DeleteSecurityGroup
product: zec
use: delete-security-group
short: Deletes a security group
long: |-
  Delete a security group.
  **Notes**

  * The default security group cannot be deleted.
  * Before deleting a security group, ensure it is not referenced by any network interface, NAT gateway, load balancer, or high-availability virtual IP (HaVip).
examples:
- cmd: zeno zec delete-security-group --security-group-id your-security-group-id
  desc: Delete a security group.
sdk:
  service: zec
  version: '2025-09-01'
  action: DeleteSecurityGroup
parameters:
- name: security-group-id
  type: string
  required: true
  sdk-field: securityGroupId
  description: Security group ID.
