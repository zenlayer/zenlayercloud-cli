name: DescribeZoneAcceleratorConfigInfos
product: zec
use: describe-zone-accelerator-config-infos
short: Describes accelerator instance types available for sale in a zone
long: |-
  Describe accelerator instance types available for sale in a zone.
  **Notes**

  * The `instanceType` field is an accelerator instance type ID, such as `z2a.v.T1U.c16m64.1`. When creating an accelerator instance, pass this value to the `instanceType` parameter of [`CreateZecInstances`](createzecinstances.md).
  * `acceleratorType` indicates the accelerator card type. Valid values: `VPU` (video transcoding card). More types such as `TPU`/`NPU`/`LPU` may be supported in the future.
  * `inventoryCapacity` indicates the inventory capacity level of the accelerator series in the region of the corresponding zone: `LIMITED` (< 1000), `NORMAL` (1000-2000), `SUFFICIENT` (2000-5000), `ABUNDANT` (>= 5000). Since the number of accelerator instances is far below these thresholds, it is usually `LIMITED` when actually available.
  * `price` is the actual selling price of the instance type.
examples:
- cmd: zeno zec describe-zone-accelerator-config-infos
  desc: Query accelerator instance types available for sale in all zones.
- cmd: zeno zec describe-zone-accelerator-config-infos --zone-id asia-east-1a
  desc: Query accelerator instance types available for sale in a specific zone.
sdk:
  service: zec
  version: '2025-09-01'
  action: DescribeZoneAcceleratorConfigInfos
parameters:
- name: zone-id
  type: string
  required: false
  sdk-field: zoneId
  description: |-
    The zone ID to query.
    For example: na-us-la-2a.
    If not specified, accelerator instance types in all zones are returned.
- name: instance-type
  type: string
  required: false
  sdk-field: instanceType
  description: |-
    The accelerator instance type ID to query.
    For example: z2a.v.T1U.c16m64.1.
    If not specified, all accelerator instance types are returned.
response:
- name: instanceTypeQuotaSet
  type: object-array
  required: true
  description: List of accelerator instance type availability information.
  array-style: json
  item-schema:
  - name: zoneId
    type: string
    description: Zone ID.
  - name: instanceType
    type: string
    description: |-
      Accelerator instance type ID.
      For example: z2a.v.T1U.c16m64.1.
      When creating an instance, pass this value to the `instanceType` parameter of CreateZecInstances.
  - name: acceleratorType
    type: string
    description: |-
      Accelerator card type.
      Valid values: VPU.
      More types such as TPU/NPU/LPU may be supported in the future.
  - name: cpuCount
    type: integer
    description: |-
      Number of CPU cores.
      Unit: core.
  - name: memory
    type: integer
    description: |-
      Memory size.
      Unit: GiB.
  - name: acceleratorAmount
    type: integer
    description: Number of accelerator cards.
  - name: instanceTypeName
    type: string
    description: Accelerator instance type name.
  - name: bps
    type: integer
    description: |-
      Maximum bandwidth per network interface.
      Unit: bit/s.
  - name: pps
    type: integer
    description: |-
      Maximum number of packets sent and received per network interface.
      Unit: packets/second.
  - name: inventoryCapacity
    type: enum
    description: Inventory capacity level of the accelerator series.
    enum-values:
    - value: LIMITED
      desc: Limited inventory, with available vCPU cores < 1000.
    - value: NORMAL
      desc: Normal inventory, with available vCPU cores from 1000 to 2000.
    - value: SUFFICIENT
      desc: Sufficient inventory, with available vCPU cores from 2000 to 5000.
    - value: ABUNDANT
      desc: Abundant inventory, with available vCPU cores ≥ 5000.
  - name: price
    type: object
    description: Price of the instance type.
    object-schema:
    - name: discount
      type: float
      description: |-
        Discount.
        For example, 80.0 means 20% off.
    - name: discountPrice
      type: float
      description: |-
        Discount price of postpaid resources.
        Only used in pay-as-you-go model. For tiered billing, the value is empty.
    - name: originalPrice
      type: float
      description: |-
        Original price of prepaid resources.
        Only used in subscription model. For pay-as-you-go model, the value is empty.
    - name: unitPrice
      type: float
      description: |-
        Original unit price of postpaid resources.
        Only used in pay-as-you-go model. For tiered billing, the value is empty.
    - name: discountUnitPrice
      type: float
      description: |-
        Discount unit price of postpaid resources.
        Only used in pay-as-you-go model. For tiered billing, the value is empty.
    - name: chargeUnit
      type: string
      description: |-
        Unit of postpaid billing.
        Only used in pay-as-you-go model.
        Value range:
        HOUR : you will be billed by hour.
        DAY : you will be billed by day.
        MONTH : you will be billed by month. For example, the burstable 95th pricing model.
    - name: stepPrices
      type: object-array
      description: |-
        Tiered price of postpaid billing.
        Only used in pay-as-you-go model. If it is not tiered price, the value is empty.
      array-style: json
      item-schema:
      - name: stepStart
        type: float
        description: First price range of a tiered price.
      - name: stepEnd
        type: float
        description: |-
          Last price range of a tiered price.
          If the value is empty, it means the last tier.
      - name: unitPrice
        type: float
        description: Original unit price of current price range.
      - name: discountUnitPrice
        type: float
        description: Discount unit price of current price range.
    - name: amountUnit
      type: string
      description: |-
        Unit of usage,
        such as Mbps , LCU , and etc.
        If the value is empty, it means there is no unit.
    - name: excessUnitPrice
      type: float
      description: Original unit price of overages.
    - name: excessDiscountUnitPrice
      type: float
      description: Discount unit price of overages.
    - name: excessAmountUnit
      type: string
      description: |-
        Unit of overage usage.
        If the value is empty, it means there is no unit.
    - name: category
      type: enum
      description: The category to which the price belongs.
      enum-values:
      - value: STANDARD
        desc: Standard price.
      - value: CUSTOMIZED
        desc: Fixed price.
