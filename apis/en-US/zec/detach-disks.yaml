name: DetachDisks
product: zec
use: detach-disks
short: Detaches one or more disks from an instance
long: |-
  Detach one or more disks from an instance.
  **Notes**

  * A maximum of 10 disks can be detached in a single request.
  * If a disk is already detached, the target state is considered achieved and it is simply skipped.
  * If a disk does not meet the detach conditions (disk type is not `DATA`, `portable` is not `true`, status is not `IN_USE`, or when `instanceCheckFlag` is `true` the attached instance is not powered off, etc.), only that disk will fail to detach — its ID will appear in the response's `failedDiskIds`, without affecting the detachment of the other disks.
  * Disk IDs in the request that do not exist are silently ignored; they will not cause the request to fail, nor will they appear in `failedDiskIds`.
examples:
- cmd: zeno zec detach-disks --disk-ids your-disk-id
  desc: Detach one or more disks from an instance.
sdk:
  service: zec
  version: '2025-09-01'
  action: DetachDisks
parameters:
- name: disk-ids
  type: string-array
  required: true
  sdk-field: diskIds
  description: ID list of disks to be detached.
- name: instance-check-flag
  type: boolean
  required: false
  sdk-field: instanceCheckFlag
  description: |-
    Check instance running status.
    Default value: true , meaning disk detach allowed only when instance is shut down.
response:
- name: failedDiskIds
  type: string-array
  description: Disks failed to be detached.
