name: CreateVpc
product: zec
use: create-vpc
short: Creates a global VPC
long: Create a global VPC.
examples:
- cmd: zeno zec create-vpc --name vpcXXX --cidr-block 10.0.0.0/9 --mtu 1300
  desc: Create a VPC.
- cmd: zeno zec create-vpc --name vpcXXX --cidr-block 21.0.0.0/9,22.0.0.0/9 --mtu 1300
  desc: Create a VPC with multiple CIDR blocks.
sdk:
  service: zec
  version: '2025-09-01'
  action: CreateVpc
parameters:
- name: name
  type: string
  required: true
  sdk-field: name
  description: |-
    Global VPC name to be displayed.
    This parameter must start and end with a number or a letter, containing 2 to 63 characters. Only letters, numbers, - and periods (.) are supported.
- name: cidr-block
  type: string
  required: true
  sdk-field: cidrBlock
  description: |-
    The CIDR block of the VPC. All subnets in this VPC must fall within this CIDR block.
    The mask length ranges from 9 to 29, and the starting address of the CIDR block must be specified, for example 10.0.0.0/16.
    Multiple CIDR blocks are supported and must be separated by commas, for example: 21.0.0.0/9,22.0.0.0/9. The CIDR blocks must not overlap with each other.
    The maximum number of CIDR blocks of a single VPC is controlled by the quota ZEC_CIDR_IPv4_Blocks_per_VPC, which is 5 by default. You can apply for a higher limit.
    The CIDR block must not overlap with the following reserved CIDR blocks: 0.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, and 224.0.0.0/4.
- name: mtu
  type: integer
  required: true
  sdk-field: mtu
  description: 'The MTU (Maximum Transmission Unit) of the VPC. Supported values: 1300, 1500, 9000.'
- name: enable-pri-ipv6
  type: boolean
  required: false
  sdk-field: enablePriIpv6
  description: |-
    Enable private IPv6 or not. Private IPv6 is disabled by default.
    Default value: false .
    Once enabled, private IPv6 CIDR block function cannot be disabled.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: |-
    Resource group ID where the global VPC resides.
    If the value is empty, the global VPC will belong to the Default Resource Group.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: Tags to associate when creating the VPC. Tag keys within the same resource cannot be duplicated.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: 'Tag key. Length limit: 1 to 64 characters.'
  - name: value
    type: string
    description: 'Tag value. Length limit: 1 to 64 characters.'
response:
- name: vpcId
  type: string
  description: Global VPC ID.
