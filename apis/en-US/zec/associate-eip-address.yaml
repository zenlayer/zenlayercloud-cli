name: AssociateEipAddress
product: zec
use: associate-eip-address
short: Associates elastic IPs to resources in the same region
long: |-
  Associate elastic IPs to resources in the same region.
  **Notes**

  * You can call [`DescribeLoadBalancers`](../../../networking/zlb/load-balancer-instance/describeloadbalancers.md) to query the load balancers that support association.
  * You can call [`DescribeNetworkInterfaces`](../vnic/describenetworkinterfaces.md) to query the vNICs that support association.
  * You can call [`DescribeNatGateways`](../nat-gateway/describenatgateways.md) to query the NAT gateways that support association.
  * You can call [`DescribeHaVips`](../havip/describehavips.md) to query the high availability virtual IPs that support association.
  * Exactly one of the parameters `loadBalancerId`, `nicId`, `natId`, and `haVipId` must be specified. If more than one is specified, they take effect in the following order of priority: `loadBalancerId`, `nicId`, `natId`, `haVipId`.
  * When associating with a load balancer via `loadBalancerId`, `bindType` does not take effect (a load balancer does not require a binding mode) and the value passed in is ignored.
  * When associating with a load balancer via `loadBalancerId`, both single-IP EIPs (mask `/32`) and block-type EIPs are supported. A block-type EIP associated with a vNIC supports only `Passthrough` (bypass mode), and block-type EIPs are not supported when associating with a NAT gateway or a high availability virtual IP.
  * When associating with a high availability virtual IP via `haVipId`, `bindType` can only be `FullNat` (NAT mode). If any other value is passed in, all elastic IPs in this request fail to associate.
  * If the association limit is exceeded, contact Support to request a quota increase.
  * The API returns the set of elastic IP IDs that failed to associate. An empty set indicates that all of them succeeded.
examples:
- cmd: zeno zec associate-eip-address --nic-id <nicId> --lan-ip 10.0.0.2 --eip-ids <eipId1> --eip-ids <eipId2> --bind-type Passthrough
  desc: Associate elastic IPs to a specified vNIC with the Cut-through Mode.
- cmd: zeno zec associate-eip-address --load-balancer-id <loadBalancerId> --eip-ids <eipId1> --eip-ids <eipId2>
  desc: Associate elastic IPs to a specified load balancer instance.
- cmd: zeno zec associate-eip-address --nat-id <natId> --eip-ids <eipId1> --eip-ids <eipId2>
  desc: Associate elastic IPs to a specified NAT gateway.
- cmd: zeno zec associate-eip-address --ha-vip-id <haVipId> --eip-ids <eipId1>
  desc: Associate an elastic IP to a high availability virtual IP (HaVip).
- cmd: zeno zec associate-eip-address --ha-vip-id <haVipId> --eip-ids <eipId1> --eip-ids <eipId2>
  desc: Associate multiple elastic IPs to a high availability virtual IP (HaVip) at the same time.
sdk:
  service: zec
  version: '2025-09-01'
  action: AssociateEipAddress
parameters:
- name: load-balancer-id
  type: string
  required: false
  sdk-field: loadBalancerId
  description: |-
    Load balancer ID.
    Only load balancers whose ipStackType is IPv4 can be bound to an elastic IP. A load balancer supports a single stack only; public IPv6 addresses are assigned through the AssignLoadBalancerIpv6 API.
- name: nic-id
  type: string
  required: false
  sdk-field: nicId
  description: vNIC ID.
- name: lan-ip
  type: string
  required: false
  sdk-field: lanIp
  description: |-
    Private IP.
    If nicId is provided, this field is required.
- name: nat-id
  type: string
  required: false
  sdk-field: natId
  description: NAT gateway ID.
- name: eip-ids
  type: string-array
  required: true
  sdk-field: eipIds
  description: ID list of elastic IPs.
- name: ha-vip-id
  type: string
  required: false
  sdk-field: haVipId
  description: The ID of the high availability virtual IP.
- name: bind-type
  type: enum
  required: false
  sdk-field: bindType
  description: |-
    Binding type.
    Effective when binding to a network interface.
    Defaults to standard NAT mode.
  enum-values:
  - value: FullNat
    desc: NAT mode.
  - value: Passthrough
    desc: Bypass mode.
response:
- name: failedEipIds
  type: string-array
  description: Elastic IP IDs that failed to bind.
