name: InquiryPriceModifyEipFlowPackage
product: zec
use: inquiry-price-modify-eip-flow-package
short: Inquires the price after adjusting the EIP traffic package
long: |-
  Inquire the price after adjusting the EIP traffic package. The `previousPrices` field also returns the currently effective price of each billing item before the change, so that you can identify which billing items have been repriced.
  **Notes**

  * Only EIPs in an available state (`BINDED` or `UNBIND`) billed by traffic package (`ByTrafficPackage`) support this operation.
  * PathBasedBandwidthIP line type does not support this operation.
  * The size of the guaranteed traffic package is only valid for billing periods of one month.
examples:
- cmd: zeno zec inquiry-price-modify-eip-flow-package --eip-id eip-xxx --flow-package 10
  desc: Inquire the price after adjusting the EIP traffic package to 10 TB.
sdk:
  service: zec
  version: '2025-09-01'
  action: InquiryPriceModifyEipFlowPackage
parameters:
- name: eip-id
  type: string
  required: true
  sdk-field: eipId
  description: The elastic IP to operate on.
- name: flow-package
  type: float
  required: true
  sdk-field: flowPackage
  description: |-
    Target traffic package size after adjustment.
    Unit: TB, a multiple of 0.1 or 0.
response:
- name: eipPrice
  type: object
  description: |-
    Retention price of the elastic IP.
    Null for IPs created via CIDR.
  object-schema:
  - name: discount
    type: float
    description: |-
      Discount.
      For example, 80.0 means 20% off.
  - name: discountPrice
    type: float
    description: |-
      Discount price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: originalPrice
    type: float
    description: |-
      Original price of prepaid resources.
      Only used in subscription model. For pay-as-you-go model, the value is empty.
  - name: unitPrice
    type: float
    description: |-
      Original unit price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: discountUnitPrice
    type: float
    description: |-
      Discount unit price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: chargeUnit
    type: string
    description: |-
      Unit of postpaid billing.
      Only used in pay-as-you-go model.
      Value range:
      HOUR : you will be billed by hour.
      DAY : you will be billed by day.
      MONTH : you will be billed by month. For example, the burstable 95th pricing model.
  - name: stepPrices
    type: object-array
    description: |-
      Tiered price of postpaid billing.
      Only used in pay-as-you-go model. If it is not tiered price, the value is empty.
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: First price range of a tiered price.
    - name: stepEnd
      type: float
      description: |-
        Last price range of a tiered price.
        If the value is empty, it means the last tier.
    - name: unitPrice
      type: float
      description: Original unit price of current price range.
    - name: discountUnitPrice
      type: float
      description: Discount unit price of current price range.
  - name: amountUnit
    type: string
    description: |-
      Unit of usage,
      such as Mbps , LCU , and etc.
      If the value is empty, it means there is no unit.
  - name: excessUnitPrice
    type: float
    description: Original unit price of overages.
  - name: excessDiscountUnitPrice
    type: float
    description: Discount unit price of overages.
  - name: excessAmountUnit
    type: string
    description: |-
      Unit of overage usage.
      If the value is empty, it means there is no unit.
  - name: category
    type: enum
    description: The category to which the price belongs.
    enum-values:
    - value: STANDARD
      desc: Standard price.
    - value: CUSTOMIZED
      desc: Fixed price.
