name: ReplaceEipAddress
product: zec
use: replace-eip-address
short: Replaces the elastic IP addresses
long: |-
  Replace the elastic IP addresses.
  **Notes**

  * The EIP to be replaced must be unassociated, that is, not associated with any resource such as an instance or a vNIC.
  * EIPs created from a CIDR block do not support replacing the IP.
examples:
- cmd: zeno zec replace-eip-address --replace-ips {eipId=<eipId>}
  desc: Replace the public IP. The system will assign one randomly.
sdk:
  service: zec
  version: '2025-09-01'
  action: ReplaceEipAddress
parameters:
- name: replace-ips
  type: object-array
  required: true
  sdk-field: replaceIps
  description: Lists of the original and target elastic IPs.
  array-style: json
  item-schema:
  - name: eipId
    type: string
    description: Elastic IP ID.
  - name: ownIp
    type: string
    description: |-
      Original IP address.
      Deprecated.
  - name: targetIp
    type: string
    description: |-
      Target IP to change to.
      If not specified, the system will assign one randomly.
      Cannot end in `.0` or `.255` (network/broadcast addresses are not available).
response:
- name: failedEipIds
  type: string-array
  description: Elastic IP IDs that failed to replace.
