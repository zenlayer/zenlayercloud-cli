name: InquiryPricePublicIpv6
product: zec
use: inquiry-price-public-ipv6
short: Queries the price of data transfer or bandwidth for the public IPv6
long: |-
  Query the price of data transfer or bandwidth for the public IPv6.
  **Notes**

  * The size of the guaranteed traffic package is only valid for billing periods of one month.
  * `amount` is used to inquire the price of multiple public IPv6 addresses at once (for example, when a load balancer is assigned multiple public IPv6 addresses). If not specified, it defaults to 1, and the price accumulates by quantity.
examples:
- cmd: zeno zec inquiry-price-public-ipv6 --region-id asia-east-1 --package-size 10
  desc: Inquire the price of a public IPv6 billed by a 10 TB traffic package in the asia-east-1 region.
- cmd: zeno zec inquiry-price-public-ipv6 --region-id asia-east-1 --bandwidth 100 --amount 3
  desc: Inquire the price of 3 public IPv6 addresses with a fixed bandwidth of 100 Mbps in the asia-east-1 region in a single request.
sdk:
  service: zec
  version: '2025-09-01'
  action: InquiryPricePublicIpv6
parameters:
- name: region-id
  type: string
  required: true
  sdk-field: regionId
  description: Region ID.
- name: package-size
  type: float
  required: false
  sdk-field: packageSize
  description: |-
    Traffic package size (TB). The unit is TB.
    This value takes effect only when internetChargeType is set to ByTrafficPackage .
    The default value is 0.
    Maximum of one decimal place.
- name: bandwidth
  type: integer
  required: false
  sdk-field: bandwidth
  description: |-
    Outbound public network bandwidth cap (Mbps). Unit: Mbps.
    The value differs with different instance types.
- name: amount
  type: integer
  required: false
  sdk-field: amount
  description: |-
    Number of public IPv6 addresses for the price inquiry.
    The price accumulates by quantity.
response:
- name: bandwidthPrice
  type: object
  description: Price of bandwidth.
  object-schema:
  - name: discount
    type: float
    description: |-
      Discount.
      For example, 80.0 means 20% off.
  - name: discountPrice
    type: float
    description: |-
      Discount price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: originalPrice
    type: float
    description: |-
      Original price of prepaid resources.
      Only used in subscription model. For pay-as-you-go model, the value is empty.
  - name: unitPrice
    type: float
    description: |-
      Original unit price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: discountUnitPrice
    type: float
    description: |-
      Discount unit price of postpaid resources.
      Only used in pay-as-you-go model. For tiered billing, the value is empty.
  - name: chargeUnit
    type: string
    description: |-
      Unit of postpaid billing.
      Only used in pay-as-you-go model.
      Value range:
      HOUR : you will be billed by hour.
      DAY : you will be billed by day.
      MONTH : you will be billed by month. For example, the burstable 95th pricing model.
  - name: stepPrices
    type: object-array
    description: |-
      Tiered price of postpaid billing.
      Only used in pay-as-you-go model. If it is not tiered price, the value is empty.
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: First price range of a tiered price.
    - name: stepEnd
      type: float
      description: |-
        Last price range of a tiered price.
        If the value is empty, it means the last tier.
    - name: unitPrice
      type: float
      description: Original unit price of current price range.
    - name: discountUnitPrice
      type: float
      description: Discount unit price of current price range.
  - name: amountUnit
    type: string
    description: |-
      Unit of usage,
      such as Mbps , LCU , and etc.
      If the value is empty, it means there is no unit.
  - name: excessUnitPrice
    type: float
    description: Original unit price of overages.
  - name: excessDiscountUnitPrice
    type: float
    description: Discount unit price of overages.
  - name: excessAmountUnit
    type: string
    description: |-
      Unit of overage usage.
      If the value is empty, it means there is no unit.
  - name: category
    type: enum
    description: The category to which the price belongs.
    enum-values:
    - value: STANDARD
      desc: Standard price.
    - value: CUSTOMIZED
      desc: Fixed price.
