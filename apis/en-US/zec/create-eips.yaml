name: CreateEips
product: zec
use: create-eips
short: Creates one or more elastic IPs
long: |-
  Create one or more elastic IPs.
  **Notes**

  * You can call [`DescribeEipRegions`](describeeipregions.md) to query the regions that support elastic IPs.
  * You can call [`DescribeEipInternetChargeTypes`](describeeipinternetchargetypes.md) to query the network billing methods supported by public IPs.
  * If you need to create a `Remote EIP`, you can first call [`DescribeEipRemoteRegions`](describeeipremoteregions.md) to query the supported remote regions.
  * If you need to allocate via a `CIDR`, you can first call [`DescribeCidrs`](../cidr-block/describecidrs.md) to query the `CIDR` blocks under your account.
  * If binding to an instance at the same time, ensure that the `primary private IP` on the selected instance's `primary network interface` can still be assigned an EIP.
examples:
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 1 --name Test-EIP --internet-charge-type ByTrafficPackage --network-line-type PremiumBGP --bandwidth 50 --flow-package 10 --rate-limit-mode LOOSE
  desc: Create a public elastic IP on a BGP line, billed by traffic package. The traffic package size is 10TB. The bandwidth limit is 50Mbps.
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 2 --name Test-EIP --internet-charge-type ByBandwidth --cidr-id <cidrId> --bandwidth 50
  desc: Allocate 2 public elastic IPs from a CIDR block, billed by fixed bandwidth. The bandwidth limit is 50Mbps.
- cmd: zeno zec create-eips --region-id na-east-1 --amount 1 --name Test-EIP --internet-charge-type BandwidthCluster --cluster-id <clusterId> --cidr-id <cidrId> --prefix-length 32 --instance-ids <instanceId> --bind-type FullNat
  desc: Allocate a single `/32` elastic IP from a BYOIP `CIDR` (e.g. `128.0.0.0/24`) and bind it to an instance. `prefixLength` defaults to 32 and can be omitted; both NAT mode (default) and `Passthrough` mode are supported.
- cmd: zeno zec create-eips --region-id na-east-1 --amount 1 --name Test-EIP --internet-charge-type BandwidthCluster --cluster-id <clusterId> --cidr-id <cidrId> --prefix-length 24 --instance-ids <instanceId> --bind-type Passthrough
  desc: Allocate a `/24` elastic IP (EIP Block) from a BYOIP `CIDR` with a `/24` mask and bind it to an instance. A `/24` BYOIP `CIDR` can only allocate a single `/24` EIP, so `amount` can only be 1. An EIP Block (`prefixLength` less than 32) only supports `Passthrough` binding mode, not NAT mode.
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 3 --name Test-EIP --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth 50 --instance-id <instanceId>
  desc: Create 3 public elastic IPs, all bound to the same instance (`instanceId`).
- cmd: zeno zec create-eips --region-id asia-east-1 --amount 2 --name Test-EIP --internet-charge-type ByBandwidth --network-line-type PremiumBGP --bandwidth 50 --instance-ids <instanceId1> --instance-ids <instanceId2>
  desc: Create 2 public elastic IPs, each bound to a different instance (`instanceIds`, the quantity must match `amount`).
sdk:
  service: zec
  version: '2025-09-01'
  action: CreateEips
parameters:
- name: region-id
  type: string
  required: true
  sdk-field: regionId
  description: Region ID.
- name: name
  type: string
  required: true
  sdk-field: name
  description: |-
    Name of the elastic IP.
    This parameter must start with a number or a letter, containing 2 to 63 characters. Only letters, numbers, - and periods (.) are supported.
- name: internet-charge-type
  type: enum
  required: true
  sdk-field: internetChargeType
  description: Network billing method of the elastic IP.
  enum-values:
  - value: ByBandwidth
    desc: Billed by the flat rate bandwidth.
  - value: ByTrafficPackage
    desc: Billed by the traffic package size purchased.
  - value: BandwidthCluster
    desc: Billed by the burstable 95th bandwidth of all compute resources in a city-based or regional bandwidth cluster with a shared commitment.
- name: amount
  type: integer
  required: false
  sdk-field: amount
  description: Quantity.
- name: prefix-length
  type: integer
  required: false
  sdk-field: prefixLength
  description: |-
    Prefix length. Value range: 20–32. Default: 32.
    When a value less than 32 is specified, an EIP Block resource is created; cidrId must also be specified, and the value must not be less than the prefix length of the selected CIDR itself.
- name: eip-v4-type
  type: enum
  required: false
  sdk-field: eipV4Type
  description: |-
    Network types of public IPv4.
    Deprecated. Please use networkLineType instead.
  deprecated: true
  enum-values:
  - value: BGPLine
    desc: BGP network type.
  - value: CN2Line
    desc: CN2 GIA (CN2 Global Internet Access) network type.
  - value: LocalLine
    desc: Local IP network type.
  - value: ChinaMobile
    desc: China Mobile network type.
  - value: ChinaUnicom
    desc: China Unicom network type.
  - value: ChinaTelecom
    desc: China Telecom network type.
  - value: Cogent
    desc: Cogent Communications network type.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
- name: network-line-type
  type: enum
  required: false
  sdk-field: networkLineType
  description: Network types of public IPv4.
  enum-values:
  - value: PremiumBGP
    desc: |-
      Premium BGP network.
      High-performance network.
  - value: CN2
    desc: China Telecom CN2 network.
  - value: PathBasedBandwidthIP
    desc: Multi-path bandwidth IP.
  - value: LocalLine
    desc: Provided by a local ISP.
  - value: StandardBGP
    desc: |-
      Standard BGP network.
      General-purpose network with cost optimization.
  - value: CMI
    desc: 1-Line IP China Mobile.
  - value: CUG
    desc: 1-Line IP China Unicom.
  - value: CTG
    desc: 1-Line IP China Telecom.
- name: primary-isp
  type: enum
  required: false
  sdk-field: primaryIsp
  description: ISP of the primary public IP.
  deprecated: true
  enum-values:
  - value: BGP
    desc: Premium BGP.
  - value: CN2
    desc: China dedicated line.
  - value: PathBasedBandwidth
    desc: Multi-path bandwidth IP.
  - value: LOCAL
    desc: Local IP.
  - value: CHINA_MOBILE
    desc: China Mobile.
  - value: CHINA_UNICOM
    desc: China Unicom.
  - value: CHINA_TELECOM
    desc: China Telecom.
  - value: COGENT
    desc: Standard BGP.
- name: bandwidth
  type: integer
  required: false
  sdk-field: bandwidth
  description: |-
    Bandwidth limit of the elastic IP.
    Unit: Mbps.
- name: cidr-id
  type: string
  required: false
  sdk-field: cidrId
  description: |-
    CIDR ID.
    If this parameter is specified, eipV4Type must be empty.
- name: public-ip
  type: string
  required: false
  sdk-field: publicIp
  description: |-
    Creates an EIP starting from the specified public IP address.
    When cidrId is not specified, the address is allocated sequentially from the public IP pool starting at this address (only prefixLength of 32 is supported); when cidrId is specified, the address is allocated starting at this address within that CIDR block.
    When prefixLength is 32, provide a plain IPv4 address; when prefixLength is less than 32, cidrId must also be specified, and you must provide a starting subnet with a mask (the mask must match prefixLength, e.g. 88.0.5.64/26).
    When cidrId is specified, this starting address or subnet must be one of the currently allocatable candidates within the selected CIDR block.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: Resource group ID for the elastic public IP. If not specified, the IP will be placed in the default resource group.
- name: flow-package
  type: float
  required: false
  sdk-field: flowPackage
  description: |-
    Traffic package size of the EIP.
    Unit: TB.
    The value must be 0 or a multiple of 0.1.
    Required when the network billing type is traffic package billing (ByTrafficPackage).
    Can only be set when the billing period is monthly; hourly billing is not supported.
- name: cluster-id
  type: string
  required: false
  sdk-field: clusterId
  description: |-
    Shared bandwidth package ID.
    Required when the network billing method is shared bandwidth package billing (BandwidthCluster).
- name: peer-region-id
  type: string
  required: false
  sdk-field: peerRegionId
  description: Remote region ID.
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: Information on marketing campaigns.
  object-schema:
  - name: discountCode
    type: string
    description: |-
      Promo Code.
      If no Promo Code exists, the final discount will not apply.
  - name: usePocVoucher
    type: boolean
    description: |-
      Whether to use POC voucher.
      If no POC voucher exists, the related creation will fail.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Bound tags when creating the elastic IP.
    Tag keys must be unique.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: 'Tag key. Length limit: 1 to 64 characters.'
  - name: value
    type: string
    description: 'Tag value. Length limit: 1 to 64 characters.'
- name: instance-id
  type: string
  required: false
  sdk-field: instanceId
  description: |-
    The instance ID to be bound.
    All EIPs created in this batch are bound to this instance.
- name: instance-ids
  type: string-array
  required: false
  sdk-field: instanceIds
  description: |-
    Set of instance IDs to bind.
    The quantity must match the amount field, with each EIP bound to a different instance; if passed together with instanceId, instanceId takes precedence.
- name: bind-type
  type: enum
  required: false
  sdk-field: bindType
  description: |-
    Binding mode.
    Effective when instanceIds is specified.
    Defaults to standard NAT mode.
    When prefixLength is less than 32 (EIP Block), the value can only be Passthrough.
  enum-values:
  - value: FullNat
    desc: NAT mode.
  - value: Passthrough
    desc: Bypass mode.
- name: rate-limit-mode
  type: enum
  required: false
  sdk-field: rateLimitMode
  description: |-
    Rate limit mode.
    STRICT (strict mode) requires bandwidth to be specified at the same time.
  enum-values:
  - value: LOOSE
    desc: 'Loose mode: allows short-term bursts exceeding the limit.'
  - value: STRICT
    desc: 'Strict mode: strictly enforced, no bursts allowed.'
response:
- name: eipIds
  type: string-array
  description: ID list of elastic IPs.
- name: orderNumber
  type: string
  description: Order No.
