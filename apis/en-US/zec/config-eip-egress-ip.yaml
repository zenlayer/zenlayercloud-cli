name: ConfigEipEgressIp
product: zec
use: config-eip-egress-ip
short: Sets the egress elastic IP
long: |-
  Set the egress elastic IP.
  **Notes**

  * The elastic IP being operated on must be bound to a network interface. If it is unbound, or bound to a NAT gateway/load balancer instance, this operation is not supported.
sdk:
  service: zec
  version: '2025-09-01'
  action: ConfigEipEgressIp
parameters:
- name: eip-id
  type: string
  required: true
  sdk-field: eipId
  description: ID of elastic IP.
