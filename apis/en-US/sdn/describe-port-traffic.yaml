name: DescribePortTraffic
product: sdn
use: describe-port-traffic
short: Query Port Traffic
long: Query Port Traffic
sdk:
  service: sdn
  version: '2026-04-01'
  action: DescribePortTraffic
parameters:
- name: port-id
  type: string
  required: true
  sdk-field: portId
  description: Port ID.
- name: start-time
  type: string
  required: true
  sdk-field: startTime
  description: 'Query start time, in ISO 8601 UTC format: YYYY-MM-DDThh:mm:ssZ.'
- name: end-time
  type: string
  required: true
  sdk-field: endTime
  description: 'Query end time, in ISO 8601 UTC format: YYYY-MM-DDThh:mm:ssZ.'
response:
- name: dataList
  type: object-array
  description: List of traffic data points.
  array-style: json
  item-schema:
  - name: internetRX
    type: integer
    description: |-
      Inbound bandwidth value.
      Unit: bps.
  - name: internetTX
    type: integer
    description: |-
      Outbound bandwidth value.
      Unit: bps.
  - name: time
    type: string
    description: |-
      Data timestamp.
      In ISO 8601 format, UTC timezone.
      Format: YYYY-MM-ddTHH:mm:ssZ.
- name: in95
  type: integer
  description: Inbound 95th percentile peak traffic.
- name: inAvg
  type: integer
  description: Average inbound traffic.
- name: inMax
  type: integer
  description: Maximum inbound traffic.
- name: inMin
  type: integer
  description: Minimum inbound traffic.
- name: out95
  type: integer
  description: Outbound 95th percentile peak traffic.
- name: outAvg
  type: integer
  description: Average outbound traffic.
- name: outMax
  type: integer
  description: Maximum outbound traffic.
- name: outMin
  type: integer
  description: Minimum outbound traffic.
- name: unit
  type: string
  description: Traffic unit, e.g. bps.
