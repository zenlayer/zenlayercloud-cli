      desc: Created via the VIP process.
  - name: tags
    type: object
    description: Associated tags.
    object-schema:
    - name: tags
      type: object-array
      description: List of tag pairs.
      array-style: json
      item-schema:
      - name: key
        type: string
        description: |-
          Tag key.
          Length: 1-64 characters.
      - name: value
        type: string
        description: |-
