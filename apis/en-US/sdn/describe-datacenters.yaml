name: DescribeDatacenters
product: sdn
use: describe-datacenters
short: Query Data Centers
long: Query Data Centers
sdk:
  service: sdn
  version: '2026-04-01'
  action: DescribeDatacenters
parameters:
- name: dc-ids
  type: string-array
  required: false
  sdk-field: dcIds
  description: List of data center four-letter codes, composed of the airport three-letter code plus a numeric suffix.
- name: is-port-available
  type: boolean
  required: false
  sdk-field: isPortAvailable
  description: 'Filter data centers by whether they support creating new data center ports (true: supported, false: not supported).'
response:
- name: dcSet
  type: object-array
  description: Result set.
  array-style: json
  item-schema:
  - name: dcId
    type: string
    description: Data center ID.
  - name: dcName
    type: string
    description: Data center name.
  - name: dcAddress
    type: string
    description: Data center address.
  - name: cityName
    type: string
    description: Name of the city.
  - name: countryName
    type: string
    description: Name of the country.
  - name: areaName
    type: string
    description: Name of the region.
  - name: latitude
    type: float
    description: Latitude.
  - name: longitude
    type: float
    description: Longitude.
  - name: isPortAvailable
    type: boolean
    description: Whether new data center ports can be created.
  - name: availableBandwidth
    type: integer
    description: Available bandwidth (Mbps).
  - name: regionId
    type: string
    description: Node ID.
