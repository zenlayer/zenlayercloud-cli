name: CreatePrivateConnect
product: sdn
use: create-private-connect
short: Create Private Connect
long: |-
  Create Private Connect
  **Notes**

  * Currently only postpaid fixed-bandwidth Private Connects can be created.
  * For cloud access operations, see the [Cloud Access Guide](https://docs.console.zenlayer.com/welcome/cloud-networking/get-started/validate-connection-in-public-cloud).
  * This is an asynchronous API. Once the create request is successfully submitted, a Private Connect `ID` is returned, but the create operation is not completed immediately. During this period the instance status will be **`DEPLOYING`**. The creation result can be checked by calling the [**`DescribePrivateConnects`**](describeprivateconnects.md) API -- if the status (privateConnectStatus) changes from `DEPLOYING` (creating) to **AVAILABLE**, the creation succeeded; if no record is found, the creation failed. Do not perform any operation on the Private Connect while it is being created.
examples:
- cmd: zeno sdn create-private-connect --private-connect-name fra-sel-prviate-line --bandwidth-mbps 10
  desc: Create a Private Connect where Endpoint A is a data center port and Endpoint Z is a port, with a bandwidth of 10 Mbps.
sdk:
  service: sdn
  version: '2026-04-01'
  action: CreatePrivateConnect
parameters:
- name: private-connect-name
  type: string
  required: true
  sdk-field: privateConnectName
  description: Private Connect name, up to 255 characters. Defaults to private-connect-{current timestamp}.
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: Maximum bandwidth limit for the Private Connect, in Mbps.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: Resource group ID. If not specified, the resource is placed in the default resource group.
- name: endpoint-a
  type: object
  required: true
  sdk-field: endpointA
  description: Endpoint A of the Private Connect.
  object-schema:
  - name: portId
    type: string
    description: |-
      Physical port ID.
      Used when the endpoint is a physical port.
  - name: vlanId
    type: integer
    description: VLAN ID.
  - name: cloudRegionId
    type: string
    description: |-
      Cloud region ID.
      Used when the endpoint is a Cloud Connect.
  - name: cloudAccountId
    type: string
    description: |-
      Cloud account ID.
      Used when the endpoint is a Cloud Connect.
  - name: haType
    type: enum
    description: HA type of the Cloud Connect.
    enum-values:
    - value: PRIMARY
      desc: Primary.
    - value: SECONDARY
      desc: Secondary.
  - name: cloudBandwidthMbps
    type: integer
    description: Cloud Connect bandwidth limit, in Mbps.
  - name: dcId
    type: string
    description: Data center ID.
  - name: cloudType
    type: enum
    description: Cloud vendor type.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: ORACLE
      desc: Oracle Cloud
  - name: endpointName
    type: string
    description: Endpoint name. Only letters, digits, and hyphens are allowed.
- name: endpoint-z
  type: object
  required: true
  sdk-field: endpointZ
  description: Endpoint Z of the Private Connect.
  object-schema:
  - name: portId
    type: string
    description: |-
      Physical port ID.
      Used when the endpoint is a physical port.
  - name: vlanId
    type: integer
    description: VLAN ID.
  - name: cloudRegionId
    type: string
    description: |-
      Cloud region ID.
      Used when the endpoint is a Cloud Connect.
  - name: cloudAccountId
    type: string
    description: |-
      Cloud account ID.
      Used when the endpoint is a Cloud Connect.
  - name: haType
    type: enum
    description: HA type of the Cloud Connect.
    enum-values:
    - value: PRIMARY
      desc: Primary.
    - value: SECONDARY
      desc: Secondary.
  - name: cloudBandwidthMbps
    type: integer
    description: Cloud Connect bandwidth limit, in Mbps.
  - name: dcId
    type: string
    description: Data center ID.
  - name: cloudType
    type: enum
    description: Cloud vendor type.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: ORACLE
      desc: Oracle Cloud
  - name: endpointName
    type: string
    description: Endpoint name. Only letters, digits, and hyphens are allowed.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Tags associated when creating the Private Connect.
    Note: associated tag keys must not be duplicated.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      Tag key.
      Length: 1-64 characters.
  - name: value
    type: string
    description: |-
      Tag value.
      Length: 1-64 characters.
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: Marketing activity information.
  object-schema:
  - name: discountCode
    type: string
    description: |-
      Discount code issued by marketing.
      If the discount code does not exist, the final discount will not apply.
  - name: usePocVoucher
    type: boolean
    description: |-
      Whether to use a POC voucher.
      If no POC voucher exists in the system, the related creation process will fail.
response:
- name: orderNumber
  type: string
  description: Order number.
- name: privateConnectId
  type: string
  description: Private Connect ID.
