name: CreateCloudRouter
product: sdn
use: create-cloud-router
short: Create Cloud Router
long: |-
  Create Cloud Router
  **Notes**

  * Currently only postpaid Cloud Routers can be created.
  * A VPC can join only one Cloud Router.
  * This is an asynchronous API. Once the create request is successfully submitted, a Cloud Router `ID` is returned, but the create operation is not completed immediately. During this period the instance status will be **`DEPLOYING`**. The creation result can be checked by calling the [**`DescribeCloudRouters`**](describe-cloud-routers.md) API -- if the status (`cloudRouterStatus`) changes from `DEPLOYING` (creating) to **RUNNING** (available), the creation succeeded; if no record is found, the creation failed. Do not perform any operation on the Cloud Router while it is being created.
examples:
- cmd: zeno sdn create-cloud-router --edge-points "{ipAddress=4.4.4.4/24, vlanId=1024, portId=your-portId, bgpConnection={password=, peerIpAddress=4.4.4.3, localAsn=62610, peerAsn=6543}, bandwidthMbps=1}" --edge-points "{vpcId=your vpc id, bandwidthMbps=1}" --cloud-router-name Test --cloud-router-description
  desc: Create a Cloud Router with 2 edge points, each with a bandwidth of 1 Mbps. One edge point is a port, and the other is a VPC.
sdk:
  service: sdn
  version: '2026-04-01'
  action: CreateCloudRouter
parameters:
- name: cloud-router-name
  type: string
  required: true
  sdk-field: cloudRouterName
  description: Name of the Cloud Router, up to 255 characters. Defaults to cloud-router-{timestamp} if not specified.
- name: cloud-router-description
  type: string
  required: false
  sdk-field: cloudRouterDescription
  description: Description of the Cloud Router, up to 255 characters.
- name: edge-points
  type: object-array
  required: true
  sdk-field: edgePoints
  description: Edge point information. At least 2 edge points are required.
  array-style: json
  item-schema:
  - name: edgePointName
    type: string
    description: Edge point name. Only letters, digits, and hyphens are allowed, up to 100 characters.
  - name: vpcId
    type: string
    description: VPC ID of a VPC edge point.
  - name: zbgId
    type: string
    description: ZBG ID of a ZBG edge point.
  - name: portId
    type: string
    description: Port ID of a physical port edge point.
  - name: cloudType
    type: enum
    description: Cloud vendor type of the Cloud Connect edge point.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: VOLCENGINE
      desc: Volcengine
    - value: ORACLE
      desc: Oracle Cloud
  - name: cloudAccountId
    type: string
    description: Cloud account ID of the Cloud Connect edge point.
  - name: dcId
    type: string
    description: Data center ID where the edge point resides.
  - name: cloudRegionId
    type: string
    description: Cloud region ID of the Cloud Connect edge point.
  - name: haType
    type: enum
    description: HA type of the Cloud Connect edge point.
    enum-values:
    - value: PRIMARY
      desc: Primary.
    - value: SECONDARY
      desc: Secondary.
  - name: vlanId
    type: integer
    description: 'VLAN ID of the edge point. Value range: 2-4000.'
  - name: bandwidthMbps
    type: integer
    description: Backbone bandwidth limit of the edge point, in Mbps.
  - name: cloudBandwidthMbps
    type: integer
    description: Cloud-side bandwidth limit of the Cloud Connect edge point, in Mbps.
  - name: ipAddress
    type: string
    description: Interconnect IP address and netmask of the edge point.
  - name: bgpConnection
    type: object
    description: BGP connection configuration of the edge point. Choose either this or static routes.
    object-schema:
    - name: peerIpAddress
      type: string
      description: Peer interconnect IP address and netmask.
    - name: peerAsn
      type: integer
      description: Peer BGP ASN.
    - name: password
      type: string
      description: MD5 password for the BGP session, up to 32 characters.
    - name: localAsn
      type: integer
      description: Local BGP ASN.
  - name: staticRoutes
    type: object-array
    description: Static route configuration of the edge point. Choose either this or a BGP connection.
    array-style: json
    item-schema:
    - name: prefix
      type: string
      description: Destination CIDR of the static route.
    - name: nextHop
      type: string
      description: Next-hop IP address of the static route.
  - name: ipSecTunnel
    type: string
    description: 'IPSec tunnel type. Valid values: FQDN or RemoteIP.'
  - name: customerPublicIP
    type: string
    description: Customer-side public IP address for IPSec.
  - name: customerPrivateIP
    type: string
    description: Customer-side private IP address for IPSec.
  - name: virtualEdgePrivateIP
    type: string
    description: Virtual Edge-side private IP address for IPSec.
  - name: psk
    type: string
    description: Pre-shared key (PSK) for IPSec.
  - name: enableHealthCheck
    type: boolean
    description: Whether to enable health check. Disabled by default.
  - name: backupIpSec
    type: object
    description: Backup IPSec tunnel configuration.
    object-schema:
    - name: dcId
      type: string
      description: ID of the data center where the backup IPSec tunnel resides.
    - name: password
      type: string
      description: Authentication password for the backup IPSec tunnel, 8-64 characters.
    - name: customerPrivateIP
      type: string
      description: Customer-side private IP address of the backup IPSec tunnel.
    - name: virtualEdgePrivateIP
      type: string
      description: Virtual Edge-side private IP address of the backup IPSec tunnel.
    - name: psk
      type: string
      description: Pre-shared key (PSK) for the backup IPSec tunnel.
  - name: ipSecBgpConnection
    type: object
    description: BGP connection configuration for IPSec. Choose either this or IPSec static routes.
    object-schema:
    - name: customerAsn
      type: integer
      description: Customer-side BGP ASN.
    - name: virtualEdgeAsn
      type: integer
      description: Virtual Edge-side BGP ASN.
    - name: password
      type: string
      description: Authentication password for the BGP session, 8-64 characters.
  - name: ipSecStaticRoutes
    type: object-array
    description: Static route configuration for IPSec. Choose either this or an IPSec BGP connection.
    array-style: json
    item-schema:
    - name: cidr
      type: string
      description: Destination CIDR of the static route.
- name: resource-group-id
  type: string
  required: false
  sdk-field: resourceGroupId
  description: Resource group ID. If not specified, the resource is placed in the default resource group.
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: Marketing activity information.
  object-schema:
  - name: discountCode
    type: string
    description: |-
      Discount code issued by marketing.
      If the discount code does not exist, the final discount will not apply.
  - name: usePocVoucher
    type: boolean
    description: |-
      Whether to use a POC voucher.
      If no POC voucher exists in the system, the related creation process will fail.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Tags associated when creating the Cloud Router.
    Note: associated tag keys must not be duplicated.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      Tag key.
      Length: 1-64 characters.
  - name: value
    type: string
    description: |-
      Tag value.
      Length: 1-64 characters.
response:
- name: cloudRouterId
  type: string
  description: Cloud Router ID.
