name: CreatePort
product: sdn
use: create-port
short: Create Port
long: |-
  Create Port
  **Notes**

  * This is an asynchronous API. Once the create-port request is successfully submitted, a list of port `ID`s is returned, but the create operation is not completed immediately. During this period the port status will be **`CREATING`**. You can check the result by calling **[DescribePorts](describeports.md#describeports)** — if the port status changes from **`CREATING`** to **`RUNNING`**, the port was created successfully; otherwise it is still being created. Do not perform any operation on the port while it is being created.
sdk:
  service: sdn
  version: '2026-04-01'
  action: CreatePort
parameters:
- name: dc-id
  type: string
  required: true
  sdk-field: dcId
  description: Data center four-letter code. Obtainable via the ~~DescribeDataCenters~~ API.
- name: port-name
  type: string
  required: true
  sdk-field: portName
  description: Port name, up to 255 characters. It is recommended to use the data center four-letter code plus the port spec.
- name: port-remarks
  type: string
  required: false
  sdk-field: portRemarks
  description: Port remarks, up to 255 characters.
- name: port-type
  type: string
  required: true
  sdk-field: portType
  description: 'Port spec. Obtainable via the ~~DescribeDataCenterPortPrice~~ API. Valid values: 1G | 10G | 40G | 100G | 400G.'
- name: business-entity-name
  type: string
  required: true
  sdk-field: businessEntityName
  description: Business entity name, used as the LOA letterhead.
- name: marketing-options
  type: object
  required: false
  sdk-field: marketingOptions
  description: Marketing activity information.
  object-schema:
  - name: discountCode
    type: string
    description: |-
      Discount code issued by marketing.
      If the discount code does not exist, the final discount will not apply.
  - name: usePocVoucher
    type: boolean
    description: |-
      Whether to use a POC voucher.
      If no POC voucher exists in the system, the related creation process will fail.
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  sdk-wrapper: tags
  description: |-
    Tags associated when creating the port.
    Note: associated tag keys must not be duplicated.--tags 'key=env,value=prod'
  array-style: kv
  item-schema:
  - name: key
    type: string
    description: |-
      Tag key.
      Length: 1-64 characters.
  - name: value
    type: string
    description: |-
      Tag value.
      Length: 1-64 characters.
response:
- name: orderNumber
  type: string
  description: The order number generated by creating the port.
- name: portId
  type: string
  description: The ID of the successfully created port.
