name: QueryDataCenterPortPrice
product: sdn
use: query-data-center-port-price
short: Inquiry Data Center Port Price
long: Inquiry Data Center Port Price
examples:
- cmd: zeno sdn query-data-center-port-price --dc-id SIN1 --port-type 10G --build-cross-connect-with-assisted false
  desc: Inquire the price for a data center port, where the user builds the Cross Connect themselves.
sdk:
  service: sdn
  version: '2026-04-01'
  action: QueryDataCenterPortPrice
parameters:
- name: dc-id
  type: string
  required: true
  sdk-field: dcId
  description: Data center ID. The latest list of data centers can be obtained via the ~~DescribeDataCenters~~ API.
- name: port-type
  type: string
  required: true
  sdk-field: portType
  description: Port spec. The latest port spec list can be obtained via the ~~DescribeDataCenterPortPrice~~ API.
- name: build-cross-connect-with-assisted
  type: boolean
  required: false
  sdk-field: buildCrossConnectWithAssisted
  description: |-
    Whether Zenlayer-assisted Cross Connect construction is required.
    If true, the price includes the Cross Connect patch cord fee and the one-time construction fee.
    Default: false, meaning the user builds the Cross Connect themselves.
response:
- name: crossConnectPrice
  type: object
  description: |-
    Cross Connect price.
    This value is null if the current data center does not support Zenlayer-assisted Cross Connect construction.
  object-schema:
  - name: discount
    type: float
    description: |-
      Discount rate.
      E.g. 80.0 means 20% off.
  - name: discountPrice
    type: float
    description: |-
      Discounted postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: originalPrice
    type: float
    description: |-
      Original prepaid price.
      Used in prepaid mode; null for postpaid.
  - name: unitPrice
    type: float
    description: |-
      Original postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: discountUnitPrice
    type: float
    description: |-
      Discounted postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: chargeUnit
    type: string
    description: |-
      Postpaid billing unit.
      Used in postpaid mode. Possible values:<br/>HOUR: billed per hour.
      DAY: billed per day.
      MONTH: billed per month, used for 95th-percentile billing.
  - name: stepPrices
    type: object-array
    description: |-
      Postpaid tiered pricing.
      Used in postpaid mode; null if not a tiered price.
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: Lower bound of the tier.
    - name: stepEnd
      type: float
      description: |-
        Upper bound of the tier.
        Null represents the last tier.
    - name: unitPrice
      type: float
      description: Tier unit price.
    - name: discountUnitPrice
      type: float
      description: Discounted tier unit price.
  - name: amountUnit
    type: string
    description: |-
      Usage unit.
      E.g. Mbps, LCU, etc.
      If null, the value is unavailable.
  - name: excessUnitPrice
    type: float
    description: Original excess price.
  - name: excessDiscountUnitPrice
    type: float
    description: Discounted excess price.
  - name: excessAmountUnit
    type: string
    description: |-
      Excess usage unit.
      If null, the value is unavailable.
  - name: category
    type: enum
    description: Price category.
    enum-values:
    - value: STANDARD
      desc: Standard price.
    - value: CUSTOMIZED
      desc: Fixed price.
- name: crossConnectOneTimeConstructionPrice
  type: object
  description: |-
    Cross Connect one-time construction fee.
    This value is null if the current data center does not support Zenlayer-assisted Cross Connect construction.
  object-schema:
  - name: discount
