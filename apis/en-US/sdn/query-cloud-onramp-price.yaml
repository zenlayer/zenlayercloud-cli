name: QueryCloudOnrampPrice
product: sdn
use: query-cloud-onramp-price
short: Inquiry Cloud Connect Bandwidth Price
long: Inquiry Cloud Connect Bandwidth Price
examples:
- cmd: zeno sdn query-cloud-onramp-price --dc-id SIN1 --cloud-type AWS --vlan-id 100 --cloud-region-id eu-west-1 --bandwidth-mbps 10
  desc: Inquire the price for AWS Cloud Connect bandwidth, including stock.
sdk:
  service: sdn
  version: '2026-04-01'
  action: QueryCloudOnrampPrice
parameters:
- name: cloud-type
  type: enum
  required: true
  sdk-field: cloudType
  description: |-
    Cloud Connect type.
    Valid values: AWS | TENCENT | GOOGLE | ALI_CLOUD | AZURE | HUAWEI_CLOUD.
  enum-values:
  - value: AWS
    desc: Amazon Web Services
  - value: TENCENT
    desc: Tencent Cloud
  - value: GOOGLE
    desc: Google Cloud
  - value: AZURE
    desc: Microsoft Azure
  - value: ALI_CLOUD
    desc: Alibaba Cloud
  - value: HUAWEI_CLOUD
    desc: Huawei Cloud
  - value: BYTE_PLUS
    desc: BytePlus
  - value: VOLCENGINE
    desc: Volcengine
  - value: ORACLE
    desc: Oracle Cloud
- name: dc-id
  type: string
  required: true
  sdk-field: dcId
  description: Data center ID of the Cloud Connect.
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: |-
    Maximum bandwidth limit for the Cloud Connect.
    Default: 10, unit: Mbps.
- name: vlan-id
  type: integer
  required: false
  sdk-field: vlanId
  description: VLAN ID.
- name: cloud-region-id
  type: string
  required: false
  sdk-field: cloudRegionId
  description: |-
    Public cloud region ID.
    Not required for Google Cloud.
response:
- name: price
  type: object
  description: Price information.
  object-schema:
  - name: discount
    type: float
    description: |-
      Discount rate.
      E.g. 80.0 means 20% off.
  - name: discountPrice
    type: float
    description: |-
      Discounted postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: originalPrice
    type: float
    description: |-
      Original prepaid price.
      Used in prepaid mode; null for postpaid.
  - name: unitPrice
    type: float
    description: |-
      Original postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: discountUnitPrice
    type: float
    description: |-
      Discounted postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: chargeUnit
    type: string
    description: |-
      Postpaid billing unit.
      Used in postpaid mode. Possible values:<br/>HOUR: billed per hour.
      DAY: billed per day.
      MONTH: billed per month, used for 95th-percentile billing.
  - name: stepPrices
    type: object-array
    description: |-
      Postpaid tiered pricing.
      Used in postpaid mode; null if not a tiered price.
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: Lower bound of the tier.
    - name: stepEnd
      type: float
      description: |-
        Upper bound of the tier.
        Null represents the last tier.
    - name: unitPrice
      type: float
      description: Tier unit price.
    - name: discountUnitPrice
      type: float
      description: Discounted tier unit price.
  - name: amountUnit
    type: string
    description: |-
      Usage unit.
      E.g. Mbps, LCU, etc.
      If null, the value is unavailable.
  - name: excessUnitPrice
    type: float
    description: Original excess price.
  - name: excessDiscountUnitPrice
    type: float
    description: Discounted excess price.
  - name: excessAmountUnit
    type: string
    description: |-
      Excess usage unit.
      If null, the value is unavailable.
  - name: category
    type: enum
    description: Price category.
    enum-values:
    - value: STANDARD
      desc: Standard price.
    - value: CUSTOMIZED
      desc: Fixed price.
- name: stock
  type: integer
  description: Available stock quantity.
