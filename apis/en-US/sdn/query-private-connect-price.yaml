name: QueryPrivateConnectPrice
product: sdn
use: query-private-connect-price
short: Inquiry Private Connect Price
long: Inquiry Private Connect Price
examples:
- cmd: zeno sdn query-private-connect-price --internet-type ByBandwidth --bandwidth-mbps 50
  desc: Inquire the price for a Private Connect with a bandwidth of 10 Mbps, where Endpoint A is a data center port and Endpoint Z is a public cloud.
sdk:
  service: sdn
  version: '2026-04-01'
  action: QueryPrivateConnectPrice
parameters:
- name: internet-type
  type: enum
  required: true
  sdk-field: internetType
  description: |-
    Internet billing type.
    Default: ByBandwidth.
  enum-values:
  - value: ByBandwidth
    desc: Fixed bandwidth billing.
  - value: ByInstanceBandwidth95
    desc: 95th percentile billing.
- name: bandwidth-mbps
  type: integer
  required: true
  sdk-field: bandwidthMbps
  description: |-
    Maximum bandwidth limit for the Private Connect.
    Default: 10, unit: Mbps.
- name: endpoint-a
  type: object
  required: true
  sdk-field: endpointA
  description: Endpoint A information of the Private Connect.
  object-schema:
  - name: dcId
    type: string
    description: Data center ID. The latest list of data centers can be obtained via the ~~DescribeDataCenters~~ API.
  - name: cloudType
    type: enum
    description: Cloud Connect type.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: ORACLE
      desc: Oracle Cloud
  - name: bandwidthMbps
    type: integer
    description: |-
      Maximum bandwidth limit for the Cloud Connect.
      Default: 10, unit: Mbps.
  - name: vlanId
    type: integer
    description: VLAN ID.
  - name: cloudRegionId
    type: string
    description: |-
      Public cloud region ID.
      Not required for Google Cloud.
  - name: portType
    type: string
    description: Port spec. The latest port spec list can be obtained via the ~~DescribeDataCenterPortPrice~~ API.
  - name: buildCrossConnectWithAssisted
    type: boolean
    description: |-
      Whether Zenlayer-assisted Cross Connect construction is required.
      If true, the price includes the Cross Connect patch cord fee and the one-time construction fee.
      Default: false, meaning the user builds the Cross Connect themselves.
- name: endpoint-z
  type: object
  required: true
  sdk-field: endpointZ
  description: Endpoint Z information of the Private Connect.
  object-schema:
  - name: dcId
    type: string
    description: Data center ID. The latest list of data centers can be obtained via the ~~DescribeDataCenters~~ API.
  - name: cloudType
    type: enum
    description: Cloud Connect type.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: ORACLE
      desc: Oracle Cloud
  - name: bandwidthMbps
    type: integer
    description: |-
      Maximum bandwidth limit for the Cloud Connect.
      Default: 10, unit: Mbps.
  - name: vlanId
    type: integer
    description: VLAN ID.
  - name: cloudRegionId
    type: string
    description: |-
      Public cloud region ID.
      Not required for Google Cloud.
  - name: portType
    type: string
    description: Port spec. The latest port spec list can be obtained via the ~~DescribeDataCenterPortPrice~~ API.
  - name: buildCrossConnectWithAssisted
    type: boolean
    description: |-
      Whether Zenlayer-assisted Cross Connect construction is required.
      If true, the price includes the Cross Connect patch cord fee and the one-time construction fee.
      Default: false, meaning the user builds the Cross Connect themselves.
response:
- name: endpointAPrice
  type: object
  description: Price information for Endpoint A of the Private Connect.
  object-schema:
  - name: crossConnectPrice
    type: object
    description: |-
      Cross Connect price.
      Populated when the endpoint type is a data center port and the data center supports Zenlayer-assisted Cross Connect construction.
    object-schema:
    - name: discount
      type: float
      description: |-
        Discount rate.
        E.g. 80.0 means 20% off.
    - name: discountPrice
      type: float
      description: |-
        Discounted postpaid unit price.
        Used in postpaid mode; null if the price is a tiered price.
    - name: originalPrice
      type: float
      description: |-
        Original prepaid price.
        Used in prepaid mode; null for postpaid.
    - name: unitPrice
      type: float
      description: |-
        Original postpaid unit price.
        Used in postpaid mode; null if the price is a tiered price.
    - name: discountUnitPrice
      type: float
      description: |-
        Discounted postpaid unit price.
        Used in postpaid mode; null if the price is a tiered price.
    - name: chargeUnit
      type: string
      description: |-
        Postpaid billing unit.
        Used in postpaid mode. Possible values:<br/>HOUR: billed per hour.
        DAY: billed per day.
        MONTH: billed per month, used for 95th-percentile billing.
    - name: stepPrices
      type: object-array
      description: |-
        Postpaid tiered pricing.
        Used in postpaid mode; null if not a tiered price.
      array-style: json
      item-schema:
      - name: stepStart
        type: float
        description: Lower bound of the tier.
      - name: stepEnd
        type: float
        description: |-
          Upper bound of the tier.
          Null represents the last tier.
      - name: unitPrice
        type: float
        description: Tier unit price.
      - name: discountUnitPrice
        type: float
        description: Discounted tier unit price.
    - name: amountUnit
      type: string
      description: |-
        Usage unit.
        E.g. Mbps, LCU, etc.
        If null, the value is unavailable.
    - name: excessUnitPrice
      type: float
      description: Original excess price.
    - name: excessDiscountUnitPrice
      type: float
      description: Discounted excess price.
    - name: excessAmountUnit
      type: string
      description: |-
        Excess usage unit.
        If null, the value is unavailable.
    - name: category
      type: enum
      description: Price category.
      enum-values:
      - value: STANDARD
        desc: Standard price.
      - value: CUSTOMIZED
        desc: Fixed price.
  - name: crossConnectOneTimeConstructionPrice
    type: object
    description: |-
