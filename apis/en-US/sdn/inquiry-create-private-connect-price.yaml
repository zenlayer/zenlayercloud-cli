name: InquiryCreatePrivateConnectPrice
product: sdn
use: inquiry-create-private-connect-price
short: Inquiry Private Connect Price
long: Inquiry Private Connect Price
examples:
- cmd: zeno sdn inquiry-create-private-connect-price
  desc: Inquire the price for a Private Connect (both Endpoint A and Endpoint Z are ports), with the default bandwidth of 1 Mbps.
sdk:
  service: sdn
  version: '2026-04-01'
  action: InquiryCreatePrivateConnectPrice
parameters:
- name: bandwidth-mbps
  type: integer
  required: false
  sdk-field: bandwidthMbps
  description: 'Maximum bandwidth limit for the Private Connect. Default: 1, unit: Mbps.'
- name: internet-type
  type: enum
  required: false
  sdk-field: internetType
  description: Internet billing type.
  enum-values:
  - value: ByBandwidth
    desc: Fixed bandwidth billing.
  - value: ByInstanceBandwidth95
    desc: 95th percentile billing.
- name: commit-bandwidth
  type: integer
  required: false
  sdk-field: commitBandwidth
  description: Committed bandwidth, in Mbps.
- name: endpoint-a
  type: object
  required: true
  sdk-field: endpointA
  description: Endpoint A of the Private Connect.
  object-schema:
  - name: portId
    type: string
    description: |-
      Physical port ID.
      Used when the endpoint is a physical port.
  - name: vlanId
    type: integer
    description: VLAN ID.
  - name: cloudRegionId
    type: string
    description: |-
      Cloud region ID.
      Used when the endpoint is a Cloud Connect.
  - name: cloudAccountId
    type: string
    description: |-
      Cloud account ID.
      Used when the endpoint is a Cloud Connect.
  - name: haType
    type: enum
    description: HA type of the Cloud Connect.
    enum-values:
    - value: PRIMARY
      desc: Primary.
    - value: SECONDARY
      desc: Secondary.
  - name: cloudBandwidthMbps
    type: integer
    description: Cloud Connect bandwidth limit, in Mbps.
  - name: dcId
    type: string
    description: Data center ID.
  - name: cloudType
    type: enum
    description: Cloud vendor type.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: VOLCENGINE
      desc: Volcengine
    - value: ORACLE
      desc: Oracle Cloud
  - name: endpointName
    type: string
    description: Endpoint name. Only letters, digits, and hyphens are allowed.
- name: endpoint-z
  type: object
  required: true
  sdk-field: endpointZ
  description: Endpoint Z of the Private Connect.
  object-schema:
  - name: portId
    type: string
    description: |-
      Physical port ID.
      Used when the endpoint is a physical port.
  - name: vlanId
    type: integer
    description: VLAN ID.
  - name: cloudRegionId
    type: string
    description: |-
      Cloud region ID.
      Used when the endpoint is a Cloud Connect.
  - name: cloudAccountId
    type: string
    description: |-
      Cloud account ID.
      Used when the endpoint is a Cloud Connect.
  - name: haType
    type: enum
    description: HA type of the Cloud Connect.
    enum-values:
    - value: PRIMARY
      desc: Primary.
    - value: SECONDARY
      desc: Secondary.
  - name: cloudBandwidthMbps
    type: integer
    description: Cloud Connect bandwidth limit, in Mbps.
  - name: dcId
    type: string
    description: Data center ID.
  - name: cloudType
    type: enum
    description: Cloud vendor type.
    enum-values:
    - value: AWS
      desc: Amazon Web Services
    - value: TENCENT
      desc: Tencent Cloud
    - value: GOOGLE
      desc: Google Cloud
    - value: AZURE
      desc: Microsoft Azure
    - value: ALI_CLOUD
      desc: Alibaba Cloud
    - value: HUAWEI_CLOUD
      desc: Huawei Cloud
    - value: BYTE_PLUS
      desc: BytePlus
    - value: VOLCENGINE
      desc: Volcengine
    - value: ORACLE
      desc: Oracle Cloud
  - name: endpointName
    type: string
    description: Endpoint name. Only letters, digits, and hyphens are allowed.
response:
- name: privateConnectPrice
  type: object
  description: Bandwidth price of the Private Connect.
  object-schema:
  - name: discount
    type: float
    description: |-
      Discount rate.
      E.g. 80.0 means 20% off.
  - name: discountPrice
    type: float
    description: |-
      Discounted postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: originalPrice
    type: float
    description: |-
      Original prepaid price.
      Used in prepaid mode; null for postpaid.
  - name: unitPrice
    type: float
    description: |-
      Original postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: discountUnitPrice
    type: float
    description: |-
      Discounted postpaid unit price.
      Used in postpaid mode; null if the price is a tiered price.
  - name: chargeUnit
    type: string
    description: |-
      Postpaid billing unit.
      Used in postpaid mode. Possible values:<br/>HOUR: billed per hour.
      DAY: billed per day.
      MONTH: billed per month, used for 95th-percentile billing.
  - name: stepPrices
    type: object-array
    description: |-
      Postpaid tiered pricing.
      Used in postpaid mode; null if not a tiered price.
    array-style: json
    item-schema:
    - name: stepStart
      type: float
      description: Lower bound of the tier.
    - name: stepEnd
      type: float
      description: |-
        Upper bound of the tier.
        Null represents the last tier.
    - name: unitPrice
      type: float
      description: Tier unit price.
    - name: discountUnitPrice
      type: float
      description: Discounted tier unit price.
  - name: amountUnit
    type: string
    description: |-
      Usage unit.
      E.g. Mbps, LCU, etc.
      If null, the value is unavailable.
  - name: excessUnitPrice
    type: float
    description: Original excess price.
  - name: excessDiscountUnitPrice
    type: float
    description: Discounted excess price.
  - name: excessAmountUnit
    type: string
    description: |-
      Excess usage unit.
      If null, the value is unavailable.
  - name: category
    type: enum
    description: Price category.
    enum-values:
    - value: STANDARD
      desc: Standard price.
    - value: CUSTOMIZED
      desc: Fixed price.
- name: privateConnectBandwidth
  type: integer
  description: Bandwidth of the Private Connect.
- name: endpointAPrice
