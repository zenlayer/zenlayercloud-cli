name: DescribeResourceByTags
product: zrm
use: describe-resource-by-tags
short: Queries resources bound to tags
long: |-
  Query resources bound to tags.
  **Note**

  * At least one of `tags` or `tagKeys` must be provided.
examples:
- cmd: zeno zrm describe-resource-by-tags --tags "{key=env, value=production}" --tag-keys env
  desc: Retrieve all resources bound to tags
sdk:
  service: zrm
  version: '2025-10-14'
  action: DescribeResourceByTags
parameters:
- name: tags
  type: object-array
  required: false
  sdk-field: tags
  description: List of tags.
  array-style: json
  item-schema:
  - name: key
    type: string
    description: 'Tag key. Length limit: 1 to 64 characters.'
  - name: value
    type: string
    description: 'Tag value. Length limit: 1 to 64 characters.'
- name: tag-keys
  type: string-array
  required: false
  sdk-field: tagKeys
  description: List of tag keys.
response:
- name: totalCount
  type: integer
  description: Total number of resources bound to the specified tags.
- name: dataSet
  type: object-array
  description: List of resources bound to the specified tags.
  array-style: json
  item-schema:
  - name: resourceType
    type: string
    description: Resource type.
  - name: resourceUuid
    type: string
    description: ID of resource.
