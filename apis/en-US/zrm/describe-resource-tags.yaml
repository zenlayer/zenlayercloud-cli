name: DescribeResourceTags
product: zrm
use: describe-resource-tags
short: Retrieves all tags bound to a specific resource
long: Retrieve all tags bound to a specific resource.
examples:
- cmd: zeno zrm describe-resource-tags --resource-uuid 123456789012345678
  desc: Retrieve all tags bound to a resource
sdk:
  service: zrm
  version: '2025-10-14'
  action: DescribeResourceTags
parameters:
- name: resource-uuid
  type: string
  required: true
  sdk-field: resourceUuid
  description: The unique ID of the resource.
response:
- name: totalCount
  type: integer
  description: Total number of tags bound to the resource.
- name: dataSet
  type: object-array
  description: List of tags bound to the resource.
  array-style: json
  item-schema:
  - name: key
    type: string
    description: Tag key.
  - name: value
    type: string
    description: Tag value.
  - name: createdDate
    type: string
    description: Tag creation time.
